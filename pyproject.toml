[project]
name = "orbiters"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
# Every Python package of every project in the monorepo. One environment, one
# resolution, one `uv.lock`: that is the whole point of a single workspace, and it is
# what stops two projects installing two copies of SQLAlchemy at two versions. A new
# project adds its packages here and to `[tool.uv.workspace] members` below.
dependencies = [
  "pigrocrm-core", "pigrocrm-api", "pigrocrm-mcp",
  "rebase-core", "rebase-api", "rebase-mcp",
]

[tool.uv.workspace]
# Listed one by one rather than globbed. `projects/*/apps/*` would also match
# `projects/pigrocrm/apps/web`, which is a Vite app with no `pyproject.toml`, and uv
# refuses to start on a member that has none ("Workspace member ... is missing a
# pyproject.toml"). An explicit list also means the error you get after adding a
# project and forgetting this line names the package instead of a glob.
members = [
  "projects/pigrocrm/packages/core",
  "projects/pigrocrm/apps/api",
  "projects/pigrocrm/apps/mcp",
  "projects/hub/packages/core",
  "projects/hub/apps/api",
  "projects/hub/apps/mcp",
]

[tool.uv.sources]
pigrocrm-core = { workspace = true }
pigrocrm-api = { workspace = true }
pigrocrm-mcp = { workspace = true }
rebase-core = { workspace = true }
rebase-api = { workspace = true }
rebase-mcp = { workspace = true }

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-asyncio==1.4.0",
  "pytest-xdist==3.8.0",
  "testcontainers[postgres]==4.15.0",
  "httpx==0.28.1",
  "ruff==0.16.8",
  "mypy==2.3.0",
  "lxml-stubs==0.5.1",
  # openpyxl ships no inline types, so under `strict` every `from openpyxl import ...`
  # is an `import-untyped` error and the whole workbook builder degrades to `Any` --
  # which is exactly where a wrong `number_format` or a misspelled attribute would
  # hide. Same reason `lxml-stubs` is here. Only a dev dependency: stubs are read by
  # mypy, never imported at runtime, so they have no business in core's own
  # `[project].dependencies` (and the architecture test reads that list literally).
  "types-openpyxl==3.1.5.20260807",
  # The website's guide PDF (ORB-70) is typeset with pandoc and Typst, the same two
  # binaries PigroCRM's renderer uses, and neither reads the woff2 the brand ships or
  # a variable weight axis. fontTools decompresses that one file and pins the two
  # weights the site's stylesheet uses. `[woff]` is what brings brotli, without which
  # a woff2 cannot be opened at all. Also a runtime dependency of `rebase-core` since
  # REB-387, which typesets the contracts in the API; listed here too for the guide's
  # script.
  "fonttools[woff]==4.65.0",
]

# Both tables below name one project's paths explicitly, and grow by a few lines per
# project. That is deliberate: pytest resolves `testpaths` and mypy resolves `files`
# against the current working directory, not against the file they are written in, so
# a per-project config file that only works when you happen to `cd` into that project
# is a trap. Everything runs from the repository root; CI narrows to one project by
# passing that project's paths as arguments, which override both lists.
[tool.pytest.ini_options]
testpaths = [
  "projects/pigrocrm/packages/core/tests",
  "projects/pigrocrm/apps/api/tests",
  "projects/pigrocrm/apps/mcp/tests",
  "projects/hub/packages/core/tests",
  "projects/hub/apps/api/tests",
  "projects/hub/apps/mcp/tests",
]
# Two projects both have a `tests/test_migrations.py`, and every project after them will
# have one too. pytest's default `prepend` import mode names a test module by its
# basename alone, so the second one to be collected is a duplicate module name and the
# whole run stops before a single test executes -- which is what `uv run pytest -q` did
# the day `projects/hub` arrived. `importlib` names a module by its full path instead,
# so a basename only has to be unique inside its own directory.
#
# The cost of that mode is that pytest no longer inserts each test root into `sys.path`,
# and these suites do import their own neighbours by bare name (`fakes.fake_gmail`,
# `periodo_fiscale`, `test_mcp_invoice_ban`). `pythonpath` puts back exactly the six
# directories that insertion used to add, one per test root, listed the same way and for
# the same reason `testpaths` is: a glob here would also match a project with no tests.
addopts = "--import-mode=importlib"
pythonpath = [
  "projects/pigrocrm/packages/core/tests",
  "projects/pigrocrm/apps/api/tests",
  "projects/pigrocrm/apps/mcp/tests",
  "projects/hub/packages/core/tests",
  "projects/hub/apps/api/tests",
  "projects/hub/apps/mcp/tests",
  # Not a test root: the hub's typesetting scripts, so `test_contract_pdf.py` imports
  # `build_contract_pdf` by the name it has when it runs (see mypy_path above).
  "projects/hub/tools",
]
asyncio_mode = "auto"
# Nothing skips on either marker by default: a plan assertion that CI skips is a plan
# assertion that does not exist, so both run in `uv run pytest -q` and both run on the
# trunk. What they buy is a change-scoped PR gate that can leave out the two kinds of
# check whose result is not only about the code.
markers = [
  "slow: builds the 50 000-row inflated corpus; minutes, not seconds",
  # A plan is not a behaviour: it is what one PostgreSQL, holding one table in one
  # physical state, decided was cheapest. Where the two candidates sit within a few
  # percent of each other the winner changes with the machine and with what the rest
  # of the suite left in the table, so the same assertion passes on a 96-core devbox
  # and fails on a two-core runner with no line of code in between. Measured
  # 2026-09-08: 56.25..60.26 for the bitmap scan, twice, identical to the cent.
  "planner: asserts a query plan, whose outcome depends on the machine and not only on the code",
]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = [
  "projects/pigrocrm/packages/core/src",
  "projects/pigrocrm/apps/api/src",
  "projects/pigrocrm/apps/mcp/src",
  "projects/hub/packages/core/src",
  "projects/hub/apps/api/src",
  "projects/hub/apps/mcp/src",
  # The hub's two typesetting scripts are modules of one directory, not a package:
  # `test_contract_pdf.py` imports both by bare name, which is how Python resolves them
  # when either runs, and this is how mypy does too.
  "projects/hub/tools",
]
explicit_package_bases = true
# Matches what .github/workflows/ci.yml passes on the command line exactly, so the
# bare `uv run mypy` this repository's own task briefs name actually passes instead of
# failing on "Missing target module, package, files, or command" every time -- a gate
# that always fails trains people to read failure as normal, and read a real one as
# more of the same.
files = [
  "projects/pigrocrm/packages/core/src",
  "projects/pigrocrm/apps/api/src",
  "projects/pigrocrm/apps/mcp/src",
  "projects/hub/packages/core/src",
  "projects/hub/apps/api/src",
  "projects/hub/apps/mcp/src",
  # Not a package and not part of any project's runtime: the scripts that typeset the
  # guide the hub hands to a member (ORB-70) and the contracts a member signs (REB-386).
  # Named explicitly because they sit outside every `src` above and would otherwise be
  # checked by nothing.
  "projects/hub/tools",
]
