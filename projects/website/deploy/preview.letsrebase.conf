# preview.letsrebase.com -- the same path map as letsrebase.com, one environment
# behind it.
#
# This name exists so a change can be looked at on the server that will serve it,
# under the layout it will be served under, before a release tag exists. It mirrors
# `letsrebase.conf`'s path map and differs in the ports (every `-preview` container
# instead of every production one), in the CRM host the `/app` redirects name
# (`preview.pigro.letsrebase.com`, not `pigro.letsrebase.com`), and in the blocks that
# are preview's own: the `X-Robots-Tag` header and the `/robots.txt` location below.
#
#   website-preview-web    127.0.0.1:8083   (production: 8082)
#   orbiters-preview-api   127.0.0.1:8086   (production: 8084)
#   orbiters-preview-web   127.0.0.1:8087   (production: 8085)
#
# Keeping the two files the same shape is the point: a path that works here and not
# in production is a deploy difference, not a routing one. When `letsrebase.conf`
# gains a location, this file gains it too.
#
# **It is open, and nothing here may be a secret.** It was behind HTTP basic auth for
# an afternoon on 2026-09-10, and Lorenzo's call the same day removed it: a password
# nobody asked for is one more credential to hand around for a surface whose whole
# point is being easy to look at. What is left is narrower and needs nobody to
# remember anything: `X-Robots-Tag` on every answer, so this second copy of a public
# site does not become duplicate content, and a map that reaches preview containers
# only, so a click in here cannot walk out into production data. Anything that must
# not be read by whoever finds the URL does not belong on preview at all.
#
# TLS is added by `certbot --nginx`, which rewrites this file in place on the server.
# The copy here is the plain-HTTP source of truth; the copy in
# /etc/nginx/sites-available/ has certbot's 443 block on top of it and is edited in
# place rather than overwritten, or TLS disappears on the next change. That includes
# the `include /etc/nginx/snippets/website-security-headers.conf;` line below and the
# `Content-Security-Policy` header it carries (REB-275, enforcing since REB-306):
# paste it into the installed copy's existing server block, not over it.
# That snippet file itself (`deploy/security-headers.conf` in this directory) has to
# reach the host at that same path too, copied across whenever it changes.

server {
    listen 80;
    listen [::]:80;
    server_name preview.letsrebase.com;

    absolute_redirect off;
    client_max_body_size 1M;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # REB-275: HSTS, an enforcing CSP (flipped by REB-306), frame-ancestors, nosniff,
    # Permissions-Policy -- see deploy/security-headers.conf for what each line is and
    # why it lives here rather than in nginx.conf (this project's) or
    # projects/hub/deploy/nginx.conf.
    include /etc/nginx/snippets/website-security-headers.conf;

    # Renewal has to reach the challenge, and a crawler must not be told to index it
    # either. Both certbot authenticators (`--nginx` and `--webroot -w /var/www/html`)
    # go through this path.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Every answer already carries the header; this one says it in words too.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # The Orbiters hub (projects/hub): its API on 8086, its SPA on 8087.
    location = /api/community/signups {
        proxy_pass http://127.0.0.1:8086/api/community/signups;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    location = /api/orbiters/signups {
        proxy_pass http://127.0.0.1:8086/api/community/signups;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    # The hub's MCP server over HTTP (REB-213), a process of its own on 8089: an agent
    # with an admin's token talks here, and nothing else does.
    location ^~ /api/hub/mcp {
        proxy_pass http://127.0.0.1:8089/mcp;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    # The team builder's proposals (REB-516): Claude writes the team while the request
    # waits, and the hub's seam gives up after two attempts of 40 s, near 81 s. This
    # vhost's 60 s default would answer the visitor 504 while the proposal went on, its
    # slot held and a late answer written for nobody. 90 s: above the seam's own limit.
    # An exact match, which outranks `^~ /api/hub/` below whatever the order; the rest
    # mirrors that block. A by-hand change on the host, as the MCP block above was
    # (projects/hub/AGENTS.md, «The team builder»).
    location = /api/hub/team/proposals {
        client_max_body_size 6M;
        proxy_pass http://127.0.0.1:8086;
        include /etc/nginx/snippets/orbiters-proxy.conf;
        proxy_read_timeout 90s;
    }
    # The same builder inside the talent cloud (REB-519): the same call, the same wait.
    location = /api/hub/me/cloud/proposals {
        client_max_body_size 6M;
        proxy_pass http://127.0.0.1:8086;
        include /etc/nginx/snippets/orbiters-proxy.conf;
        proxy_read_timeout 90s;
    }
    location ^~ /api/hub/ {
        client_max_body_size 6M;
        proxy_pass http://127.0.0.1:8086;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    location = /hub { return 302 /hub/; }
    location ^~ /hub/ {
        proxy_pass http://127.0.0.1:8087;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    # The hub API's probe (REB-254): the same host as /api/hub/ above.
    location = /health {
        proxy_pass http://127.0.0.1:8086/health;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }

    # PigroCRM preview keeps answering here directly, for a bookmark or a direct
    # link, exactly as production sends it to pigro.letsrebase.com (REB-317).
    location = /app  { return 302 https://preview.pigro.letsrebase.com/app/; }
    location /app/   { return 302 https://preview.pigro.letsrebase.com$request_uri; }

    # Everything else is the website preview container, which decides what exists.
    location / {
        proxy_pass http://127.0.0.1:8083;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
}
