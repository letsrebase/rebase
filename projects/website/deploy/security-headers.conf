# REB-275: the response headers a browser needs on the apex vhost, beyond what TLS
# itself gives it.
#
# **Why these headers live here and not in `nginx.conf` (this project's) or
# `projects/hub/deploy/nginx.conf`.** This vhost is the only hop that terminates TLS
# and answers for three tenants of one origin at once -- the website's own container,
# the hub's SPA and the hub's API -- so it is the one place a header reaches every
# response regardless of which container behind it produced the body. Both inner
# containers keep only what makes sense for whoever reaches them directly (a health
# check, a local `docker compose`, without this vhost in front): `X-Content-Type-
# Options: nosniff` for served static assets, nothing that only means something over
# HTTPS (`Strict-Transport-Security`) or that would have to be kept identical across
# three separately deployed images to mean anything (the CSP).
#
# **Where this file has to live on the host.** `/etc/nginx/snippets/website-security-
# headers.conf`, beside `orbiters-proxy.conf`, which `letsrebase.conf` and
# `preview.letsrebase.conf` already `include` the same way. Installing a vhost that
# `include`s a path with nothing there fails `nginx -t` outright, so this file has to
# be copied across before, or in the same change as, the `include` line below is added
# to the installed copy.
#
# **`always` on every line**, so nginx sends the header on every status code an error
# page produces too, not only on 2xx responses (nginx's own default, made explicit).
#
# **Every `add_header` sits at server level in the files that include this one, before
# their first `location`.** nginx does not inherit `add_header` into a location block
# that declares its own -- `preview.letsrebase.conf`'s own `X-Robots-Tag` line is one,
# and a location added later that needs its own `add_header` has to repeat this whole
# file's `include` line, or repeat every directive below by hand, or it silently loses
# all of them for that one response.
#
# **One CSP, enforced since REB-306 (2026-09-22).** It shipped as two headers
# (REB-275): `frame-ancestors 'none'` enforced from day one -- nothing on this
# origin is ever meant to be framed -- and everything else report-only, because the
# directive set was a real guess at what these three surfaces load and a wrong guess
# in an enforcing header breaks an application. The watch-and-flip step was the proof:
# every website page, on both consent states, and the hub SPA's routes were served
# locally behind these exact headers with a headless Chromium capturing
# `securitypolicyviolation` events and the console. One violation surfaced -- the
# ChatGPT Ads pixel's own beacon host, `bzr.openai.com`, missing from `connect-src`
# -- and is fixed below; nothing else fired. The two headers are therefore merged
# into this single enforcing one, and
# `X-Frame-Options: DENY` stays for a browser that predates `frame-ancestors`. There
# is still no `report-to`/`report-uri` collector (standing up one is a product
# decision, not a side effect of this change), so an enforcement violation shows up
# in whoever's devtools console and nowhere else.
#
# **Where the policy below comes from**, read against both surfaces this vhost serves:
#
# - `projects/website` (six static pages, no bundler): `index.html`, `pigrocrm.html`
#   and `community.html` each carry two inline `<script>` tags (a three-line reveal
#   gate and a `application/ld+json` block for search engines), and `privacy.html`
#   carries a third (the consent-withdrawal control) -- so `script-src` needs
#   `'unsafe-inline'`, honestly, rather than a nonce this project's own "no bundler, no
#   build step beyond 300ms" rule (`AGENTS.md`) has nothing to inject one with. The
#   ChatGPT Ads pixel and PostHog are both injected by `src/consent.js` *after*
#   consent, never in the markup (`AGENTS.md` "A tracker enters through consent.js or
#   not at all"), but a policy has to allow what the page *can* load, consent or not,
#   so `script-src` also carries `bzrcdn.openai.com` (the pixel's SDK,
#   `consent.js:31`) and `connect-src` carries it too plus `bzr.openai.com`, the
#   beacon host the SDK itself POSTs event batches to: that second OpenAI host is not
#   visible from the markup and was found on 2026-09-22 as a live `connect-src`
#   violation against this very policy, run in a real browser with consent granted,
#   the pass that flipped this header to enforcing (REB-306).
# - `projects/hub/apps/web` (the SPA under `/hub/`): no inline `<script>`, and the
#   computed `style={{ width: ... }}` its wizard's progress bar sets
#   (`src/wizard/Wizard.tsx`) does not need `'unsafe-inline'` on its own account --
#   React writes that through the CSSOM (`element.style.setProperty`), which CSP's
#   `style-src` does not govern, only a `style` HTML attribute's text or a `<style>`
#   element's content. `style-src` still needs it: `radix-ui`
#   (`apps/web/package.json`), a dependency of both this SPA and the CRM's, injects a
#   `<style>` element into the document at runtime for its scroll lock, which no nonce
#   this build can mint reaches.
# - Both surfaces load PostHog (`shared/analytics/posthog.ts`, `src/consent.js`'s own
#   copy of the same two literals): `eu-assets.i.posthog.com` for the SDK and the
#   session-recording bundle (`script-src`), `eu.i.posthog.com` for events
#   (`connect-src`), both EU.
# - `img-src` and `font-src` stay `'self'` only: every image and the one webfont
#   (`shared/brand/font.css`) are self-hosted on both surfaces, and neither reads a
#   `data:` URI image. `object-src 'none'` and `base-uri 'self'` cost nothing either --
#   neither surface embeds a plugin or writes a `<base>` tag -- so they are not worth
#   leaving out of the policy.
#
# **`Referrer-Policy: strict-origin`, not the more common `strict-origin-when-cross-
# origin`.** The two are identical cross-origin (only the origin ever leaves); they
# differ on a same-origin request, where `strict-origin` still sends only the origin
# and `strict-origin-when-cross-origin` sends the full URL. `/hub/entra?t=<token>`
# (`projects/hub/apps/web/src/lib/entra-token.ts`) carries a live magic-link token in
# its query string, and the browser requests that page's own same-origin assets (the
# bundled JS, the CSS, `mark.svg`) before that file's `stripEntraToken` can remove it
# from the address bar -- with the weaker value, every one of those requests would
# carry the token in its own `Referer`, for nginx's access log to record right back.
# This container's own comment used to make the same point for the same reason
# (`Referrer-Policy strict-origin`, `projects/hub/deploy/nginx.conf`, removed by this
# same change in favour of this one) -- the value carries over rather than only the
# intent. Nothing on either surface needs a same-origin request to know the full path
# it came from.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://bzrcdn.openai.com https://eu-assets.i.posthog.com; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' https://eu.i.posthog.com https://eu-assets.i.posthog.com https://bzrcdn.openai.com https://bzr.openai.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
