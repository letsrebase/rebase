# letsrebase.com -- the host vhost in front of the website container.
#
# The website ships as its own compose stack (docker-compose.yml here) listening on
# 127.0.0.1:8082, and that container owns the whole path map: which extensionless path
# is which page, and a 404 for anything else. This file terminates TLS and decides only
# the paths that do **not** belong to it:
#
#   * `/api/community/signups`, the endpoint the community form posts to, which since
#     2026-09-09 is the Orbiters hub's own API (projects/hub, 127.0.0.1:8084) and no
#     longer PigroCRM's. Same origin for the browser, two containers behind it.
#     `/api/orbiters/signups` is its old name (REB-212, 2026-09-15) and still proxies
#     here, to the same upstream path, so a cached page or a stale link keeps working.
#   * `/api/hub/`, the rest of that API: the two wizards' writes and the admin area's
#     reads. A CV rides in the freelancer's multipart body, so this prefix alone takes
#     bodies up to the API's own ceiling (5 MB plus the other fields).
#   * `/hub/`, the hub SPA (projects/hub/apps/web, 127.0.0.1:8085): the wizards and the
#     admin section, one origin with the API above so the admin cookie is first-party.
#   * `/health`, the API's probe, for the same reason.
#   * `/app`, which is the CRM: it lives on pigro.letsrebase.com and this name only
#     points at it.
#   * `/.well-known/acme-challenge/`, served from /var/www/html so a certificate
#     renewal can be answered off disk rather than by the container.
#
# TLS is added by `certbot --nginx`, which rewrites this file in place on the server.
# The copy here is the plain-HTTP source of truth; the copy in
# /etc/nginx/sites-available/ has certbot's 443 block on top of it and is edited in
# place rather than overwritten, or TLS disappears on the next change. That includes
# the `include /etc/nginx/snippets/website-security-headers.conf;` line below (both
# server blocks carry it) and the `Content-Security-Policy` header it carries
# (REB-275, enforcing since REB-306): paste it into each of the installed
# copy's existing server blocks, not over them. That snippet file itself
# (`deploy/security-headers.conf` in this directory) has to reach the host at that
# same path too, copied across whenever it changes.

server {
    listen 80;
    listen [::]:80;
    server_name www.letsrebase.com;
    include /etc/nginx/snippets/website-security-headers.conf;
    return 301 https://letsrebase.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name letsrebase.com;

    absolute_redirect off;
    client_max_body_size 1M;

    # REB-275: HSTS, an enforcing CSP (flipped by REB-306), frame-ancestors, nosniff,
    # Permissions-Policy -- see deploy/security-headers.conf for what each line is and
    # why it lives here rather than in nginx.conf (this project's) or
    # projects/hub/deploy/nginx.conf.
    include /etc/nginx/snippets/website-security-headers.conf;

    # Renewal has to reach the challenge. `--nginx` answers from a server block of its
    # own, so this one is for `--webroot -w /var/www/html` -- and the installed copy in
    # /etc/nginx/sites-available/ needs this location inside certbot's 443 block as
    # well: certbot's `if ($host = letsrebase.com) { return 301 ...; }` runs in the
    # server rewrite phase, before any location below is chosen. preview's installed
    # copy already has it there; production's 443 block hands the path to the website
    # container, which 404s it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The Orbiters hub (projects/hub): its API on 8084, its SPA on 8085.
    location = /api/community/signups {
        proxy_pass http://127.0.0.1:8084/api/community/signups;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    location = /api/orbiters/signups {
        proxy_pass http://127.0.0.1:8084/api/community/signups;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    # The hub's MCP server over HTTP (REB-213), a process of its own on 8088: an agent
    # with an admin's token talks here, and nothing else does. Two of its tools,
    # `propose_team` and `regenerate_freelancer_card` (REB-520), wait on Claude as the
    # team builder's proposals below do, up to two attempts of 40 s, near 81 s: this
    # vhost's 60 s default would cut the call while the proposal or the card was still
    # being written and paid for. 90 s, as there; by hand on the host, as this block was.
    location ^~ /api/hub/mcp {
        proxy_pass http://127.0.0.1:8088/mcp;
        include /etc/nginx/snippets/orbiters-proxy.conf;
        proxy_read_timeout 90s;
    }
    # The team builder's proposals (REB-516): Claude writes the team while the request
    # waits, and the hub's seam gives up after two attempts of 40 s, near 81 s. This
    # vhost's 60 s default would answer the visitor 504 while the proposal went on, its
    # slot held and a late answer written for nobody. 90 s: above the seam's own limit.
    # An exact match, which outranks `^~ /api/hub/` below whatever the order; the rest
    # mirrors that block. A by-hand change on the host, as the MCP block above was
    # (projects/hub/AGENTS.md, «The team builder»).
    location = /api/hub/team/proposals {
        client_max_body_size 6M;
        proxy_pass http://127.0.0.1:8084;
        include /etc/nginx/snippets/orbiters-proxy.conf;
        proxy_read_timeout 90s;
    }
    # The same builder inside the talent cloud (REB-519): the same call, the same wait.
    location = /api/hub/me/cloud/proposals {
        client_max_body_size 6M;
        proxy_pass http://127.0.0.1:8084;
        include /etc/nginx/snippets/orbiters-proxy.conf;
        proxy_read_timeout 90s;
    }
    location ^~ /api/hub/ {
        client_max_body_size 6M;
        proxy_pass http://127.0.0.1:8084;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    location = /hub { return 302 /hub/; }
    location ^~ /hub/ {
        proxy_pass http://127.0.0.1:8085;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    # The hub API's probe (REB-254): the same host as /api/hub/ above.
    location = /health {
        proxy_pass http://127.0.0.1:8084/health;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }

    # PigroCRM keeps answering here directly, for a bookmark or a direct link;
    # the site's own "Accedi" points at the hub since REB-317.
    location = /app  { return 302 https://pigro.letsrebase.com/app/; }
    location /app/   { return 302 https://pigro.letsrebase.com$request_uri; }

    # Everything else is the website container, which decides what exists.
    location / {
        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
}
