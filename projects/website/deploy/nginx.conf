# The website's own nginx, inside its own image. Four pages and their assets, and
# nothing else: no SPA fallback, no API, no proxy. What this file decides is which
# extensionless path maps to which file, which is the same mapping
# `src/path-map-plugin.ts` reproduces for the dev and preview servers. Its unit test
# parses the `location =` lines below, so a change to one and not the other fails
# there instead of passing locally and 404ing in production.
#
# The host's nginx (deploy/letsrebase.conf) terminates TLS and sends everything
# here except what belongs to the other tenants of the origin: the signup endpoint,
# `/api/hub/`, `/hub/` and `/health` go to the rebase hub (projects/hub), and `/app`
# redirects to the CRM.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Relative Location headers. Without this nginx builds an absolute URL from
    # $scheme://$host and drops a non-default port, so a redirect reached directly on
    # 127.0.0.1:8082 sends the browser to port 80. Invisible behind the reverse proxy,
    # broken for anyone curling the container, which is how it is verified.
    absolute_redirect off;

    # REB-275: the host's nginx (deploy/letsrebase.conf) carries the full
    # security-headers set (deploy/security-headers.conf) for the whole origin, since
    # it is the one hop that terminates TLS and sees every response, website and hub
    # alike. `nosniff` costs nothing to repeat here for whoever reaches this container
    # directly, without that vhost in front.
    add_header X-Content-Type-Options nosniff always;

    # The landing is the site's front door (Ivan, 2026-09-11, ORB-145), and
    # `/pigrocrm` is the CRM's own page again (ORB-159), after two days as a 301.
    location = /         { try_files /index.html =404; }
    location = /pigrocrm { try_files /pigrocrm.html =404; }
    # The community page (its own signup form, moved here from /orbiters on
    # 2026-09-15, REB-212) is gone (REB-72), a week after the landing took the front
    # door for good: both its names now 301 to / instead, so a bookmark, an ad or a
    # newsletter link still lands.
    location = /community { return 301 /$is_args$args; }
    location = /orbiters { return 301 /$is_args$args; }
    # The pitch deck, a page shared by link (ORB-153).
    location = /pitch    { try_files /pitch.html =404; }
    location = /privacy  { try_files /privacy.html =404; }
    location = /terms    { try_files /terms.html =404; }
    # /termini was this page's name before REB-318; 301 so an old link or a cached
    # page still lands.
    location = /termini  { return 301 /terms; }

    # robots.txt (REB-109) and sitemap.xml (REB-110) are both written by
    # src/path-map-plugin.ts's own writeBundle hook: no HTML input builds either, so
    # each needs its own exact-match location, the same `try_files` shape as every
    # page above.
    location = /robots.txt { try_files /robots.txt =404; }
    location = /sitemap.xml { try_files /sitemap.xml =404; }

    # The hashed CSS, JS and the woff2 the build emitted, and nothing invented.
    location /assets/ { try_files $uri =404; }

    # No `try_files $uri` fallback at the root on purpose: a static site that answers
    # 200 for a file nobody linked is a site whose 404s you never see.
    location / { return 404; }
}
