[project]
name = "rebase-mcp"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["rebase-core", "mcp==2.2.0"]

[tool.uv.sources]
rebase-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rebase_mcp"]
