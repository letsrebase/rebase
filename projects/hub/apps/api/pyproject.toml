[project]
name = "rebase-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "rebase-core", "fastapi==0.141.1", "uvicorn[standard]==0.53.0",
  "python-multipart==0.0.32",
]

[tool.uv.sources]
rebase-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rebase_api"]
