# The hub's own nginx, inside its own image: the SPA under /hub/ and nothing else. The
# host's nginx (projects/website/deploy/letsrebase.conf) terminates TLS and sends
# `/hub/` here and `/api/hub/`, `/api/community/signups` to the hub's API.
server {
    # The container runs as an unprivileged user (nginxinc/nginx-unprivileged), which
    # cannot bind a port below 1024: compose maps the published port to this one.
    listen 8080;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # The SPA's text assets go out compressed (the admin bundle alone is about 900 kB).
    # `text/html` is always in the list.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript image/svg+xml text/plain;

    # REB-275: the magic link's token is in the SPA's URL and must not travel in a
    # Referer to anything, but the Referrer-Policy this container used to set alone
    # (`strict-origin`) is superseded by the host's nginx (projects/website/deploy/
    # letsrebase.conf), which carries the full security-headers set
    # (projects/website/deploy/security-headers.conf, `strict-origin` among them) for the
    # whole origin, since it is the one hop that terminates TLS and sees every response. A second, differently-valued Referrer-Policy from this
    # container would leave the browser to pick between two header instances rather
    # than trusting one. `nosniff` costs nothing to repeat here for whoever reaches
    # this container directly, without that vhost in front.
    add_header X-Content-Type-Options nosniff always;

    location = /hub { return 302 /hub/; }
    # Hashed assets by their exact name, a year and `immutable` since the name changes with
    # the content; every other path under /hub/ is the SPA, which routes it itself and is
    # revalidated on every load (`no-cache` is "ask first", not "never store"), so a deploy
    # reaches an open tab's next navigation. `nosniff` is repeated in each: a location with
    # an `add_header` of its own drops the server-level one.
    location ^~ /hub/assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-Content-Type-Options nosniff always; try_files $uri =404; }
    location = /hub/mark.svg { try_files $uri =404; }
    location ^~ /hub/ { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; try_files $uri /hub/index.html; }

    location / { return 404; }
}
