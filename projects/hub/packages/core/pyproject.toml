[project]
name = "rebase-core"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
# The same pins as pigrocrm-core where the two overlap: one uv workspace resolves once
# for every project, and two projects asking for two SQLAlchemys is what the workspace
# exists to make impossible.
dependencies = [
  "sqlalchemy==2.1.3",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "email-validator==2.3.0",
  "uuid-utils==1.0.0",
  "argon2-cffi==25.1.0",
  # The same pin as pigrocrm-core: the CV's text on the MCP (ORB-206).
  "pypdf==6.19.0",
  # The same pin as pigrocrm-mcp: the completion event the API sends itself (REB-215).
  "posthog==7.60.1",
  # The contracts are typeset at request time (REB-387): Typst reads neither woff2 nor
  # a variable axis, so fontTools instances the brand's Outfit. `[woff]` brings brotli.
  # The same pin as the root dev group, which the guide's build already uses.
  "fonttools[woff]==4.66.1",
  # The model seam (REB-831, `llm.py`): Pydantic AI, each provider called directly with
  # its own SDK (never a gateway), for the card writer and the team-proposal engine.
  # Pinned exactly; the provider SDKs come in through its extras.
  "pydantic-ai-slim[anthropic,openai,google]==2.62.0",
  # AES-256-GCM for the model providers' keys at rest (`secrets.py`, REB-829): the same
  # pin as pigrocrm-core, whose `gmail/crypto.py` this was written after.
  "cryptography==50.0.1",
]

[project.scripts]
rebase = "rebase_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rebase_core"]
