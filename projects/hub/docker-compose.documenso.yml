# Production's overlay: Documenso, the site where a freelancer signs rebase's contracts
# (REB-387, REB-393), in the `rebase` compose project beside the hub, and the nightly
# backups of the two databases (REB-715, REB-717), the hub's own and Documenso's. The
# file is still named for Documenso, which was its only tenant; renaming it would mean
# editing COMPOSE_FILE on the host by hand. A file of its own, which only production's
# `.env` loads:
#
#     COMPOSE_FILE=docker-compose.yml:docker-compose.documenso.yml
#
# Compose interpolates the required variables of every service of every file it reads,
# profiles or not, so these services in docker-compose.yml would fail the preview's deploy
# and CI's image build, neither of which runs Documenso or a backup. The preview signs on
# this same instance through a Documenso user of its own (probe § 8).
#
# The image is pinned by tag and digest. Phase 1 probed v2.18.0
# (docs/superpowers/specs/2026-09-23-documenso-probe.md § 1); v2.20.0 replaced it after
# its release notes (REB-712). Documenso's uploaded and sealed PDFs
# live in its own Postgres (`NEXT_PUBLIC_UPLOAD_TRANSPORT=database`), so the data to back
# up is REBASE_DOCUMENSO_DATA_DIR and nothing else: `documenso-backup` below does it every
# night (REB-715). About 630 MiB of memory once warm, 80 MiB for its Postgres, 20 MiB
# for each backup between its runs.
#
# The two backups are one image and one script (./db-backup) with different settings:
# what the backup is called, which schema-version query it records, which database it
# reads, and its own monitor. Everything else is shared: the certificate it encrypts to,
# the bucket and the key pair, all `HUB_BACKUP_*`, since both write to the hub's one
# bucket (`rebase-hub-backup`, REB-716), each under its own prefix.
x-db-backup: &db-backup
  # The off-host backups (docs/restore-from-backup.md, REB-715, REB-717): once a day, and
  # once at start, `pg_dump` the database, encrypt the archive to the public
  # certificate(s) in HUB_BACKUP_CERT_B64, whose private key is not on this host, and put
  # the result in the private R2 bucket under `<name>/`. Vaultwarden's backup service is
  # the model (projects/vaultwarden): a loop and not a one-shot, because
  # `_deploy-compose.yml` fails a deploy on any container that is not `running`, and
  # scheduled here and not by a host cron, because the schedule is released by the deploy
  # and there is nothing to install on the host by hand.
  #
  # Built from the databases' own image (./db-backup/Dockerfile) so `pg_dump` matches the
  # servers' major version; the scripts are copied in, so a change to one is a new image
  # and a recreated container. The work directory is a tmpfs: the archive is the whole
  # database in clear until the envelope is made, and a container killed in the middle (an
  # OOM kill, a power cut) must leave it nowhere a disk keeps it. Twice the archive fits in
  # it: the dumps are about 5 MiB (Documenso's) and 4 MiB (the hub's) today, and an
  # archive of more than about 380 MiB fails the run with a full disk, which the monitor
  # hears; the size here is the line to change.
  build:
    context: ./db-backup
  restart: unless-stopped
  init: true
  entrypoint: ['/bin/bash', '/scripts/backup-loop.sh']
  tmpfs:
    - /scratch:mode=0700,size=768m
  # Whether the last backup finished less than 26 hours ago, so `docker compose ps` shows
  # `unhealthy` for a backup that is failing quietly. It does not fail a deploy: only a
  # container that is not `running` does. Nobody reads it unprompted, which is why the
  # loop also pings the monitor.
  healthcheck:
    test: ['CMD-SHELL', 'test -n "$$(find /tmp/last-backup-ok -mmin -1560 2>/dev/null)"']
    interval: 10m
    timeout: 10s
    retries: 1
    start_period: 15m

x-db-backup-environment: &db-backup-environment
  TMPDIR: /scratch
  BACKUP_CERT_B64: ${HUB_BACKUP_CERT_B64:?set it in .env, one or more PEM certificates as one line of base64}
  BACKUP_S3_ENDPOINT: https://${HUB_BACKUP_R2_ACCOUNT_ID:?set it in .env, the Cloudflare account id}.r2.cloudflarestorage.com
  BACKUP_BUCKET: ${HUB_BACKUP_BUCKET:?set it in .env, the R2 bucket the backups are written to}
  BACKUP_ACCESS_KEY_ID: ${HUB_BACKUP_ACCESS_KEY_ID:?an Environment secret, written by the deploy}
  BACKUP_SECRET_ACCESS_KEY: ${HUB_BACKUP_SECRET_ACCESS_KEY:?an Environment secret, written by the deploy}

services:
  documenso-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: ${DOCUMENSO_DB_PASSWORD:?set it in .env, openssl rand -hex 24}
      POSTGRES_DB: documenso
    # On the host, outside Docker and outside the repository, like the hub's own data. No
    # default, for the reason docker-compose.yml gives for REBASE_DATA_DIR.
    volumes:
      - ${REBASE_DOCUMENSO_DATA_DIR:?set it in .env, to its own directory outside the repository}:/var/lib/postgresql/data
    # No published port: only Documenso reads it, over the compose network.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U documenso']
      interval: 5s
      retries: 10

  documenso:
    image: documenso/documenso:v2.20.0@sha256:05d2ede9fb87bfd8eedc11d81b8bdee43c3e775ea46c4fb64973153ca5ef8eb8
    restart: unless-stopped
    depends_on:
      documenso-db:
        condition: service_healthy
    environment:
      # The names are the tag's own `.env.example`, as the probe checked them (§ 2).
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET:?set it in .env, openssl rand -hex 32}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY:?set it in .env, openssl rand -hex 32}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:?set it in .env, openssl rand -hex 32}
      NEXT_PUBLIC_WEBAPP_URL: ${DOCUMENSO_PUBLIC_URL:-https://firma.letsrebase.com}
      # The container's own address, for its background jobs (probe § 2).
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:3000
      NEXT_PRIVATE_DATABASE_URL: postgresql://documenso:${DOCUMENSO_DB_PASSWORD}@documenso-db:5432/documenso
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgresql://documenso:${DOCUMENSO_DB_PASSWORD}@documenso-db:5432/documenso
      NEXT_PUBLIC_UPLOAD_TRANSPORT: database
      # The seal: a self-signed PKCS#12, made on the host (AGENTS.md), as one line of
      # base64. Valid, and marked "issuer not trusted" by PDF readers until a certificate
      # on Adobe's trust list is bought.
      NEXT_PRIVATE_SIGNING_TRANSPORT: local
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${DOCUMENSO_SIGNING_PASSPHRASE:?set it in .env}
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_CONTENTS: ${DOCUMENSO_SIGNING_CERT_BASE64:?set it in .env, the .p12 as base64}
      # Documenso's own account mails only (a confirmation, a password reset): every
      # signing mail is the hub's. Through Resend, with the hub's own key.
      NEXT_PRIVATE_SMTP_TRANSPORT: resend
      NEXT_PRIVATE_RESEND_API_KEY: ${REBASE_RESEND_API_KEY:?Documenso mails through the hub's Resend key}
      NEXT_PRIVATE_SMTP_FROM_NAME: rebase
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: ${DOCUMENSO_MAIL_FROM:-ciao@letsrebase.com}
      # Nobody opens an account on the public instance. The rollout opens it for the
      # minutes the two environments' users take, then closes it again. For that
      # window a name already in certificate transparency logs is reachable, so the
      # server itself also refuses a signup outside these domains
      # (`isEmailDomainAllowedForSignup`, the image's own `packages/lib/constants/auth`):
      # both planned users are `@letsrebase.com`, and an account made in the window
      # would otherwise survive the close.
      NEXT_PUBLIC_DISABLE_SIGNUP: ${DOCUMENSO_DISABLE_SIGNUP:-true}
      NEXT_PRIVATE_ALLOWED_SIGNUP_DOMAINS: ${DOCUMENSO_SIGNUP_DOMAINS:-letsrebase.com}
      # Production's webhook is `http://api:8000/...`, a name that resolves to a private
      # address: Documenso refuses to call it unless the name is listed (probe § 5).
      NEXT_PRIVATE_WEBHOOK_SSRF_BYPASS_HOSTS: ${DOCUMENSO_WEBHOOK_BYPASS_HOSTS:-api}
      DOCUMENSO_DISABLE_TELEMETRY: 'true'
    ports:
      # Loopback only: the host's nginx serves it as firma.letsrebase.com
      # (deploy/firma.letsrebase.conf).
      - '${REBASE_DOCUMENSO_PORT:-127.0.0.1:8090}:3000'

  documenso-backup:
    # Documenso's database, every night at 03:45 UTC, under `documenso/`. Documenso keeps
    # every uploaded and sealed PDF in it, so the archive is the contracts.
    <<: *db-backup
    depends_on:
      documenso-db:
        condition: service_healthy
    environment:
      <<: *db-backup-environment
      BACKUP_NAME: documenso
      # Documenso applies its Prisma migrations at every start; the newest one says which
      # version wrote the dump.
      BACKUP_HEAD_SQL: SELECT migration_name FROM _prisma_migrations ORDER BY finished_at DESC NULLS LAST, migration_name DESC LIMIT 1
      PGHOST: documenso-db
      PGUSER: documenso
      PGDATABASE: documenso
      PGPASSWORD: ${DOCUMENSO_DB_PASSWORD:?set it in .env, openssl rand -hex 24}
      BACKUP_AT: ${DOCUMENSO_BACKUP_AT:-03:45}
      # The healthchecks.io check the loop pings after every run, the alarm a person
      # actually receives; the healthcheck above only shows on the host.
      BACKUP_PING_URL: ${DOCUMENSO_BACKUP_PING_URL:?an Environment secret, written by the deploy}

  hub-backup:
    # The hub's own database (`rebase-db-1`: members, companies, matches, contracts and
    # their signed copies), every night at 03:15 UTC, under `hub/`, so the three backups
    # on this host (this, Vaultwarden's at 03:30, Documenso's at 03:45) never dump at once
    # on a machine with 3.8 GiB. Its own monitor.
    <<: *db-backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-backup-environment
      BACKUP_NAME: hub
      # The hub applies its Alembic migrations when the api starts (Dockerfile.api); the
      # revision says which version wrote the dump.
      BACKUP_HEAD_SQL: SELECT version_num FROM alembic_version
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-rebase}
      PGDATABASE: ${POSTGRES_DB:-rebase}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set it in .env, the hub database's password}
      BACKUP_AT: ${HUB_BACKUP_AT:-03:15}
      BACKUP_PING_URL: ${HUB_BACKUP_PING_URL:?an Environment secret, written by the deploy}
