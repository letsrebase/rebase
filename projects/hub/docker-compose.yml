# The rebase hub: its own Postgres, its own API, its own SPA. Run with `-p rebase`
# so the project name never derives from the directory (docs/adding-a-project.md §7).
# What the API and the MCP server read, once: the two processes come from the same
# image and see the same database, the same mail key and the same CRM registry token.
x-api-environment: &api-environment
  REBASE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rebase}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rebase}
  # ChatGPT Ads, the server half of the signup conversion. Empty defaults: a site
  # that runs no campaigns is the ordinary case, not a start-up failure.
  REBASE_OPENAI_PIXEL_ID: ${REBASE_OPENAI_PIXEL_ID:-}
  REBASE_OPENAI_CONVERSIONS_API_KEY: ${REBASE_OPENAI_CONVERSIONS_API_KEY:-}
  REBASE_SIGNUP_URL: ${REBASE_SIGNUP_URL:-https://letsrebase.com/}
  REBASE_OPENAI_CONVERSIONS_SEND_HASHED_EMAIL: ${REBASE_OPENAI_CONVERSIONS_SEND_HASHED_EMAIL:-false}
  # The member area's mail. Empty key is a hub with the area's door still closed.
  REBASE_RESEND_API_KEY: ${REBASE_RESEND_API_KEY:-}
  REBASE_MAIL_FROM: ${REBASE_MAIL_FROM:-Rebase <ciao@letsrebase.com>}
  REBASE_HUB_URL: ${REBASE_HUB_URL:-https://letsrebase.com/hub}
  # PigroCRM's spaces in the admin area (ORB-142): the CRM's public URL, and the
  # token its own `.env` carries as PIGROCRM_REGISTRY_TOKEN. Empty token: 503.
  REBASE_PIGRO_API_URL: ${REBASE_PIGRO_API_URL:-https://pigro.letsrebase.com}
  REBASE_PIGRO_REGISTRY_TOKEN: ${REBASE_PIGRO_REGISTRY_TOKEN:-}
  # The CRM's door for rebase's engagements (REB-498), its own token: the link of an
  # active match and its hours. Empty: the link waits and the report answers 503.
  REBASE_PIGRO_ENGAGEMENTS_TOKEN: ${REBASE_PIGRO_ENGAGEMENTS_TOKEN:-}
  # PostHog, the completion event from the API (REB-215): the public project key.
  # Empty: no client, no event. The list is explicit, so a variable the `.env` carries
  # reaches the container only if it is named here.
  REBASE_POSTHOG_KEY: ${REBASE_POSTHOG_KEY:-}
  REBASE_POSTHOG_HOST: ${REBASE_POSTHOG_HOST:-https://eu.i.posthog.com}
  # Who signs for rebase in the contracts (REB-387): one JSON object of `rebase-*`
  # fields. Empty: those fields print as blank lines.
  REBASE_SIGNER_JSON: ${REBASE_SIGNER_JSON:-}
  # The signing site (REB-387): Documenso's URL as this stack reaches it, this
  # environment's own token and webhook secret, and where rebase's signed copies go.
  # Empty URL or token: signing is off and says so.
  REBASE_DOCUMENSO_URL: ${REBASE_DOCUMENSO_URL:-}
  REBASE_DOCUMENSO_API_TOKEN: ${REBASE_DOCUMENSO_API_TOKEN:-}
  REBASE_DOCUMENSO_WEBHOOK_SECRET: ${REBASE_DOCUMENSO_WEBHOOK_SECRET:-}
  REBASE_CONTRACTS_MAIL: ${REBASE_CONTRACTS_MAIL:-ciao@letsrebase.com}
  # A draft text never leaves for signature; only the preview sets this true. Not an
  # empty default: a bool field fails at start-up on an empty value.
  REBASE_CONTRACTS_ALLOW_DRAFT: ${REBASE_CONTRACTS_ALLOW_DRAFT:-false}
  # Campaigns (P-REB-41): who the mail is from, the minimum gap between two campaigns
  # to one person, and the secret of this environment's Resend webhook. Not an empty
  # default for the gap: an int field fails at start-up on an empty value.
  REBASE_CAMPAIGN_FROM: ${REBASE_CAMPAIGN_FROM:-Ivan di rebase <ciao@letsrebase.com>}
  REBASE_CAMPAIGN_GAP_DAYS: ${REBASE_CAMPAIGN_GAP_DAYS:-3}
  REBASE_RESEND_WEBHOOK_SECRET: ${REBASE_RESEND_WEBHOOK_SECRET:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rebase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?serve una password}
      POSTGRES_DB: ${POSTGRES_DB:-rebase}
    # On the host, never in a Docker-managed volume: the same decision PigroCRM took
    # after a daemon reset scared everyone. Set REBASE_DATA_DIR outside the repository.
    #
    # No default, on purpose. Two stacks of this file run on one host, and each has its
    # own data directory; a `.env` that forgets the variable must fail here, loudly,
    # rather than bring Postgres up on an empty relative directory with `/health`
    # answering 200 and the real rows unmounted (ORB-28). A build never mounts it, but
    # compose interpolates the whole file before building, so `docker compose build`
    # needs a value too: CI and preflight pass a throwaway one.
    volumes:
      - ${REBASE_DATA_DIR:?set it in .env, to this stack's own directory outside the repository}:/var/lib/postgresql/data
    ports:
      - '${REBASE_DB_PORT:-127.0.0.1:55435}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rebase}']
      interval: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: projects/hub/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *api-environment
    ports:
      # Loopback only: the host's nginx is what faces the internet, and it proxies
      # `/api/community/signups` and `/api/hub/` here.
      - '${REBASE_API_PORT:-127.0.0.1:8084}:8000'

  mcp:
    # The MCP server over Streamable HTTP for admins (REB-213): the same image as `api`,
    # a process of its own because `apps/api` may not import `apps/mcp`. The host's
    # nginx proxies `/api/hub/mcp` here; nothing opens the database before the first
    # request, so starting after `api` has *started* is enough for the migrations.
    build:
      context: ../..
      dockerfile: projects/hub/Dockerfile.api
    restart: unless-stopped
    command: ['uv', 'run', '--no-sync', 'uvicorn', 'rebase_mcp.http:app', '--host', '0.0.0.0', '--port', '8001']
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment: *api-environment
    ports:
      - '${REBASE_MCP_PORT:-127.0.0.1:8088}:8001'

  campaigns:
    # `rebase campaigns-tick` (P-REB-41): sends the campaigns whose time has come, one
    # mail at a time, every minute, on both stacks. A loop, never a one-shot, for the
    # same reason as `sweep`: `_deploy-compose.yml` fails a deploy on any container not
    # `running`. Harmless without REBASE_RESEND_API_KEY: it prints why and sends nothing.
    # Read with `docker logs rebase-campaigns-1` (production) or
    # `rebase-preview-campaigns-1` (preview).
    build:
      context: ../..
      dockerfile: projects/hub/Dockerfile.api
    restart: unless-stopped
    init: true
    command: ['sh', '-c', 'while :; do sleep 60; uv run --no-sync rebase campaigns-tick; done']
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment: *api-environment

  sweep:
    # `rebase contracts-sweep` (REB-391), scheduled here rather than by the host, so both
    # stacks carry their own schedule (REB-393): a loop, never a one-shot, because
    # `_deploy-compose.yml` fails a deploy on any container that is not `running`. Sleeps
    # first so the api's `alembic upgrade head` (Dockerfile.api) has already run.
    # `init: true` so the loop stops on SIGTERM instead of costing every deploy's 10 s
    # kill timeout. Harmless on an environment with no Documenso settings: `finish`
    # swallows `SigningUnavailable`. Read with `docker logs rebase-sweep-1` (production)
    # or `rebase-preview-sweep-1` (preview).
    build:
      context: ../..
      dockerfile: projects/hub/Dockerfile.api
    restart: unless-stopped
    init: true
    command: ['sh', '-c', 'while :; do sleep 600; uv run --no-sync rebase contracts-sweep; done']
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment: *api-environment

  web:
    build:
      context: ../..
      dockerfile: projects/hub/Dockerfile.web
    restart: unless-stopped
    ports:
      # The SPA, at /hub/. The host's nginx proxies `/hub/` here.
      - '${REBASE_WEB_PORT:-127.0.0.1:8085}:80'
