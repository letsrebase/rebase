extend = "../../ruff.toml"

[lint]
# `assert` is stripped under `python -O`: a runtime check is an explicit raise (REB-892).
extend-select = ["S101"]

[lint.isort]
known-first-party = ["rebase_core", "rebase_api", "rebase_mcp"]

# packages/core may import neither adapter; each adapter's own nested ruff.toml
# narrows this table to the other adapter only. The same rule PigroCRM enforces, for
# the same reason: what the API can do, the MCP server can do, because both call core.
[lint.flake8-tidy-imports.banned-api]
"rebase_api".msg = "packages/core must not import from apps/api"
"rebase_mcp".msg = "packages/core must not import from apps/mcp"
"pigrocrm".msg = "the hub is a product of its own and imports nothing from PigroCRM"
"pigrocrm_api".msg = "the hub is a product of its own and imports nothing from PigroCRM"
"pigrocrm_mcp".msg = "the hub is a product of its own and imports nothing from PigroCRM"

# The split contract and referral test files import the `clean` fixture from their fixtures module and
# take it as a parameter, which pyflakes reads as a redefinition of an unused import.
[lint.per-file-ignores]
"**/tests/**" = ["S101"]
"**/conftest.py" = ["S101"]
"tools/**" = ["S101"]
# Ivan's REB-862 owns the anonymous CV: its two asserts go when that work lands.
"packages/core/src/rebase_core/anonymous_cv/**" = ["S101"]
"packages/core/tests/test_match_*.py" = ["F811"]
"packages/core/tests/test_signing_*.py" = ["F811"]
"packages/core/tests/test_referral*.py" = ["F811"]
