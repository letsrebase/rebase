# apps/mcp speaks two transports. Over stdio (`python -m pigrocrm_mcp`, see its
# __main__.py) it is launched as a subprocess by an MCP client that owns its
# stdin/stdout for one session -- there is no service for that here, and an operator
# who wants it runs it on demand inside the api image, with a personal access token
# from Impostazioni -> Token in the UI, exported in the shell and passed by name only:
#   docker compose run --rm -e PIGROCRM_TOKEN api python -m pigrocrm_mcp
# Never as `-e PIGROCRM_TOKEN=<token>`: the value would be in `ps` and the shell
# history. On the production host the token comes from a root-only file, see AGENTS.md
# § Deploying (REB-127).
# Over Streamable HTTP (`pigrocrm_mcp.http`, ORB-170) it is the `mcp` service below:
# the same image as `api`, the same documents volume, an environment of its own (the
# subset of the api's it reads, `x-mcp-environment`), reached only through the `web`
# container's nginx at /<slug>/mcp and /mcp, with the same tokens as bearers. It has no
# host port on purpose.
#
# Every long-running service is unprivileged and hardened the same way (`x-hardening`):
# the images run as uid 10001 (nginx as `nginx`), without capabilities, without the right
# to gain any, with their logs rotated and, for the stateless ones, a read-only root
# filesystem. A schema change is the `migrate` service's, once, before `api` starts.

# What the `mcp` service reads, and nothing else: it authenticates personal access tokens
# and works through `pigrocrm_app`, so it holds no registry or engagements bearer, no mail
# key and no push key. It does hold the JWT secret: a space's own Google client is sealed
# with a key derived from it (migration 0065), and the boot refuses a placeholder. Every
# line here is the same line as in the api's
# block below (`test_compose_environment.py` fails when one drifts or names a variable the
# api block does not). PIGROCRM_ADMIN_DATABASE_URL stays until the registry stops creating
# databases in the request path: `SpaceRegistry.registry_factory` still opens the owner
# role there, and an mcp without it cannot reach a space opened since its last start.
x-mcp-environment: &mcp-environment
  PIGROCRM_DATABASE_URL: postgresql+psycopg://pigrocrm_app:${PIGROCRM_APP_PASSWORD:?set it in .env, the password of the application role the boot creates}@db:5432/${POSTGRES_DB:-pigrocrm}
  PIGROCRM_JWT_SECRET: ${PIGROCRM_JWT_SECRET:?set it in .env, openssl rand -hex 32}
  PIGROCRM_ADMIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pigrocrm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pigrocrm}
  PIGROCRM_TIMEZONE: ${PIGROCRM_TIMEZONE:-Europe/Rome}
  PIGROCRM_MCP_FULL_ACCESS: ${PIGROCRM_MCP_FULL_ACCESS:-false}
  PIGROCRM_STORAGE_BACKEND: ${PIGROCRM_STORAGE_BACKEND:-local}
  PIGROCRM_GDRIVE_SERVICE_ACCOUNT_JSON: ${PIGROCRM_GDRIVE_SERVICE_ACCOUNT_JSON:-}
  PIGROCRM_GDRIVE_ROOT_FOLDER_ID: ${PIGROCRM_GDRIVE_ROOT_FOLDER_ID:-}
  PIGROCRM_GOOGLE_CLIENT_ID: ${PIGROCRM_GOOGLE_CLIENT_ID:-}
  PIGROCRM_GOOGLE_CLIENT_SECRET: ${PIGROCRM_GOOGLE_CLIENT_SECRET:-}
  PIGROCRM_GOOGLE_TOKEN_KEY: ${PIGROCRM_GOOGLE_TOKEN_KEY:-}
  PIGROCRM_PUBLIC_URL: ${PIGROCRM_PUBLIC_URL:-}
  PIGROCRM_GOOGLE_APP_UNVERIFIED: ${PIGROCRM_GOOGLE_APP_UNVERIFIED:-false}
  PIGROCRM_GOOGLE_SHARED_CLIENT: ${PIGROCRM_GOOGLE_SHARED_CLIENT:-false}
  PIGROCRM_SLACK_CLIENT_ID: ${PIGROCRM_SLACK_CLIENT_ID:-}
  PIGROCRM_SLACK_CLIENT_SECRET: ${PIGROCRM_SLACK_CLIENT_SECRET:-}
  PIGROCRM_SLACK_TOKEN_KEY: ${PIGROCRM_SLACK_TOKEN_KEY:-}
  PIGROCRM_SLACK_URL: ${PIGROCRM_SLACK_URL:-https://slack.com}
  PIGROCRM_ROOT_SLUG: ${PIGROCRM_ROOT_SLUG:-}
  PIGROCRM_POSTHOG_KEY: ${PIGROCRM_POSTHOG_KEY:-}
  PIGROCRM_POSTHOG_HOST: ${PIGROCRM_POSTHOG_HOST:-https://eu.i.posthog.com}

# The hardening every long-running service takes, and what a service adds on top.
# `no-new-privileges` and `cap_drop: ALL` are the part that costs nothing; the log
# rotation is there because the default json-file driver never rotates and these
# containers share a small disk with the databases. `init: true` reaps the subprocesses
# Pandoc and Typst leave and forwards SIGTERM, so a deploy does not wait out the kill
# timeout.
x-hardening: &hardening
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

x-api-environment: &api-environment
  # Two roles on the one database (REB-634, spec 2026-10-03 §4 «The role»). Requests run
  # as `pigrocrm_app`, a role the API's own boot creates and grants, which Postgres keeps
  # inside the row-level policies; the bootstrap superuser (`POSTGRES_USER`) stays the
  # owner, for `alembic upgrade head`, `ensure-space-defaults` and `CREATE DATABASE`. The
  # role's password has no default, so a `.env` that forgets it fails the stack here
  # instead of booting an API that cannot log in.
  PIGROCRM_DATABASE_URL: postgresql+psycopg://pigrocrm_app:${PIGROCRM_APP_PASSWORD:?set it in .env, the password of the application role the boot creates}@db:5432/${POSTGRES_DB:-pigrocrm}
  PIGROCRM_ADMIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pigrocrm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pigrocrm}
  PIGROCRM_JWT_SECRET: ${PIGROCRM_JWT_SECRET:?set it in .env, openssl rand -hex 32}
  # The installation's own choices, forwarded by name with the code's own defaults
  # (packages/core/src/pigrocrm/core/config.py) so an `.env` that leaves them out
  # gets exactly what a bare `Settings()` would. Booleans and the enum default to a
  # literal, never to an empty string, which pydantic would refuse at start-up.
  PIGROCRM_TIMEZONE: ${PIGROCRM_TIMEZONE:-Europe/Rome}
  # Six months, sliding (spec 9 §5.6): unlike ACCESS_TOKEN_MINUTES this one is a
  # genuine per-installation choice and `.env.example` already documents it as one,
  # so it belongs here rather than in NOT_FORWARDED (REB-257).
  PIGROCRM_REFRESH_TOKEN_DAYS: ${PIGROCRM_REFRESH_TOKEN_DAYS:-180}
  # Same 180 days as above, on purpose (design 2026-09-23 §2, REB-376): the identity
  # cookie is meant to outlive any single space's own session, so it is exactly as
  # much a per-installation choice as PIGROCRM_REFRESH_TOKEN_DAYS.
  PIGROCRM_IDENTITY_TOKEN_DAYS: ${PIGROCRM_IDENTITY_TOKEN_DAYS:-180}
  PIGROCRM_MCP_FULL_ACCESS: ${PIGROCRM_MCP_FULL_ACCESS:-false}
  PIGROCRM_STORAGE_BACKEND: ${PIGROCRM_STORAGE_BACKEND:-local}
  PIGROCRM_GDRIVE_SERVICE_ACCOUNT_JSON: ${PIGROCRM_GDRIVE_SERVICE_ACCOUNT_JSON:-}
  PIGROCRM_GDRIVE_ROOT_FOLDER_ID: ${PIGROCRM_GDRIVE_ROOT_FOLDER_ID:-}
  # Gmail and Drive (slice 5, 9): all four or none, as .env.example says. With
  # `google_accounts` rows in the database and no PIGROCRM_GOOGLE_TOKEN_KEY, the API
  # refuses to boot rather than hold tokens it cannot decrypt.
  PIGROCRM_GOOGLE_CLIENT_ID: ${PIGROCRM_GOOGLE_CLIENT_ID:-}
  PIGROCRM_GOOGLE_CLIENT_SECRET: ${PIGROCRM_GOOGLE_CLIENT_SECRET:-}
  PIGROCRM_GOOGLE_TOKEN_KEY: ${PIGROCRM_GOOGLE_TOKEN_KEY:-}
  PIGROCRM_PUBLIC_URL: ${PIGROCRM_PUBLIC_URL:-}
  PIGROCRM_GOOGLE_APP_UNVERIFIED: ${PIGROCRM_GOOGLE_APP_UNVERIFIED:-false}
  # The root lends its Google client to every space without one (REB-394).
  PIGROCRM_GOOGLE_SHARED_CLIENT: ${PIGROCRM_GOOGLE_SHARED_CLIENT:-false}
  # The Slack app (REB-739): one per installation, installed once per space. All three or
  # none, as .env.example says; a space borrows the root's app and a key derived for it.
  PIGROCRM_SLACK_CLIENT_ID: ${PIGROCRM_SLACK_CLIENT_ID:-}
  PIGROCRM_SLACK_CLIENT_SECRET: ${PIGROCRM_SLACK_CLIENT_SECRET:-}
  PIGROCRM_SLACK_TOKEN_KEY: ${PIGROCRM_SLACK_TOKEN_KEY:-}
  PIGROCRM_SLACK_URL: ${PIGROCRM_SLACK_URL:-https://slack.com}
  PIGROCRM_MAILBOX_TOKEN_KEY: ${PIGROCRM_MAILBOX_TOKEN_KEY:-}
  PIGROCRM_ROOT_SLUG: ${PIGROCRM_ROOT_SLUG:-}
  # Lets the rebase hub read the list of spaces (ORB-142). Empty: no such route.
  PIGROCRM_REGISTRY_TOKEN: ${PIGROCRM_REGISTRY_TOKEN:-}
  # The bearer the engagements door checks (milestone A, REB-490). Empty: no such route.
  PIGROCRM_ENGAGEMENTS_TOKEN: ${PIGROCRM_ENGAGEMENTS_TOKEN:-}
  # The one space the leads route files company requests into (REB-866). Empty: 503.
  PIGROCRM_LEADS_SPACE: ${PIGROCRM_LEADS_SPACE:-}
  # Signing through Documenso (REB-1019): the URL as this stack reaches it, the API token of the
  # Documenso user and team the installation signs through, and the secret typed into Documenso's
  # webhook (sent as X-Documenso-Secret to POST /api/documenso/webhook on the root). URL and token
  # together switch signing on; empty, a letter is signed by hand and its PDF uploaded. The hub keeps
  # signing until the cutover: set these only then.
  PIGROCRM_DOCUMENSO_URL: ${PIGROCRM_DOCUMENSO_URL:-}
  PIGROCRM_DOCUMENSO_API_TOKEN: ${PIGROCRM_DOCUMENSO_API_TOKEN:-}
  PIGROCRM_DOCUMENSO_WEBHOOK_SECRET: ${PIGROCRM_DOCUMENSO_WEBHOOK_SECRET:-}
  # Resend sends the login link and the welcome mail (spec 2026-09-12 §6.1). Empty
  # key: no mail, the endpoints answer 503, the password login still works.
  PIGROCRM_RESEND_API_KEY: ${PIGROCRM_RESEND_API_KEY:-}
  PIGROCRM_MAIL_FROM: ${PIGROCRM_MAIL_FROM:-PigroCRM <ciao@letsrebase.com>}
  # The VAPID identity of the push channel (REB-738); the public key is derived from the
  # private one. Empty: no push, the settings page says so.
  PIGROCRM_VAPID_PRIVATE_KEY: ${PIGROCRM_VAPID_PRIVATE_KEY:-}
  PIGROCRM_VAPID_SUBJECT: ${PIGROCRM_VAPID_SUBJECT:-mailto:ciao@letsrebase.com}
  # Where the signup asks the rebase hub who is a member (ORB-173).
  PIGROCRM_HUB_URL: ${PIGROCRM_HUB_URL:-https://letsrebase.com}
  # What the CRM tells the hub about engagements (REB-1106): the bearer of the notice outbox and
  # of the referrer's name, equal to REBASE_PIGRO_NOTICES_TOKEN in the hub's `.env`. Empty: the
  # outbox waits and a letter prints «nessuno».
  PIGROCRM_HUB_NOTICES_TOKEN: ${PIGROCRM_HUB_NOTICES_TOKEN:-}
  # Browser origins allowed to call the API cross-origin, comma-separated. Empty: none,
  # the SPA is served from the API's own origin.
  PIGROCRM_CORS_ORIGINS: ${PIGROCRM_CORS_ORIGINS:-}
  # The MCP server, on both transports (the `mcp` service and the on-demand stdio
  # run), reports its tool calls to PostHog when the key is set (ORB-186). Empty:
  # it measures nothing.
  PIGROCRM_POSTHOG_KEY: ${PIGROCRM_POSTHOG_KEY:-}
  PIGROCRM_POSTHOG_HOST: ${PIGROCRM_POSTHOG_HOST:-https://eu.i.posthog.com}
  # PIGROCRM_COOKIE_SECURE is deliberately NOT set here -- do not add it.
  # a `.env` derived from `.env.example` carries, for the plain `uv run uvicorn`/
  # `uv run pytest` local-dev flow, PIGROCRM_COOKIE_SECURE=false for that flow's own
  # reason (see .env.example) -- a separate copy from the one compose reads for this
  # stack (.env.example's own header says where each lives). Compose only forwards
  # the variables a service's
  # `environment:` block names explicitly; it does not leak every key of `.env`
  # into every container. Leaving this key out means the api container always
  # gets Settings' own compiled-in default (cookie_secure=True), regardless of
  # what the local-dev section of `.env` says -- which is exactly what a real
  # deployment needs, and is the one thing that must NOT be copied from dev to
  # production. If a future change ever pipes ${PIGROCRM_COOKIE_SECURE} through
  # to this service, it re-opens that hole: `docker compose up` with an
  # unmodified `.env.example`-derived `.env` would then silently serve cookies
  # without `Secure`.

services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    # Postgres's own entrypoint starts as root to take the data directory over and then
    # drops to `postgres`: the capabilities it needs for that, and no others.
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    # A ceiling, not a reservation: the host holds five Postgres servers on 3.8 GiB.
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pigrocrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env, the password of the bootstrap superuser}
      POSTGRES_DB: ${POSTGRES_DB:-pigrocrm}
    # Data on the host, never in a Docker-managed volume: a `docker system prune`,
    # a Docker Desktop reset or a reinstall must not be able to take the register with
    # them (decision of 2026-09-04, after a daemon reset scared everyone).
    #
    # No default, on purpose (docs/adding-a-project.md §7, the hub's own compose file
    # does the same): a `.env` that forgets PIGROCRM_DATA_DIR must fail the stack here,
    # loudly, rather than bring Postgres up on an empty relative directory with the
    # health check answering 200 and the real register unmounted. A build never mounts
    # it, but compose interpolates the whole file before building, so `docker compose
    # build` needs a value too: CI and preflight pass a throwaway one (REB-258).
    volumes:
      - ${PIGROCRM_DATA_DIR:?set it in .env, to this stack's own directory outside the repository}:/var/lib/postgresql/data
    ports:
      - '${PIGROCRM_DB_PORT:-127.0.0.1:55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pigrocrm}']
      interval: 5s
      retries: 10

  # The schema, once per deploy and before `api` starts (INFRA-A-10): `alembic upgrade
  # head` knows only the root database; every space's database is migrated by
  # `ensure-space-defaults` right after, before it is furnished (ORB-189: 0.13.0 shipped a
  # migration the login depends on to spaces that never received it). It also creates and
  # grants `pigrocrm_app`, the role PIGROCRM_DATABASE_URL names and `api` connects as, on the
  # root and on every space (REB-634). Both run as the owner, PIGROCRM_ADMIN_DATABASE_URL.
  #
  # The container starts as root for one reason: to hand the documents directory, a bind
  # mount from the host, to uid 10001 (the image's `app`), which is what lets the
  # unprivileged `api` write there with nothing to prepare on the host. Then it gives up
  # root with `setpriv` before it touches the database. A one-shot: it ends `exited (0)`,
  # which `_deploy-compose.yml` accepts for this service, and `api` waits for it with
  # `service_completed_successfully`. While it runs, the previous `api` keeps serving.
  migrate:
    build:
      # The repository root, because both the uv workspace (pyproject.toml, uv.lock)
      # and the pnpm workspace (package.json, pnpm-lock.yaml) live there and the
      # image needs the lockfile it is pinned by.
      context: ../..
      dockerfile: projects/pigrocrm/Dockerfile.api
    restart: 'no'
    user: '0:0'
    <<: *hardening
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 768m
    depends_on:
      db:
        condition: service_healthy
    environment: *api-environment
    volumes:
      - ${PIGROCRM_DOCUMENTS_DIR:-../../var/documents}:/app/var/documents
    command:
      - sh
      - -c
      - >-
        chown -R 10001:10001 /app/var/documents &&
        exec setpriv --reuid=10001 --regid=10001 --clear-groups sh -c
        'cd projects/pigrocrm/packages/core && alembic upgrade head && cd /app &&
        python -m pigrocrm.core.cli ensure-space-defaults'

  api:
    build:
      context: ../..
      dockerfile: projects/pigrocrm/Dockerfile.api
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 1g
    pids_limit: 512
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *api-environment
    # The due-item reconciliation first (REB-968): `migrate` reconciled while the previous api
    # still served, and an invoice it wrote after that has no due item until this runs, now
    # that it is gone. A failure is a line on stderr and never keeps the api down.
    command:
      - sh
      - -c
      - >-
        python -m pigrocrm.core.cli reconcile-due-items;
        exec uvicorn pigrocrm_api.main:app --host 0.0.0.0 --port 8000
    # Where `PIGROCRM_STORAGE_BACKEND=local` writes documents (config.py's
    # `storage_local_root`, ./var/documents under the image's WORKDIR /app). On the
    # host, like the database above, so a rebuilt container keeps every PDF -- written
    # `../../` because compose resolves a relative volume against the directory of
    # this file, two levels below the repository root.
    volumes:
      - ${PIGROCRM_DOCUMENTS_DIR:-../../var/documents}:/app/var/documents
    healthcheck:
      # `GET /health` answers before any space is resolved, so this probe opens no
      # database. Written with the image's own python rather than curl or wget, neither
      # of which the api image carries. A hung uvicorn fails it, and `docker compose ps`
      # (and the deploy's check) says so; the restart policy alone only reacts to an exit.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mcp:
    build:
      context: ../..
      dockerfile: projects/pigrocrm/Dockerfile.api
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 512m
    pids_limit: 512
    # After `api` is healthy, which is after the migrations it waited for: nothing in this
    # process opens a database before its first request, but a first request on an
    # unmigrated space is the thing this ordering rules out.
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment: *mcp-environment
    # `uvicorn`, `starlette` and `anyio` are in this process through the `mcp` SDK's own
    # dependencies and the shared api image, which is why apps/mcp/pyproject.toml
    # declares none of the three.
    command: ["uvicorn", "pigrocrm_mcp.http:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      # `GET /health` (spec §3) answers before any space is resolved, so this probe
      # opens no database.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ${PIGROCRM_DOCUMENTS_DIR:-../../var/documents}:/app/var/documents

  web:
    build:
      context: ../..
      dockerfile: projects/pigrocrm/Dockerfile.web
    restart: unless-stopped
    <<: *hardening
    read_only: true
    # nginx-unprivileged keeps its pid file, temp files and cache under /tmp, and buffers a
    # request body or a response there: spa.conf allows 105 MiB uploads (documents, the invoice
    # import) and the same size of download, so the tmpfs holds one of them with room, and its
    # pages count against the memory limit.
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 384m
    pids_limit: 128
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/app/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      # Overridable so a second environment (preview) can run the same stack on the
      # same host without fighting for the port. Bound to the loopback in both cases:
      # nginx on the host is what faces the internet, and publishing to 0.0.0.0 would
      # walk straight past the firewall. The container listens on 8080: it is not root.
      - '${PIGROCRM_WEB_PORT:-127.0.0.1:8080}:8080'
