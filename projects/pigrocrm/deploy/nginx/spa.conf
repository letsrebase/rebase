server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A request reaches this container across two nginx hops: the host vhost
    # (`orbiters-proxy.conf`) sets `X-Real-IP` to the actual visitor, and until this
    # fix every `proxy_set_header X-Real-IP` line below overwrote it again with
    # `$remote_addr`, which inside this container is always the compose bridge
    # gateway -- the same address for every visitor on the internet. That collapsed
    # `ratelimit.client_key` (apps/api/.../ratelimit.py) into one shared bucket for
    # the whole installation (REB-269). `set_real_ip_from` plus `real_ip_header`
    # tell nginx's own realip module (compiled into `nginx:1.30-alpine`, confirmed
    # with `nginx -V`) to read `$remote_addr` from the trusted header instead of the
    # raw socket peer, before any `proxy_set_header` line runs -- so those lines
    # forward the visitor's real address on the second hop rather than the first
    # hop's. `docker-compose.yml` declares no custom network for this stack, so
    # compose's default bridge network is what reaches this container, and
    # `172.16.0.0/12` covers the whole range Docker draws that bridge from.
    # `real_ip_recursive off` (nginx's own default, made explicit): `X-Real-IP`
    # carries one address, never a list, so there is nothing to recurse into.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    # nginx's own compiled-in default (1m) made explicit rather than left to depend
    # on whatever `nginx:1.30-alpine`'s upstream build happens to ship: a request
    # this container answers on its own, never proxied anywhere, has no legitimate
    # reason to carry more than a form submission. The one route that does -- a
    # document upload -- raises its own limit below, at the `location` that needs it
    # (REB-252).
    client_max_body_size 1m;

    # 127.0.0.11 is Docker's own embedded DNS server, reachable at that fixed
    # address inside every container on a user-defined bridge network (which is
    # what `docker compose` creates for this stack) -- not the host's resolver, and
    # not optional. Without an explicit `resolver`, nginx resolves a `proxy_pass`
    # hostname exactly once, at config load, and caches that IP for the worker
    # process's entire lifetime. `docker compose up -d --build` only recreates the
    # services whose image actually changed: a backend-only change gives the `api`
    # container a new IP on the compose network while this `web` container keeps
    # running unchanged, still proxying to the address `api` had before the
    # redeploy -- every request 502s until `web` itself is also restarted, with
    # nothing about the deploy step itself failing or logging why. `valid=10s`
    # bounds how long a resolution is trusted before nginx re-asks, so a redeployed
    # `api` is reachable again within seconds, not only after `web`'s own restart.
    resolver 127.0.0.11 valid=10s;

    # Relative `Location` headers on every redirect below. Without this nginx builds
    # an absolute URL from `$scheme://$host` and **drops a non-default port**:
    # measured against this very image, `curl http://127.0.0.1:8080/login` answered
    # `302 -> http://127.0.0.1/app/login`, sending the browser to port 80. Invisible
    # behind a reverse proxy on 80/443, which is why it would have shipped -- and
    # broken for anyone reaching the container directly, which is exactly how the
    # compose stack is reached in development and in the README's own quick start.
    # A relative Location is correct under every scheme, host and port at once.
    absolute_redirect off;

    # REB-271: the host vhost in front of this container (pigro.letsrebase.conf,
    # preview.pigro.letsrebase.conf) carries the full security-headers set --
    # deploy/nginx/security-headers.conf -- since it is the one hop that terminates
    # TLS and sees every response; a Strict-Transport-Security or a CSP set here would
    # be meaningless on the plain HTTP this container speaks inside the compose
    # network. `nosniff` costs nothing to repeat and matters for whoever reaches this
    # container directly, without that vhost in front (local `docker compose`, a
    # health check).
    add_header X-Content-Type-Options nosniff always;

    # This image is the application and nothing else since 2026-09-09: the public
    # pages moved to their own project and their own container, and the host sends
    # letsrebase.com there. The document root therefore holds only /app, so the
    # bare root is a redirect into the application rather than a page.
    #
    # `= /app` earns its line: without it the bare path never enters the `^~ /app/`
    # prefix block below and falls through to the catch-all.
    location = /            { return 302 /app/; }
    location = /app         { return 302 /app/; }
    location = /login       { return 302 /app/login; }   # old links do not die

    # Client-side routing, now scoped: an unknown path under /app/ is a route, not a
    # missing file, so a refresh on a deep link like /app/clienti/<uuid> re-serves
    # the SPA shell. Scoping it to `^~ /app/` is what stops that fallback from also
    # swallowing `/`, which is the whole reason this block changed.
    location ^~ /app/       { try_files $uri /app/index.html; }

    # REB-229: the magic-link token travels as `?t=` on this exact GET, so the
    # `combined` format's `$request` would otherwise write a live, unspent
    # credential into this container's access log (the URL itself is also taken out
    # of the browser before it is spent, in main.tsx). `access_log off` here serves
    # the SPA exactly like the `^~ /app/` block above -- an exact match always wins
    # over that prefix, and a query string never affects nginx's own location
    # matching -- except `try_files` must find something on its first try: given
    # `$uri` as one of its parameters, `/app/verify` never exists on disk, so
    # `try_files` falls through to its *last* parameter as an internal redirect to
    # `/app/index.html`, which reruns location matching and finishes the request
    # inside `^~ /app/` -- nginx's log phase reads the location the request ended in,
    # not the one it started in, so `access_log off` would be silently discarded and
    # the original `?t=` logged anyway (reproduced against this exact file). Naming
    # `/app/index.html` as the *first* parameter, the same shape the slug block below
    # already uses, is what keeps the request inside this location.
    location = /app/verify   { access_log off; try_files /app/index.html =404; }

    # REB-291: the invitation link (`_invite_url` in routers/users.py) is the same
    # `?t=` shape on `/app/invite`, and its token is a week-lived, single-use
    # credential -- the exact live-credential class REB-229 took the magic link's
    # out of this log for. Same first-parameter rule as the block above.
    location = /app/invite   { access_log off; try_files /app/index.html =404; }

    # Old path (Italian route names retired 2026-09-21, see docs/design/DECISIONS.md):
    # a magic-link email sent before this rename still carries `/app/entra?t=`, so
    # this redirects straight to `/app/verify` rather than falling into the generic
    # `^~ /app/` block above, which would serve the SPA shell at the old path and log
    # the live token in `access_log` before the client-side redirect in
    # `routes/app/entra.tsx` ever got a chance to run.
    location = /app/entra   { access_log off; return 301 /app/verify$is_args$args; }

    # Spaces (spec 2026-09-08): `/<slug>/app/...` is the same SPA shell -- its assets stay
    # absolute under /app/ -- and the SPA reads the prefix from the URL; `/<slug>/api/...`
    # and `/<slug>/health` go to the API with the full path, whose middleware strips the
    # prefix. Regex locations lose to the exact and `^~` ones above, so `/`, `/app/`
    # and `/login` keep winning even though they would match here. Since the public
    # pages left this image, a bare `/privacy` reaching this container directly is
    # read as a space name and redirects to /privacy/app/; on the server it never
    # gets here, because the host redirects those four paths to letsrebase.com.
    # Quoted, and not by taste: a regex with `{1,30}` in it is a block opener to nginx's
    # parser unless it is a string -- the unquoted form fails `nginx -t` with
    # "unexpected end of file" and took the container down with it.
    # Same reasoning as the exact `/app/verify` block above, for a space's own
    # prefix: this regex must be more specific than, and therefore precede, the
    # general `/app(/|$)` one below, since nginx tries regex locations in file
    # order and stops at the first match.
    location ~ "^/[a-z0-9][a-z0-9-]{1,30}[a-z0-9]/app/verify$" {
        access_log off;
        try_files /app/index.html =404;
    }
    # Same reasoning for a space's own prefix (REB-291), ordered before the general
    # `/app(/|$)` regex below for the same first-match reason.
    location ~ "^/[a-z0-9][a-z0-9-]{1,30}[a-z0-9]/app/invite$" {
        access_log off;
        try_files /app/index.html =404;
    }
    # Old path, slug-prefixed: a tenant-specific magic-link email sent before this
    # rename (`_entra_url` in apps/api/src/pigrocrm_api/routers/auth.py) still
    # carries `/<slug>/app/entra?t=`.
    location ~ "^(/[a-z0-9][a-z0-9-]{1,30}[a-z0-9])/app/entra$" {
        access_log off;
        return 301 $1/app/verify$is_args$args;
    }
    location ~ "^/[a-z0-9][a-z0-9-]{1,30}[a-z0-9]/app(/|$)" { try_files /app/index.html =404; }
    # A logged-in session always runs under its space's prefix (`lib/tenant.ts`
    # prepends it to every API call), so the document upload this file's own
    # `location ^~ /api/documents/` raises the limit for is never reached at that
    # bare path in real traffic -- it is reached here instead, and without this
    # block it would fall into the `(api|health)` regex below and inherit the
    # tight 1m default, the exact 413 REB-252 exists to fix. Ordered before that
    # regex: nginx tries regex locations in file order and stops at the first
    # match, so the more specific pattern has to come first.
    location ~ "^/[a-z0-9][a-z0-9-]{1,30}[a-z0-9]/api/documents(/|$)" {
        client_max_body_size 105m;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ "^/[a-z0-9][a-z0-9-]{1,30}[a-z0-9]/(api|health)(/|$)" {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # The MCP server over HTTP (ORB-170): /<slug>/mcp and, below, /mcp for the root, to
    # the `mcp` service. Same variable-upstream reasoning as the API blocks. JSON
    # request/response, but buffering is off and the read timeout is long because the
    # transport may also answer with an event stream.
    location ~ "^/[a-z0-9][a-z0-9-]{1,30}[a-z0-9]/mcp(/|$)" {
        set $mcp_upstream http://mcp:8001;
        proxy_pass $mcp_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ "^/([a-z0-9][a-z0-9-]{1,30}[a-z0-9])$" { return 302 /$1/app/; }

    # Anything else: a bare 404 rather than an SPA fallback. Nothing but /app now
    # lives under the document root, so this is the honest answer.
    location / {
        try_files $uri =404;
    }

    # `POST /api/documents/{id}/versions` is the one route in this stack that
    # accepts a file body, and `DocumentService._check_upload` (packages/core/src/
    # pigrocrm/core/documents/schemas.py `DIMENSIONE_MAX`) refuses anything over
    # 100 MiB with the product's own message. 105m, not 100m: a multipart body
    # wraps that file in a boundary and a `Content-Disposition` header nginx counts
    # against the same limit, so a file at the exact application ceiling must clear
    # nginx's gate too, with room for the wrapper rather than exactly none. Every
    # other route under /api/documents/ (create, list, restore) sends bytes this
    # small anyway, so the higher ceiling here costs nothing on them.
    location ^~ /api/documents/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 105m;
    }

    location /api/ {
        # A `proxy_pass` target is only re-resolved per-request, honouring the
        # `resolver` above, when it is a *variable* -- a literal hostname here
        # (`http://api:8000/api/`, this block's own value until this fix) is
        # resolved once at config load regardless of any `resolver` directive
        # being present at all.
        #
        # `$request_uri`, not a literal `/api/` (or nothing): nginx's own docs on
        # `proxy_pass` are explicit that a *static* URI after the host, in a
        # prefix `location`, replaces the matched location prefix (here, `/api/`
        # replaced by `/api/` -- a no-op that forwards the full original path,
        # e.g. `/api/customers/abc` stays `/api/customers/abc`) -- but the moment
        # the directive contains a variable, that prefix-substitution does not
        # happen at all; whatever URI is written is instead sent to the upstream
        # verbatim, in place of the original request URI (confirmed against
        # nginx.org's own documented example, `proxy_pass http://127.0.0.1$request_uri;`,
        # which re-supplies it explicitly for exactly this reason). Writing a
        # literal `/api/` here instead -- the natural-looking equivalent of the
        # static version above -- would have sent every request to that same bare
        # path regardless of the real one, silently breaking every route under
        # `/api/` except the prefix itself. `$request_uri` is what actually
        # reproduces the static form's behaviour, now resolved per-request.
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # apps/api/src/pigrocrm_api/main.py registers this probe at the bare path
    # `/health`, not under `/api/` (every real router in apps/api/src/pigrocrm_api/
    # routers/*.py prefixes itself with `/api/...`; this one intentionally does
    # not, since it exists for the deployment layer, not the SPA). An exact-match
    # location is required here -- folding it into the `/api/` prefix block above
    # would forward a request for it to `/api/health` upstream, a path the
    # backend does not serve (verified by reading main.py's route registration
    # and the generated OpenAPI schema, both of which list only `/health`), so
    # this stack's own verification curls this exact-match path, not `/api/health`.
    location = /health {
        # Same stale-IP risk as `/api/` above, same fix, same `$request_uri`
        # reasoning -- this is an exact-match location, but the same nginx rule
        # still applies once a variable is involved.
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
    }

    # `/mcp/` is the same endpoint with a trailing slash, which `= /mcp` does not match
    # and the bare-slug regex above does not either; a client that sends it would read a
    # 404 from the catch-all instead of the server.
    location = /mcp/ { return 308 /mcp; }

    # `mcp`, like every other slug-shaped name, matches the bare-slug regex above
    # (`^/([a-z0-9][a-z0-9-]{1,30}[a-z0-9])$`) and would redirect to /mcp/app/ --
    # but nginx always prefers an exact match over any regex, so this block wins
    # and the redirect never fires for it. Keep this block.
    location = /mcp {
        set $mcp_upstream http://mcp:8001;
        proxy_pass $mcp_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
