# pigro.letsrebase.com -- the CRM itself, the whole compose stack under one name.
#
# Everything the stack on 127.0.0.1:8080 serves passes through: the SPA at /app/, the
# API at /api/, the hashed assets. What this name does not serve is the public site:
# the root goes into the CRM, and the four public paths redirect to letsrebase.com,
# which since 2026-09-09 is a different container in a different project.
#
# **The root slug is not in this file.** `__ROOT_SLUG__` below is a placeholder for the
# value of `PIGROCRM_ROOT_SLUG` in that environment's `.env`, which is a real company's
# name and therefore never committed. Substitute it when installing:
#
#   slug=$(grep -oP '(?<=^PIGROCRM_ROOT_SLUG=).*' /opt/pigrocrm/.env)
#   sed "s/__ROOT_SLUG__/$slug/g" pigro.letsrebase.conf \
#     | sudo tee /etc/nginx/sites-available/pigro.letsrebase.conf
#
# A copy installed with the placeholder still resolves: every `/app/` deep link
# redirects to a space that does not exist and the SPA answers its own 404, while the
# login keeps working. That is the failure to look for if login works and nothing else
# does. The same goes for the four OAuth paths, whose redirect carries the session
# cookie's scope.
#
# TLS is added by `certbot --nginx`, which rewrites this file in place: the copy in
# `/etc/nginx/sites-available/` has certbot's port-443 block on top of it, and stays
# edited in place there rather than overwritten, or TLS disappears on the next
# change (`nginx -t` before the reload). That includes the robots header and the
# `/robots.txt` location this file gained for REB-107, and the
# `include /etc/nginx/snippets/pigrocrm-security-headers.conf;` line and the
# `Content-Security-Policy` header it carries, gained for REB-271 and enforcing since
# REB-306: paste each into the installed copy's existing server block, not
# over it. That snippet file itself (`deploy/nginx/security-headers.conf` in this
# directory) has to reach the host at that same path too, copied across whenever it
# changes.

server {
    listen 80;
    listen [::]:80;
    server_name pigro.letsrebase.com;

    absolute_redirect off;

    # Explicit rather than left to whatever this server's own `http` block happens
    # to default to (REB-252): a request this vhost proxies has no legitimate
    # reason to carry more than a form submission, and the one route that does --
    # a document upload -- raises its own limit below, at the `location` that
    # needs it.
    client_max_body_size 1m;

    # REB-271: HSTS, an enforcing CSP (flipped by REB-306), frame-ancestors, nosniff,
    # Permissions-Policy -- see deploy/nginx/security-headers.conf for what each line
    # is and why it lives here rather than in spa.conf.
    include /etc/nginx/snippets/pigrocrm-security-headers.conf;

    # The root redirect below answers with a real company's name in its `Location`
    # (the root slug, kept out of git but not out of an HTTP response): a crawler
    # must never be allowed to publish it. REB-107.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # The root installation's own space name (`PIGROCRM_ROOT_SLUG`): the bare host and
    # the unprefixed login land there, so the titolare's CRM has an address shaped like
    # everyone else's. Deep links and assets under /app/ keep working unprefixed -- the
    # same SPA, the same database.
    location = /          { return 302 /__ROOT_SLUG__/app/; }
    location = /app       { return 302 /__ROOT_SLUG__/app/; }
    # Every page under /app/ moves under the root's name, so the address always says
    # whose CRM this is; the bundle's assets and the tab icon are not pages, and the
    # login and the signup are the two pages that stay bare on purpose (2026-09-09): a
    # person who has just logged out, or who is creating a space, is nobody's yet and
    # must not read a space's name in the address. The root's cookies live at `/`, so
    # a session opened on the bare login is the same session under the root's prefix.
    location = /app/login {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    location = /app/register {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    # Old path (Italian route names retired 2026-09-21, see docs/design/DECISIONS.md):
    # the hub's own `Area.tsx` still links here until that cross-project update lands
    # separately, and an indexed or bookmarked link must not break either way.
    location = /app/registrati { return 301 /app/register$is_args$args; }
    location ^~ /app/assets/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    location = /app/mark.svg {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    location ^~ /app/ { return 302 /__ROOT_SLUG__$request_uri; }

    # The magic-link and invitation tokens arrive as ?t= on these paths; the default
    # log format would keep a live one-time credential on disk. REB-229, REB-291.
    location = /app/verify { access_log off; return 302 /__ROOT_SLUG__$request_uri; }
    location ~ "^/[a-z0-9][a-z0-9-]{1,30}[a-z0-9]/app/verify$" {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    # REB-291: the invitation link is the same `?t=` shape, on /app/invite.
    location = /app/invite { access_log off; return 302 /__ROOT_SLUG__$request_uri; }
    location ~ "^/[a-z0-9][a-z0-9-]{1,30}[a-z0-9]/app/invite$" {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
    # Old path (Italian route names retired 2026-09-21, see docs/design/DECISIONS.md):
    # a magic-link email sent before this rename still carries `/app/entra`, so this
    # keeps working the same way as the renamed blocks above, `access_log off` and
    # all -- a live token must never reach this container's own access log.
    location = /app/entra { access_log off; return 301 /app/verify$is_args$args; }
    location ~ "^(/[a-z0-9][a-z0-9-]{1,30}[a-z0-9])/app/entra$" {
        access_log off;
        return 301 $1/app/verify$is_args$args;
    }

    # The public pages are the website's, on its own name and its own container since
    # 2026-09-09. They used to answer here too, because one image served both: a
    # permanent redirect rather than a second copy, so a policy is edited in one place
    # and an old link still resolves.
    location = /pigrocrm { return 301 https://letsrebase.com/pigrocrm; }
    location = /privacy  { return 301 https://letsrebase.com/privacy; }
    location = /termini  { return 301 https://letsrebase.com/terms; }
    location = /orbiters { return 301 https://letsrebase.com/; }

    # The Google OAuth flow starts from a plain `/api/.../oauth/start` anchor and comes
    # back to the registered `/api/.../oauth/callback`; both need the session cookie,
    # which is scoped to the root space's prefix. Moving the four under the root's name
    # is what lets the cookie travel (2026-09-09). A space with a client of its own has
    # its callback registered under its prefix and never lands here; a space borrowing
    # the root's client (PIGROCRM_GOOGLE_SHARED_CLIENT, REB-394) does, and the API under
    # the root's name hands it on to `/<slug>/api/.../oauth/callback`, the slug read off
    # the OAuth state. Nothing to change here for that.
    location = /api/gmail/oauth/start    { return 302 /__ROOT_SLUG__$request_uri; }
    location = /api/gmail/oauth/callback { return 302 /__ROOT_SLUG__$request_uri; }
    location = /api/drive/oauth/start    { return 302 /__ROOT_SLUG__$request_uri; }
    location = /api/drive/oauth/callback { return 302 /__ROOT_SLUG__$request_uri; }

    # The MCP server over HTTP (ORB-170): a tool call answers only when it has
    # finished, so the read timeout here has to match the one inside the web
    # container (deploy/nginx/spa.conf), or the 300 s there is decoration behind
    # this vhost's 60 s default. Quoted for the same reason as in spa.conf: a regex
    # with `{1,30}` in it is a block opener to nginx's parser unless it is a string.
    location ~ "^(/[a-z0-9][a-z0-9-]{1,30}[a-z0-9])?/mcp(/|$)" {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/orbiters-proxy.conf;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # `POST /api/documents/{id}/versions` is the one route in this stack that
    # accepts a file body, and `DocumentService._check_upload` (packages/core/src/
    # pigrocrm/core/documents/schemas.py `DIMENSIONE_MAX`) refuses anything over
    # 100 MiB with the product's own message. 105m, not 100m: a multipart body
    # wraps that file in a boundary and a `Content-Disposition` header this
    # directive counts against the same limit, so a file at the exact application
    # ceiling must clear this gate too, with room for the wrapper rather than
    # exactly none. The optional slug group, the same shape as the MCP block
    # above: `/app/` redirects into a space's own prefix, so a signed-in session
    # always uploads at `/<slug>/api/documents/...`, not the bare path.
    location ~ "^(/[a-z0-9][a-z0-9-]{1,30}[a-z0-9])?/api/documents(/|$)" {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/orbiters-proxy.conf;
        client_max_body_size 105m;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/orbiters-proxy.conf;
    }
}
