# REB-271: the response headers a browser needs to defend the CRM's own session,
# beyond what TLS itself gives it.
#
# **Why these headers live here and not in `spa.conf`.** A request crosses two nginx
# hops (`spa.conf`'s own head comment has the diagram): the host vhost terminates TLS
# and is the only hop that sees every response, including the ones the host itself
# answers without ever reaching the `web` container (the `/app/login` and
# `/app/register` proxies, the redirects, `/robots.txt`). `spa.conf` sees only what
# the host forwards to it, and only over plain HTTP inside the compose network, where
# `Strict-Transport-Security` would be meaningless (a browser ignores it unless the
# response that carried it was itself over HTTPS) and a CSP would have to be
# duplicated at both hops to mean anything. So the full set below is included once
# here, from the host vhosts (`pigro.letsrebase.conf`, `preview.pigro.letsrebase.conf`)
# only; `spa.conf` gets its own single `X-Content-Type-Options: nosniff`, for whoever
# reaches the container directly (local `docker compose`, a health check) without the
# host in front of it.
#
# **Where this file has to live on the host.** `/etc/nginx/snippets/pigrocrm-security-
# headers.conf`, beside `orbiters-proxy.conf`, which the same two vhosts already
# `include` the same way. Installing a vhost that `include`s a path with nothing there
# fails `nginx -t` outright, so this file has to be copied across before, or in the
# same change as, the `include` line below is added to the installed copy.
#
# **`always` on every line**, so nginx sends the header on every status code an error
# page produces too, not only on 2xx responses (nginx's own default, made explicit).
#
# **Every `add_header` sits at server level in the files that include this one, before
# their first `location`.** nginx does not inherit `add_header` into a location block
# that declares its own (`robots.test.ts` already pins this for the X-Robots-Tag line
# in `pigro.letsrebase.conf`) -- a location added later that needs its own `add_header`
# has to repeat this whole file's `include` line, or repeat every directive below by
# hand, or it silently loses all of them for that one response.
#
# **One CSP, enforced since REB-306 (2026-09-22).** It shipped as two headers
# (REB-271): `frame-ancestors 'none'` enforced from day one -- nothing here is ever
# meant to be framed -- and everything else report-only, because the directive set
# was a real guess at what the SPA loads and a wrong guess in an enforcing header
# breaks the application. The watch-and-flip step was the proof: the SPA's static
# shell, `/app/login`, `/app/register`, `/app/verify` and a signed-out dashboard were
# served locally behind these exact headers with a headless Chromium capturing
# `securitypolicyviolation` events and the console, and no violation fired on any of
# them (the CRM's PostHog traffic stays inside the two EU hosts already allowed; the
# blob: PDF preview and the Google OAuth links are navigations and downloads, not
# framed or fetched content). The two headers therefore merged into this single
# enforcing one; `X-Frame-Options: DENY` stays for a browser that predates
# `frame-ancestors`. There is still no `report-to`/`report-uri` collector (standing
# up one is a product decision, not a side effect of this change), so an enforcement
# violation shows up in whoever's devtools console and nowhere else.
#
# **Where the policy below comes from** (`projects/pigrocrm/apps/web`, read against the
# built SPA, `shared/analytics`): no inline `<script>` or `<style>` tag anywhere in
# `index.html`, so `script-src` needs nothing but `'self'` and the PostHog asset host
# the SPA already loads its session-recording bundle from (`eu-assets.i.posthog.com`,
# `shared/analytics/posthog.ts`); `style-src` needs `'unsafe-inline'` because `radix-ui`
# (its scroll lock) and `sonner` (rendered through `@rebase/ui`, whose `package.json`
# carries the dependency) both inject a `<style>`
# element into the document at runtime, which no nonce this build can mint reaches --
# a computed `style={{ ... }}` prop, like the ones the dashboard charts set for a bar's
# width or colour (`apps/web/src/features/dashboard/MonthlyBars.tsx`, `charts.tsx`),
# does *not* need this: React writes those through the CSSOM (`element.style.
# setProperty`), which CSP's `style-src` does not govern, only a `style` HTML
# attribute's text or a `<style>` element's content; `connect-src` needs `'self'` (the
# API is same-origin behind this vhost) plus both PostHog hosts, events and asset
# alike; `frame-src` needs `'self' blob:` for the invoice PDF preview, which renders a
# `blob:` object URL (`apps/web/src/features/invoices/InvoicePdfPreview.tsx`) in an
# `<iframe>` rather than pointing it at the authenticated API route directly (that
# route answers `Content-Disposition: attachment`, which a frame would turn into a
# download); `img-src` and `font-src` stay `'self'` only, since every asset and the one
# webfont (`shared/brand/font.css`) are self-hosted and nothing in the SPA reads a
# `data:` URI image. `object-src 'none'` and `base-uri 'self'` cost nothing either --
# nothing here embeds a plugin or writes a `<base>` tag -- so they stay in the policy.
#
# **`Referrer-Policy: strict-origin`, not the more common `strict-origin-when-cross-
# origin`.** The two are identical cross-origin (only the origin ever leaves); they
# differ on a same-origin request, where `strict-origin` still sends only the origin
# and `strict-origin-when-cross-origin` sends the full URL. `/app/verify?t=<token>`
# (`apps/web/src/routes/app/verify.tsx`) carries a live magic-link token in its query
# string, and the browser requests that page's own same-origin assets (the bundled JS,
# the CSS) before `lib/entra-token.ts` can strip it from the address bar -- with the
# weaker value, every one of those requests would carry the token in its own `Referer`,
# for nginx's access log to record right back. Nothing here needs a same-origin request
# to know the full path it came from.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://eu-assets.i.posthog.com; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; frame-src 'self' blob:; connect-src 'self' https://eu.i.posthog.com https://eu-assets.i.posthog.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
