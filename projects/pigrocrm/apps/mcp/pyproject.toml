[project]
name = "pigrocrm-mcp"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pigrocrm-core",
    "mcp==2.0.0",
    "posthog==7.58.0",
]

[tool.uv.sources]
pigrocrm-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pigrocrm_mcp"]
