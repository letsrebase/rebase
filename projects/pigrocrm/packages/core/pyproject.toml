[project]
name = "pigrocrm-core"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "sqlalchemy==2.0.51",
  "alembic==1.19.0",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "email-validator==2.3.0",
  "argon2-cffi==25.1.0",
  # The `crypto` extra pulls in `cryptography`, needed for the RS256 assertion a
  # Google service account signs to obtain an access token (storage/gdrive.py). The
  # architecture test resolves this entry to the module root `jwt` through
  # DIST_TO_MODULE_OVERRIDES and strips the extra exactly as it already does for
  # `psycopg[binary]`, so no test change is needed.
  "pyjwt[crypto]==2.14.0",
  # Declared in its own right, and not left to ride in as `pyjwt[crypto]`'s transitive
  # edge: `gmail/crypto.py` imports `cryptography` directly for the AES-256-GCM that
  # seals `google_accounts.refresh_token_ciphertext`, and a transitive edge is not a
  # contract -- pyjwt is free to drop the extra or swap the backend in any release.
  # test_architecture.py's allowlist is built from this list precisely so that an
  # undeclared import fails rather than works by accident. Pinned to the version
  # `uv.lock` already resolves, so this adds a promise and not a new download.
  "cryptography==50.0.1",
  "uuid-utils==0.17.0",
  "lxml==6.1.2",
  # Only `zoneinfo.ZoneInfo("Europe/Rome")` needs this, and only because
  # `Dockerfile.api` pins no TZ, so `python:3.13-slim-bookworm` runs in UTC by
  # default: a base image is not guaranteed to ship the IANA tz database at all
  # (Python's own docs recommend this exact package for that reason), so emission's
  # notion of "today in the issuer's calendar" cannot depend on the host having it.
  "tzdata==2026.3",
  # The XLSX writer. Declared on **core**, not on apps/api, because
  # packages/core/tests/test_architecture.py derives its import allowlist from this
  # list and the workbook builder is a domain function -- the API image installs
  # core's dependencies anyway, which is what the spec's "nell'immagine dell'API"
  # means in practice. The architecture test resolves this entry to the module root
  # `openpyxl` with no override needed.
  "openpyxl==3.1.5",
  # PDF text extraction for `drive/text.py`. Pure Python, no binary: the alternative
  # the test suite already uses -- shelling out to `pdftotext` -- is a Poppler binary
  # that happens to be in the API image because Pandoc put it there, which is a fine
  # thing for a test fixture to lean on and a bad thing for a production read path
  # (`packages/core` is imported by the MCP image too, and a `FileNotFoundError` from
  # `subprocess.run` is not a failure a person reading a document can act on).
  # Pinned like every other entry here, and declared because
  # `test_architecture.py` builds core's import allowlist from this list.
  "pypdf==6.17.0",
  # The same pin as hub's `rebase-core`: the weekly digest's own PostHog event (REB-221).
  "posthog==7.53.0",
]

[project.scripts]
pigrocrm = "pigrocrm.core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pigrocrm"]

# No `force-include` entry for `render/assets` here, on purpose, despite the task
# brief's own sample suggesting one: hatchling's default wheel builder already
# bundles every non-Python file living under `packages` above (confirmed by
# unzipping a real build -- `pigrocrm/core/render/assets/**`, media PNGs included,
# was already present with no extra section at all). Adding the brief's suggested
# `[tool.hatch.build.targets.wheel.force-include]` on top of that duplicate-includes
# the same files and fails the build outright ("A second file is being added to the
# wheel archive at the same path") -- confirmed live, not merely redundant.
