# vault.letsrebase.com -- Vaultwarden, the rebase members' password manager (REB-644,
# REB-648).
#
# Vaultwarden runs in its own compose project (`vaultwarden`, docker-compose.yml beside
# this directory) on 127.0.0.1:8091, and this name proxies all of it: the web vault, the
# API the Bitwarden apps and extensions call, and the notifications socket.
#
# Unlike firma.letsrebase.conf, this vhost does not include
# /etc/nginx/snippets/orbiters-proxy.conf: a snippet that lives only on the host cannot
# be linted here or reviewed in a PR, and this name needs one header the shared one does
# not promise (the websocket upgrade). Every header the upstream reads is set below.
# `X-Real-IP` is the socket peer, which is what IP_HEADER names in the compose file; it
# is set here, never forwarded, so a client cannot pick the address its rate limit is
# counted against.
#
# No Content-Security-Policy of ours: Vaultwarden sends its own, and the website's
# (projects/website/deploy/security-headers.conf) would break the web vault.
#
# This plain-HTTP block is the template `certbot --nginx --redirect -d vault.letsrebase.com`
# turns into the HTTPS server (a certificate of its own, never `--expand`: it would
# rewrite every vhost it matches, docs/adding-a-project.md §7). The copy here is the
# source of truth; the installed copy in /etc/nginx/sites-available/ has certbot's 443
# block on top and is edited in place, with `nginx -t` before every reload. The
# `Strict-Transport-Security` line is on this 80 block for the record: a browser only
# honours it over HTTPS, so it has to be on the installed copy's 443 block too.

# The upgrade header of a websocket request, and nothing for any other request on the
# same paths. The variable is named for this vhost: a `map` is global to nginx, and the
# conventional `$connection_upgrade` may already exist elsewhere on the host.
map $http_upgrade $vaultwarden_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name vault.letsrebase.com;

    # Attachments are the only large bodies. Vaultwarden's own limits decide the rest.
    client_max_body_size 128M;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The apps' sockets, served on the same port since Vaultwarden 1.29: `hub` is live
    # sync, `anonymous-hub` is "log in with device". Both only speak websocket.
    location ^~ /notifications/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vaultwarden_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
