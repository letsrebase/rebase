# The drill's stand-ins on the compose network: for R2, an S3 gateway that verifies
# Signature V4, and for healthchecks.io, `ping`, which answers 200 to anything and prints
# each request line (`docker compose logs ping`). The backup service is pointed at both.
# Throwaway keys, throwaway storage.
services:
  s3:
    image: ghcr.io/versity/versitygw:v1.8.0
    command: ['--access', 'drillkey', '--secret', 'drillsecret', 'posix', '--nometa', '/data']
    tmpfs:
      - /data
  ping:
    # The server's own image, so the drill pulls nothing more (it carries perl). The drill
    # exports it from docker-compose.yml, so a bump never has to be made twice.
    image: ${VAULTWARDEN_DRILL_IMAGE:?backup-restore.sh exports it}
    entrypoint:
      - /usr/bin/perl
      - -MIO::Socket::INET
      - -e
      - |
        $$| = 1;
        my $$server = IO::Socket::INET->new(LocalPort => 8080, Listen => 5, ReuseAddr => 1) or die "listen: $$!";
        while (my $$client = $$server->accept) {
          my $$line = <$$client>;
          print "ping: $$line";
          while (my $$header = <$$client>) { last if $$header =~ /^\r?$$/ }
          print $$client "HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nOK";
          close $$client;
        }
  backup:
    depends_on:
      s3:
        condition: service_started
      ping:
        condition: service_started
    environment:
      VAULTWARDEN_BACKUP_S3_ENDPOINT: http://s3:7070
      VAULTWARDEN_BACKUP_REGION: us-east-1
