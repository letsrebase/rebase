# The Node gate, once, for every project in the monorepo. Same reasoning as
# _python-gate.yml: a second Node app should cost a dozen lines in ci.yml, not a
# second copy of this file. Nothing here names PigroCRM.
name: node gate

on:
  workflow_call:
    inputs:
      filter:
        description: >-
          pnpm filter selecting the package under test. Written without the trailing
          "..." by the caller; this file appends it where the dependency closure is
          what should be installed.
        required: true
        type: string
      build:
        description: run the package's build script
        required: false
        default: true
        type: boolean
      lint:
        description: run the package's lint script. Off for a shard that only adds tests.
        required: false
        default: true
        type: boolean
      test:
        description: >-
          run the package's unit tests. Off for a call that only lints, builds and
          type-checks, so those three can be a job of their own beside test shards that
          do nothing else. With `typecheck` on and `test` off, keep `build` on for a
          package whose route tree is generated (the CRM's web): only a vite run writes
          it, and tsc fails with TS2307 without it.
        required: false
        default: true
        type: boolean
      typecheck:
        description: run tsc. Off for a shard that only adds tests.
        required: false
        default: true
        type: boolean
      shard:
        description: >-
          `k/n`: run only the k-th of n slices of the package's test files, vitest's own
          `--shard`, so a caller can spread one suite over n jobs that run side by side.
          vitest orders the files by a sha1 of their path and slices that order, so the
          slices are deterministic, disjoint and together the whole suite, but a new
          file reshuffles them and nothing is balanced by duration. Empty runs every
          file in this one job.
        required: false
        default: ''
        type: string
      job-name:
        description: >-
          Name of the inner job, half of the check name GitHub shows. A caller that runs
          this gate in a matrix names each shard by what it does.
        required: false
        default: lint · unit · build · typecheck
        type: string

jobs:
  gate:
    name: ${{ inputs.job-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # No version pinned here: pnpm/action-setup reads `packageManager` from the
      # root package.json, which is the single place the version is decided.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --filter ${{ inputs.filter }}...

      - name: Lint
        if: inputs.lint
        run: pnpm --filter ${{ inputs.filter }} lint

      # Order is load-bearing, and was learned the hard way in this repository's
      # first workflow. A bare `tsc --noEmit` needs src/routeTree.gen.ts to exist:
      # main.tsx imports it, it is gitignored, and no postinstall generates it.
      # Nothing but a Vite run writes it -- @tanstack/router-plugin does, as a side
      # effect of both `vitest run` and `vite build`. On a clean checkout, which is
      # exactly what a runner has and a developer's machine never is, running the
      # standalone typecheck first fails every route file with TS2307.
      # pnpm forwards what follows the script name to the script, so `--shard=k/n`
      # reaches `vitest run` as is; nothing is appended when the caller did not shard.
      # Through `env`, so the value is data to the shell rather than text pasted into it.
      - name: Unit tests
        if: inputs.test
        env:
          SHARD: ${{ inputs.shard }}
        run: pnpm --filter ${{ inputs.filter }} test ${SHARD:+--shard=$SHARD}

      - name: Build
        if: inputs.build
        run: pnpm --filter ${{ inputs.filter }} build

      - name: Type check
        if: inputs.typecheck
        run: pnpm --filter ${{ inputs.filter }} exec tsc --noEmit
