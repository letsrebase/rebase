# The Python gate, once, for every project in the monorepo.
#
# This file exists so that adding a second Python project costs a dozen lines in
# ci.yml instead of a second copy of everything below. Everything project-specific
# arrives as an input; nothing in here names PigroCRM.
name: python gate

on:
  workflow_call:
    inputs:
      sources:
        description: space-separated source roots to type-check
        required: true
        type: string
      tests:
        description: space-separated test roots to run
        required: true
        type: string
      lint-path:
        description: directory ruff is pointed at
        required: true
        type: string
      pytest-args:
        description: extra pytest arguments, e.g. -m "not slow" on the PR path
        required: false
        default: ''
        type: string
      renderer:
        description: >-
          install Pandoc and Typst before running the tests. The document renderer
          shells out to both, and roughly thirty tests fail without them with
          "strumento di composizione non installato". Off by default because most
          projects will not need it.
        required: false
        default: false
        type: boolean
      job-name:
        description: >-
          Name of the inner job, which is half of the check name GitHub shows
          ("<caller> / <this>"). A caller that runs this gate twice, once for the fast
          tests and once for a slow subset, needs the two to be distinguishable.
        required: false
        default: lint · typecheck · test
        type: string
      lint:
        description: run ruff. Off for a second call that only adds tests.
        required: false
        default: true
        type: boolean
      typecheck:
        description: run mypy. Off for a second call that only adds tests.
        required: false
        default: true
        type: boolean
      test:
        description: >-
          run pytest. Off for a call that only lints and type-checks, so those two can
          be a job of their own beside test shards that do nothing else.
        required: false
        default: true
        type: boolean
      shard:
        description: >-
          `k/n`: run only the k-th of n slices of the test files under `tests`, so a
          caller can spread one suite over n jobs that run side by side. The sorted file
          list is sliced by position (every n-th file, offset k), so the slices are
          deterministic, disjoint and together the whole suite; nothing is balanced by
          duration. Empty runs every file in this one job. A shard whose every test is
          deselected by a marker in `pytest-args` exits 5 and goes red, so shard a job
          only when each slice is sure to keep some tests.
        required: false
        default: ''
        type: string

jobs:
  gate:
    name: ${{ inputs.job-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The renderer pair, pinned once for the download and the install below: the same
    # pair projects/pigrocrm/Dockerfile.api installs and that the renderer was verified
    # against. Typst's diagnostic format and the auto-typography workaround were both
    # confirmed against 0.14.2 specifically, so a runner on some other version proves
    # less than nothing.
    env:
      PANDOC_VERSION: 3.8.2.1
      TYPST_VERSION: 0.14.2
    steps:
      - uses: actions/checkout@v7

      # The test database image, pulled while the toolchain installs (REB-585). On a
      # fresh runner nothing has pulled it before the Test step, so the four xdist
      # workers all wait on the same first pull, 5 to 8s at the top of every worker's
      # setup in the `--durations` table, while the network has room to spare through
      # `uv sync` and the renderer install. Backgrounded and detached from the step's
      # output, so the step ends at once and the pull runs beside what follows; a worker
      # that arrives before it is done starts its own pull and the daemon shares the
      # layers in flight, and one that finds it failed pulls as before, so a failure
      # here costs nothing and never reds the job. The database image is read from the
      # root `conftest.py`, which is what starts it; the reaper is testcontainers' own,
      # started once per worker before the database (`testcontainers/core/config.py`),
      # and its tag moves with the package in `uv.lock`.
      # Each pull writes its outcome to a log the step before the tests prints, so a
      # failed warm-up is a warning in the job log rather than a silent return of the
      # setup delay; the job never fails on it.
      - name: Pull the test images in the background
        if: inputs.test
        run: |
          database=$(grep -oE '^_IMAGE = "[^"]+"' conftest.py | cut -d'"' -f2)
          log="$RUNNER_TEMP/image-pull.log"
          for image in "${database}" testcontainers/ryuk:0.8.1; do
            { docker pull -q "${image}" > /dev/null 2>&1 && echo "pulled ${image}" \
              || echo "FAILED to pull ${image}"; } >> "${log}" 2>&1 &
          done

      # The renderer's two binaries and poppler, fetched while the toolchain installs
      # (REB-589), the same shape as the image pulls above: 13s of downloads that used
      # to sit in a step of their own in front of the tests now overlap `uv sync` and
      # the shard selection. Unlike a pull, this one is needed: the install step below
      # waits for the `done` marker and reads the log if it never comes, so a failed
      # download fails the job there, with its reason, rather than at the first test
      # that shells out to nothing. poppler is installed from the image's own package
      # lists first, since `apt-get update` was most of the 13s and the lists on a
      # hosted image are days old at most; a stale index fails that install, and only
      # then is the update paid. Measured on the first run of REB-589: the install step
      # still waited 7 to 14s for the marker, which is the update, not the fetches.
      - name: Download the document renderer in the background
        if: inputs.renderer && inputs.test
        run: |
          dir="$RUNNER_TEMP/renderer"
          mkdir -p "${dir}"
          {
            curl -fsSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" | tar -xz -C "${dir}" \
            && curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ -C "${dir}" \
            && { sudo apt-get install -y -qq --no-install-recommends poppler-utils \
                 || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils; }; } \
            && touch "${dir}/done"
          } > "${dir}/log" 2>&1 &

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.24'
          enable-cache: true

      # `--locked`, not `--frozen`: both install exactly what uv.lock says, but only
      # `--locked` first checks that uv.lock still answers the pins in every
      # pyproject.toml. Under `--frozen` a pin changed without a relock installs the
      # old version and goes green, which is what a grouped Dependabot uv update can
      # produce (dependabot-core#15786) and what a hand edit can too.
      - run: uv sync --locked

      # Cheapest first, on purpose: lint and format are the checks most likely to
      # fail, and the cheapest to have failed. A retry is a whole round trip.
      - name: Lint
        if: inputs.lint
        run: uv run ruff check ${{ inputs.lint-path }} && uv run ruff format --check ${{ inputs.lint-path }}

      - name: Type check
        if: inputs.typecheck
        run: uv run mypy ${{ inputs.sources }}

      # Whole files, never single tests, so `--dist loadfile` and the module-scoped
      # fixtures behind it hold inside a shard exactly as they do in a full run. The
      # list is printed so a red shard's log says what it selected without a second
      # run. Slicing by position rather than by a recorded duration keeps this a shell
      # line with no plugin, no durations file to refresh and no cache to miss; the
      # cost is that a shard can be heavier than its siblings by whatever the biggest
      # files weigh: roughly the difference between one n-th of the suite and somewhat
      # more, never the difference between n jobs and one.
      - name: Select this shard's files
        id: shard
        if: inputs.shard != '' && inputs.test
        env:
          SHARD: ${{ inputs.shard }}
          ROOTS: ${{ inputs.tests }}
        run: |
          set -euo pipefail
          k=${SHARD%/*}; n=${SHARD#*/}
          # `5/4` would silently rerun shard 1 and `0/4` shard 4, and a bare `4` parses
          # as k=n=4: each a green run that skipped a slice of the suite.
          if ! [[ "$SHARD" =~ ^[1-9][0-9]*/[1-9][0-9]*$ ]] || [ "$k" -gt "$n" ]; then
            echo "::error::shard must be k/n with 1 <= k <= n, got '${SHARD}'"
            exit 1
          fi
          # `LC_ALL=C`, so the order (and so the slices) is the same on every machine:
          # under en_US `test_cli.py` and `test_cli_digest.py` swap places, and a shard
          # reproduced on a devbox would not hold the file that failed on the runner.
          # ROOTS is a space-separated list on purpose, the same one `Test` expands.
          # shellcheck disable=SC2086
          # Both of pytest's default module patterns, since nothing sets `python_files`:
          # a `foo_test.py` would otherwise run in the full lane and in no shard.
          files=$(find $ROOTS \( -name 'test_*.py' -o -name '*_test.py' \) | LC_ALL=C sort | awk -v n="$n" -v k="$k" 'NR % n == k % n')
          if [ -z "$files" ]; then
            echo "::error::shard ${SHARD} selected no file under ${ROOTS}"
            exit 1
          fi
          echo "shard ${SHARD}: $(echo "$files" | wc -l) files"
          echo "$files"
          # One path per line, in a file, and only the file's path as the output: the
          # names come from the tree under test, so they are data for the next step to
          # read, never text an expression pastes into a shell line.
          printf '%s\n' "$files" > "$RUNNER_TEMP/pytest-shard-files"
          echo "files-path=$RUNNER_TEMP/pytest-shard-files" >> "$GITHUB_OUTPUT"

      - name: Say how the background pulls went
        if: inputs.test
        run: |
          log="$RUNNER_TEMP/image-pull.log"
          if [ -s "${log}" ]; then cat "${log}"; else echo "the pulls have not finished yet"; fi
          if grep -q FAILED "${log}" 2>/dev/null; then
            echo "::warning::a background image pull failed; the workers pull at test time instead"
          fi

      - name: Install the document renderer
        if: inputs.renderer && inputs.test
        # Waits for the download the step after the checkout started (REB-589), last
      # before the tests so the shard selection above overlaps it too.
        # poppler-utils is not in that image and belongs only here: `pdftotext` is how
        # the suite reads a rendered PDF back to assert on its text, so it is test
        # equipment rather than part of the product. Distribution version is fine --
        # nothing is asserted about its output beyond the words the renderer put in.
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/renderer"
          # Up to ten minutes for the background download above, a quarter of the job's
          # own limit: on the runner it is done long before `uv sync` is, so this
          # normally reads the marker at once, and a slow mirror gets the time the old
          # foreground install would have taken anyway.
          for _ in $(seq 600); do
            [ -f "${dir}/done" ] && break
            sleep 1
          done
          if [ ! -f "${dir}/done" ]; then
            echo "::error::the renderer download did not finish; its log follows"
            cat "${dir}/log" 2>/dev/null || true
            exit 1
          fi
          sudo mv "${dir}/pandoc-${PANDOC_VERSION}/bin/pandoc" /usr/local/bin/pandoc
          sudo mv "${dir}/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst
          pandoc --version | head -1
          typst --version
          pdftotext -v 2>&1 | head -1

      - name: Test
        if: inputs.test
        # testcontainers starts PostgreSQL itself; no service container needed, and
        # under `-n` each worker starts its own, which is what makes the workers
        # independent rather than fighting over one database. With a `shard`, the
        # paths are that shard's files; without one, the roots the caller named.
        env:
          SHARD_FILES_PATH: ${{ steps.shard.outputs.files-path }}
          TEST_ROOTS: ${{ inputs.tests }}
        run: |
          set -euo pipefail
          if [ -n "$SHARD_FILES_PATH" ]; then
            mapfile -t paths < "$SHARD_FILES_PATH"
          else
            read -r -a paths <<< "$TEST_ROOTS"
          fi
          uv run pytest -q ${{ inputs.pytest-args }} "${paths[@]}"
