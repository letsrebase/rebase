# The Python gate, once, for every project in the monorepo.
#
# This file exists so that adding a second Python project costs a dozen lines in
# ci.yml instead of a second copy of everything below. Everything project-specific
# arrives as an input; nothing in here names PigroCRM.
name: python gate

on:
  workflow_call:
    inputs:
      sources:
        description: space-separated source roots to type-check
        required: true
        type: string
      tests:
        description: space-separated test roots to run
        required: true
        type: string
      lint-path:
        description: directory ruff is pointed at
        required: true
        type: string
      pytest-args:
        description: extra pytest arguments, e.g. -m "not slow" on the PR path
        required: false
        default: ''
        type: string
      renderer:
        description: >-
          install Pandoc and Typst before running the tests. The document renderer
          shells out to both, and roughly thirty tests fail without them with
          "strumento di composizione non installato". Off by default because most
          projects will not need it.
        required: false
        default: false
        type: boolean
      job-name:
        description: >-
          Name of the inner job, which is half of the check name GitHub shows
          ("<caller> / <this>"). A caller that runs this gate twice, once for the fast
          tests and once for a slow subset, needs the two to be distinguishable.
        required: false
        default: lint · typecheck · test
        type: string
      lint:
        description: run ruff. Off for a second call that only adds tests.
        required: false
        default: true
        type: boolean
      typecheck:
        description: run mypy. Off for a second call that only adds tests.
        required: false
        default: true
        type: boolean

jobs:
  gate:
    name: ${{ inputs.job-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.9.24'
          enable-cache: true

      # `--locked`, not `--frozen`: both install exactly what uv.lock says, but only
      # `--locked` first checks that uv.lock still answers the pins in every
      # pyproject.toml. Under `--frozen` a pin changed without a relock installs the
      # old version and goes green, which is what a grouped Dependabot uv update can
      # produce (dependabot-core#15786) and what a hand edit can too.
      - run: uv sync --locked

      # Cheapest first, on purpose: lint and format are the checks most likely to
      # fail, and the cheapest to have failed. A retry is a whole round trip.
      - name: Lint
        if: inputs.lint
        run: uv run ruff check ${{ inputs.lint-path }} && uv run ruff format --check ${{ inputs.lint-path }}

      - name: Type check
        if: inputs.typecheck
        run: uv run mypy ${{ inputs.sources }}

      - name: Install the document renderer
        if: inputs.renderer
        # Pinned to the same pair projects/pigrocrm/Dockerfile.api installs and that
        # the renderer was verified against. Typst's diagnostic format and the
        # auto-typography workaround were both confirmed against 0.14.2 specifically,
        # so a runner on some other version proves less than nothing.
        #
        # poppler-utils is not in that image and belongs only here: `pdftotext` is how
        # the suite reads a rendered PDF back to assert on its text, so it is test
        # equipment rather than part of the product. Distribution version is fine --
        # nothing is asserted about its output beyond the words the renderer put in.
        env:
          PANDOC_VERSION: 3.8.2.1
          TYPST_VERSION: 0.14.2
        run: |
          set -euo pipefail
          curl -fL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
          sudo mv "/tmp/pandoc-${PANDOC_VERSION}/bin/pandoc" /usr/local/bin/pandoc
          curl -fL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils
          pandoc --version | head -1
          typst --version
          pdftotext -v 2>&1 | head -1

      - name: Test
        # testcontainers starts PostgreSQL itself; no service container needed, and
        # under `-n` each worker starts its own, which is what makes the workers
        # independent rather than fighting over one database.
        run: uv run pytest -q ${{ inputs.pytest-args }} ${{ inputs.tests }}
