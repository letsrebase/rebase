# One deploy mechanism for every project in the monorepo that ships as a Docker
# Compose stack over ssh. A project does not write a deploy workflow: it writes a
# caller with two jobs, one per environment, and names its environment and its
# stack in the inputs below.
#
# Everything that differs between a preview and a production stack -- which host,
# which user, which directory, which key the host answers with -- is a **GitHub
# Environment secret**, not an input and not a repository secret with a longer name.
# That is the whole reason this file can stay one file:
#
#   * `DEPLOY_HOST`, `DEPLOY_USER`, `DEPLOY_PATH`, `DEPLOY_SSH_KEY` and
#     `DEPLOY_KNOWN_HOSTS` are read by name, always the same five names, and GitHub
#     resolves them from whichever environment the calling job named. Ten projects
#     with two environments each are fifty secrets with five names, not fifty names.
#   * `DEPLOY_SSH_KEY` authenticates the runner to the host; `DEPLOY_KNOWN_HOSTS`
#     authenticates the host to the runner. It is the host's `known_hosts` line, as
#     `ssh-keyscan -H -t ed25519 "$DEPLOY_HOST"` prints it, captured once by a person
#     who then checked the fingerprint on the host itself, and every ssh and rsync
#     below runs with `StrictHostKeyChecking=yes` against it. Until REB-653 this file
#     ran `ssh-keyscan` on every deploy and trusted whatever key answered, which is
#     trust on first use on a connection that also carries a secret into the host
#     `.env` (REB-650): anyone who could redirect the runner's connection got the
#     repository, the compose commands and that value. A key that does not match
#     fails the deploy now, and the fix for a host that really changed its key is a
#     new value for the secret, never a looser check (`docs/adding-a-project.md` § 7).
#   * The caller MUST pass `secrets: inherit`. A reusable workflow resolves an
#     environment's secrets only when the caller inherits: measured on this repository
#     before this file was written, a job with `environment:` and no `inherit` reads
#     every one of them as the empty string, silently, and the first thing that fails
#     is ssh with no host. The "Verify" step below therefore fails loudly instead.
#   * Environments also give the Deployments tab a real history per environment, and
#     the day this repository is on a paid plan they are where a required reviewer on
#     production goes, with no change to this file.
name: _deploy-compose

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment holding the five DEPLOY_* secrets.
        type: string
        required: true
      compose-dir:
        description: Directory of the compose file, relative to the deploy root.
        type: string
        required: true
      compose-project:
        description: Compose project name. Never let it default to the directory name.
        type: string
        required: true
      health-url:
        description: URL curled on the host until it answers 200, from inside the host.
        type: string
        required: true
      extra-health-url:
        description: >-
          A second URL curled the same way as health-url, alongside it, until it
          too answers 200: a stack with more than one service worth probing
          (REB-246) names it here instead of the reusable workflow growing a
          second required input every caller would have to supply. Empty by
          default, which is today's behaviour for every caller that omits it.
        type: string
        required: false
        default: ''
      url:
        description: Public URL, shown on the environment in the Actions UI.
        type: string
        required: false
        default: ''
      ref:
        description: >-
          Commit to deploy. A preview is triggered by CI finishing rather than by the
          push itself, and on a `workflow_run` event `github.sha` is the branch tip at
          the moment the event fired, which is a different commit as soon as anything
          else has landed. The caller passes the head commit of the run that went
          green; deploying anything else would ship a commit CI never verified.
        type: string
        required: false
        default: ''
      env-secrets:
        description: >-
          Newline-separated names of this environment's secrets to write into the
          host `.env` before the stack starts, one `NAME=value` line each. The host
          `.env` is never in the repository and never rsynced: it holds each
          environment's own non-secret config (ports, data directories, the public
          URL) plus whatever secrets were put there by hand at provisioning. A secret
          the compose file requires that nobody can add by hand, because nobody but
          the host's provisioner has SSH, is listed here instead and templated in from
          the Environment secret of the same name (REB-650). Every name listed must be
          set on the environment, or the deploy fails loudly. Empty by default, which
          is today's behaviour for every caller that omits it.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Verify the environment is configured
        # Five missing secrets produce five confusing failures further down (ssh to an
        # empty host, rsync to `@:`, `Host key verification failed` on an empty
        # known_hosts), and an inherited-secrets mistake produces all five at once.
        # Name them here instead.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=()
          [ -z "$DEPLOY_HOST" ] && missing+=(DEPLOY_HOST)
          [ -z "$DEPLOY_USER" ] && missing+=(DEPLOY_USER)
          [ -z "$DEPLOY_PATH" ] && missing+=(DEPLOY_PATH)
          [ -z "$DEPLOY_SSH_KEY" ] && missing+=(DEPLOY_SSH_KEY)
          [ -z "$DEPLOY_KNOWN_HOSTS" ] && missing+=(DEPLOY_KNOWN_HOSTS)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Environment %s is missing: %s. If all five are missing, the caller is not passing `secrets: inherit`. DEPLOY_KNOWN_HOSTS alone missing is the host key pin REB-653 added: docs/adding-a-project.md § 7 says how to capture it.\n' \
              "${{ inputs.environment }}" "${missing[*]}"
            exit 1
          fi

      - name: Refuse to deploy a commit CI has not passed
        # A deploy workflow is not a status check and nothing stops it from running on
        # a red commit, so it asks. A preview arrives here already knowing the answer,
        # since CI finishing green is what triggered it, and the loop then exits on its
        # first request. Until 2026-09-09 every preview reached this step while CI was
        # still running and slept through it on a metered runner: measured on one
        # preview, 458 of 514 billed seconds were this loop, against 51 seconds of
        # actual deploying.
        #
        # The run it asks for is the one of the ref being deployed, not any run for the
        # commit. The trunk tier is path-scoped, so the trunk's run for a commit that
        # touched only another project skips every job of this one and still concludes
        # success; a tag on that commit used to find that run and ship code CI had
        # never built (ORB-28). `ci.yml` runs on every `*-v*` tag with every job of
        # the project the tag names (REB-563), and a tag deploy waits for that run.
        # For a preview the ref is `main` and the run is the one that triggered it.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.ref || github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            run=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=10" \
              | jq -c --arg ref "$REF" '.workflow_runs | map(select(.head_branch == $ref)) | sort_by(.created_at) | last // empty')
            if [ -n "$run" ]; then
              status=$(printf '%s' "$run" | jq -r .status)
              conclusion=$(printf '%s' "$run" | jq -r .conclusion)
              url=$(printf '%s' "$run" | jq -r .html_url)
              echo "ci.yml for ${REF} at ${SHA}: status=${status} conclusion=${conclusion} (${url})"
              if [ "$status" = completed ]; then
                [ "$conclusion" = success ] && exit 0
                echo "::error::CI concluded ${conclusion} for ${REF} at ${SHA}. See ${url}. Refusing to deploy."
                exit 1
              fi
            fi
            sleep 30
          done
          echo "::error::No completed ci.yml run for ${REF} at ${SHA} after 30 minutes. Refusing to deploy an unverified commit."
          exit 1

      - name: Configure SSH
        # The host's key is pinned, never discovered: `known_hosts` is written from the
        # environment's own `DEPLOY_KNOWN_HOSTS`, and nothing else is ever appended to
        # it, so every ssh and rsync below, each with `StrictHostKeyChecking=yes` and
        # this file as its only `UserKnownHostsFile`, refuses a host whose key is not
        # the pinned one. Two checks before the first connection, each a clearer
        # failure than ssh's own `Host key verification failed`: `ssh-keygen -lf`
        # checks the value holds at least one key and prints each key's size,
        # fingerprint and type (the line a person compares with the host's own
        # `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub`; the hashed host field
        # between them is cut, since GitHub masks a secret whole and not a part of
        # one), and `ssh-keygen -F` checks the value names this DEPLOY_HOST, lowered
        # first because `-F` compares case-sensitively while `ssh-keyscan` and `ssh`
        # lower the name. A hashed `known_hosts` line matches only the exact
        # string it was scanned with: a line scanned on `pigro.letsrebase.com` does
        # not match the same host by IP or by another of its names (measured on
        # 2026-10-05, REB-653), so the secret has to be captured with the environment's
        # own `DEPLOY_HOST` value, and this is where a mismatch says so.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $1, $2, $NF}'; then
            echo "::error::DEPLOY_KNOWN_HOSTS on environment ${ENVIRONMENT} is not a known_hosts line: capture it with ssh-keyscan -H -t ed25519 <DEPLOY_HOST> (docs/adding-a-project.md § 7)."
            exit 1
          fi
          if ! ssh-keygen -F "${DEPLOY_HOST,,}" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::DEPLOY_KNOWN_HOSTS on environment ${ENVIRONMENT} holds no key for DEPLOY_HOST: a hashed line matches only the exact name or address it was scanned with, so scan the value DEPLOY_HOST holds, not another name of the same host."
            exit 1
          fi
          echo "host key pinned for environment ${ENVIRONMENT}; every connection below verifies against it"

      - name: Sync sources
        # The whole repository, not just the project: the uv and pnpm workspace roots
        # are at the top and both image builds use the repository root as their build
        # context. `.env` is excluded, so each environment's directory keeps its own,
        # and so are the data and var directories in case an installation put them
        # inside the checkout rather than outside it.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p \"${DEPLOY_PATH}\""
          rsync -az --delete \
            -e 'ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts' \
            --exclude '.git' --exclude '.github' \
            --exclude '.env' --exclude '.reference-*' \
            --exclude 'node_modules' --exclude 'dist' --exclude '.venv' \
            --exclude 'data' --exclude 'var' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"

      - name: Write managed secrets into the host .env
        # The host `.env` is hand-written and never rsynced (the step above excludes
        # it), so a secret the compose file requires had no way onto the host but a
        # person with SSH editing the file: `PIGROCRM_APP_PASSWORD`, required since
        # REB-634, failed every preview from the day it landed because nobody who runs
        # the board has SSH to the host. This writes each name the caller lists in
        # `env-secrets` into `${DEPLOY_PATH}/.env`, from the environment's own secret
        # of the same name, replacing that one line and leaving every other line the
        # file already holds untouched (REB-650).
        #
        # The values come from the inherited `secrets` context as one JSON blob, never
        # as a workflow input (an input is not masked in a log, a secret is). Each value
        # reaches the host base64-encoded on the ssh connection's stdin, which the remote
        # decodes: only the secret name and the env file path travel as arguments, the
        # way the DEPLOY_SSH_KEY above is written to a file rather than passed on a
        # command line, so the value never lands in a process list or a log. Single-line
        # secrets only, which is what a `.env` line can hold. A name listed but unset on
        # the environment is a loud failure: the deploy is here to guarantee the managed
        # secrets are present, not to skip a missing one.
        if: inputs.env-secrets != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ENVIRONMENT: ${{ inputs.environment }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
          WANT: ${{ inputs.env-secrets }}
        run: |
          set -euo pipefail
          # Runs on the host with NAME and ENVFILE in its environment and the value's
          # base64 on stdin. No secret is in this string, so it is safe as an argument.
          # grep's exit 1 is "no line matched" (the first write of this key, or an empty
          # file) and is expected; its exit 2 is a real read error, which must abort and
          # leave the file alone rather than be swallowed into an empty temp that then
          # replaces the whole hand-written .env.
          remote='
            set -euo pipefail
            umask 077
            touch "$ENVFILE"
            value=$(base64 -d)
            tmp=$(mktemp "${ENVFILE}.XXXXXX")
            trap "rm -f \"$tmp\"" EXIT
            rc=0
            grep -v -E "^${NAME}=" "$ENVFILE" > "$tmp" || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "cannot read ${ENVFILE} (grep rc=${rc}); leaving it untouched" >&2
              exit 1
            fi
            printf "%s=%s\n" "$NAME" "$value" >> "$tmp"
            chmod 600 "$tmp"
            mv "$tmp" "$ENVFILE"
            trap - EXIT
            echo "seeded ${NAME} into ${ENVFILE}"'
          while IFS= read -r name; do
            name="${name#"${name%%[![:space:]]*}"}"
            name="${name%"${name##*[![:space:]]}"}"
            [ -z "$name" ] && continue
            # `jq -j` plus the trailing-`x` guard keep the value byte-exact: `jq -r`
            # appends a newline and `$(...)` then strips every trailing newline, which
            # would hide a secret that legitimately ends in one. Captured exactly, a
            # value with any newline (trailing or internal) is rejected rather than
            # written: a `.env` line holds one line, so a multi-line secret does not
            # belong here, and silently dropping a trailing newline would change the
            # secret without saying so.
            value=$(printf '%s' "$SECRETS_JSON" | jq -j --arg k "$name" '.[$k] // ""'; printf x)
            value=${value%x}
            if [ -z "$value" ]; then
              echo "::error::Environment ${ENVIRONMENT} has no value for ${name}, listed in env-secrets."
              exit 1
            fi
            if [ "$value" != "${value%%$'\n'*}" ]; then
              echo "::error::Secret ${name} contains a newline; env-secrets holds single-line values only."
              exit 1
            fi
            printf '%s' "$value" | base64 | tr -d '\n' \
              | ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
                  "${DEPLOY_USER}@${DEPLOY_HOST}" \
                  "NAME='${name}' ENVFILE='${DEPLOY_PATH}/.env' bash -c '${remote}'"
          done <<< "$WANT"

      - name: Build and start the stack
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          COMPOSE_DIR: ${{ inputs.compose-dir }}
          COMPOSE_PROJECT: ${{ inputs.compose-project }}
        run: |
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' COMPOSE_DIR='${COMPOSE_DIR}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' bash -s" <<'SSH'
            set -euo pipefail
            cd "${DEPLOY_PATH}/${COMPOSE_DIR}"
            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "::error::Docker Compose is not installed on this host."
              exit 1
            fi
            # Two things that must never be left to a default. The env file: compose
            # reads `.env` from the directory of its own file, which in this monorepo
            # is two levels below the deploy root where the environment's `.env`
            # lives. The project name: compose otherwise derives it from the directory
            # name, so moving a project in the repository would silently orphan a
            # running stack and build a second one beside it.
            #
            # `build --pull` first: without it the host builds on whatever copy of
            # each base image (the nginx, Node and Python bases) it cached the first
            # time, and the security fixes Docker Hub rebuilds under the same tag
            # never reach a deployed image (REB-462). If a registry does not answer,
            # `set -e` stops here and the running containers are left as they are.
            # `up -d` then recreates only the services whose image changed.
            $COMPOSE -p "${COMPOSE_PROJECT}" --env-file "${DEPLOY_PATH}/.env" build --pull
            $COMPOSE -p "${COMPOSE_PROJECT}" --env-file "${DEPLOY_PATH}/.env" up -d
          SSH

      - name: Check the deployed code answers
        # A deploy that reports success without asking the server anything reports
        # success when the container failed to start. `docker compose ps` alone is not
        # enough either: it says the stack is up, not that every service in it is
        # running, so a crashed container that no health URL happens to reach still
        # reported success (REB-246). This step curls health-url, and extra-health-url
        # too when a caller sets it, then asserts every service compose knows about is
        # `running`, whatever either URL says.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          HEALTH_URL: ${{ inputs.health-url }}
          EXTRA_HEALTH_URL: ${{ inputs.extra-health-url }}
          COMPOSE_PROJECT: ${{ inputs.compose-project }}
        run: |
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "HEALTH_URL='${HEALTH_URL}' EXTRA_HEALTH_URL='${EXTRA_HEALTH_URL}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' bash -s" <<'SSH'
            set -uo pipefail
            for attempt in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "${HEALTH_URL}" || true)
              extra_code=200
              if [ -n "${EXTRA_HEALTH_URL}" ]; then
                extra_code=$(curl -s -o /dev/null -w '%{http_code}' "${EXTRA_HEALTH_URL}" || true)
              fi
              if [ "$code" = 200 ] && [ "$extra_code" = 200 ]; then
                echo "${HEALTH_URL} -> 200"
                [ -n "${EXTRA_HEALTH_URL}" ] && echo "${EXTRA_HEALTH_URL} -> 200"
                docker compose -p "${COMPOSE_PROJECT}" ps -a --format 'table {{.Name}}\t{{.Status}}'
                # `-a`, or an exited container (started, died, stayed dead) is absent from
                # the list entirely rather than reported as not running (REB-246 review).
                # The oneoff filter excludes a `docker compose run` leftover, which `-a`
                # also surfaces and which is not part of the stack's own service set.
                # A Go template and a shell loop, not `jq`: the host has docker and
                # nothing else, and the first version of this step failed the
                # pigrocrm-v0.17.0 deploy after a successful rollout for that reason
                # (REB-264).
                states=$(docker compose -p "${COMPOSE_PROJECT}" ps -a --format '{{.Service}}\t{{.State}}\t{{.Labels}}') || {
                  echo "::error::Could not read container states for ${COMPOSE_PROJECT}."
                  exit 1
                }
                if [ -z "${states}" ]; then
                  echo "::error::Compose knows no containers for ${COMPOSE_PROJECT}: the stack is not running under that project name."
                  exit 1
                fi
                not_running=""
                not_running_services=""
                while IFS="$(printf '\t')" read -r service state labels; do
                  [ -z "${service}" ] && continue
                  case "${labels}" in *com.docker.compose.oneoff=True*) continue ;; esac
                  if [ "${state}" != "running" ]; then
                    not_running="${not_running}${not_running:+, }${service}: ${state}"
                    not_running_services="${not_running_services} ${service}"
                  fi
                done < <(printf '%s\n' "${states}")
                if [ -n "$not_running" ]; then
                  echo "::error::Service(s) not running for ${COMPOSE_PROJECT}: ${not_running}"
                  # Only the services that failed, never `documenso`: its lines can
                  # carry a `/sign/<token>` path, and this log is a public Actions log.
                  for service in ${not_running_services}; do
                    if [ "${service}" = documenso ]; then
                      echo "documenso's own logs are not dumped here; read them on the host with: docker compose -p ${COMPOSE_PROJECT} logs documenso"
                    else
                      docker compose -p "${COMPOSE_PROJECT}" logs --tail 50 "${service}"
                    fi
                  done
                  exit 1
                fi
                exit 0
              fi
              sleep 5
            done
            if [ -n "${EXTRA_HEALTH_URL}" ]; then
              echo "::error::${HEALTH_URL} (${code}) or ${EXTRA_HEALTH_URL} (${extra_code}) did not answer 200 within 150 seconds."
            else
              echo "::error::${HEALTH_URL} did not answer 200 within 150 seconds (last: ${code})."
            fi
            docker compose -p "${COMPOSE_PROJECT}" ps -a --format 'table {{.Name}}\t{{.Status}}' || true
            states=$(docker compose -p "${COMPOSE_PROJECT}" ps -a --format '{{.Service}}\t{{.State}}\t{{.Labels}}') || true
            all_services=""
            while IFS="$(printf '\t')" read -r service state labels; do
              [ -z "${service}" ] && continue
              case "${labels}" in *com.docker.compose.oneoff=True*) continue ;; esac
              all_services="${all_services} ${service}"
            done < <(printf '%s\n' "${states}")
            # Every service, running or not: the health URL itself is what failed here, so
            # a container that reports running can still be the one to blame. Never
            # `documenso`: its lines can carry a `/sign/<token>` path, and this log is a
            # public Actions log.
            for service in ${all_services}; do
              if [ "${service}" = documenso ]; then
                echo "documenso's own logs are not dumped here; read them on the host with: docker compose -p ${COMPOSE_PROJECT} logs documenso"
              else
                docker compose -p "${COMPOSE_PROJECT}" logs --tail 50 "${service}" || true
              fi
            done
            exit 1
          SSH

      - name: Record what is running
        # `docker compose ps` says a stack is up; it does not say which commit it is.
        # This file is what you read at 2am, and it is outside the rsync tree so a
        # `--delete` cannot take it away.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RECORD: |
            ref=${{ github.ref_name }}
            sha=${{ inputs.ref || github.sha }}
            run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            actor=${{ github.actor }}
            environment=${{ inputs.environment }}
        run: |
          printf '%s' "$RECORD" | ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cat > '${DEPLOY_PATH}.deployed' && date -u '+deployed_at=%Y-%m-%dT%H:%M:%SZ' >> '${DEPLOY_PATH}.deployed' && cat '${DEPLOY_PATH}.deployed'"
