# One deploy mechanism for every project in the monorepo that ships as a Docker
# Compose stack over ssh. A project does not write a deploy workflow: it writes a
# caller with two jobs, one per environment, and passes the four values below.
#
# Everything that differs between a preview and a production stack -- which host,
# which user, which directory -- is a **GitHub Environment secret**, not an input and
# not a repository secret with a longer name. That is the whole reason this file can
# stay one file:
#
#   * `DEPLOY_HOST`, `DEPLOY_USER`, `DEPLOY_PATH`, `DEPLOY_SSH_KEY` are read by name,
#     always the same four names, and GitHub resolves them from whichever environment
#     the calling job named. Ten projects with two environments each are forty secrets
#     with four names, not forty names.
#   * The caller MUST pass `secrets: inherit`. A reusable workflow resolves an
#     environment's secrets only when the caller inherits: measured on this repository
#     before this file was written, a job with `environment:` and no `inherit` reads
#     every one of them as the empty string, silently, and the first thing that fails
#     is ssh with no host. The "Verify" step below therefore fails loudly instead.
#   * Environments also give the Deployments tab a real history per environment, and
#     the day this repository is on a paid plan they are where a required reviewer on
#     production goes, with no change to this file.
name: _deploy-compose

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment holding the four DEPLOY_* secrets.
        type: string
        required: true
      compose-dir:
        description: Directory of the compose file, relative to the deploy root.
        type: string
        required: true
      compose-project:
        description: Compose project name. Never let it default to the directory name.
        type: string
        required: true
      health-url:
        description: URL curled on the host until it answers 200, from inside the host.
        type: string
        required: true
      extra-health-url:
        description: >-
          A second URL curled the same way as health-url, alongside it, until it
          too answers 200: a stack with more than one service worth probing
          (REB-246) names it here instead of the reusable workflow growing a
          second required input every caller would have to supply. Empty by
          default, which is today's behaviour for every caller that omits it.
        type: string
        required: false
        default: ''
      url:
        description: Public URL, shown on the environment in the Actions UI.
        type: string
        required: false
        default: ''
      ref:
        description: >-
          Commit to deploy. A preview is triggered by CI finishing rather than by the
          push itself, and on a `workflow_run` event `github.sha` is the branch tip at
          the moment the event fired, which is a different commit as soon as anything
          else has landed. The caller passes the head commit of the run that went
          green; deploying anything else would ship a commit CI never verified.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Verify the environment is configured
        # Four missing secrets produce four confusing failures further down (ssh to an
        # empty host, rsync to `@:`), and an inherited-secrets mistake produces all
        # four at once. Name them here instead.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=()
          [ -z "$DEPLOY_HOST" ] && missing+=(DEPLOY_HOST)
          [ -z "$DEPLOY_USER" ] && missing+=(DEPLOY_USER)
          [ -z "$DEPLOY_PATH" ] && missing+=(DEPLOY_PATH)
          [ -z "$DEPLOY_SSH_KEY" ] && missing+=(DEPLOY_SSH_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Environment %s is missing: %s. If all four are missing, the caller is not passing `secrets: inherit`.\n' \
              "${{ inputs.environment }}" "${missing[*]}"
            exit 1
          fi

      - name: Refuse to deploy a commit CI has not passed
        # A deploy workflow is not a status check and nothing stops it from running on
        # a red commit, so it asks. A preview arrives here already knowing the answer,
        # since CI finishing green is what triggered it, and the loop then exits on its
        # first request. Until 2026-09-09 every preview reached this step while CI was
        # still running and slept through it on a metered runner: measured on one
        # preview, 458 of 514 billed seconds were this loop, against 51 seconds of
        # actual deploying.
        #
        # The run it asks for is the one of the ref being deployed, not any run for the
        # commit. The trunk tier is path-scoped, so the trunk's run for a commit that
        # touched only another project skips every job of this one and still concludes
        # success; a tag on that commit used to find that run and ship code CI had
        # never built (ORB-28). `ci.yml` runs on every `*-v*` tag with every job, and a
        # tag deploy waits for that run. For a preview the ref is `main` and the run is
        # the one that triggered it.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.ref || github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            run=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=10" \
              | jq -c --arg ref "$REF" '.workflow_runs | map(select(.head_branch == $ref)) | sort_by(.created_at) | last // empty')
            if [ -n "$run" ]; then
              status=$(printf '%s' "$run" | jq -r .status)
              conclusion=$(printf '%s' "$run" | jq -r .conclusion)
              url=$(printf '%s' "$run" | jq -r .html_url)
              echo "ci.yml for ${REF} at ${SHA}: status=${status} conclusion=${conclusion} (${url})"
              if [ "$status" = completed ]; then
                [ "$conclusion" = success ] && exit 0
                echo "::error::CI concluded ${conclusion} for ${REF} at ${SHA}. See ${url}. Refusing to deploy."
                exit 1
              fi
            fi
            sleep 30
          done
          echo "::error::No completed ci.yml run for ${REF} at ${SHA} after 30 minutes. Refusing to deploy an unverified commit."
          exit 1

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync sources
        # The whole repository, not just the project: the uv and pnpm workspace roots
        # are at the top and both image builds use the repository root as their build
        # context. `.env` is excluded, so each environment's directory keeps its own,
        # and so are the data and var directories in case an installation put them
        # inside the checkout rather than outside it.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p \"${DEPLOY_PATH}\""
          rsync -az --delete \
            --exclude '.git' --exclude '.github' \
            --exclude '.env' --exclude '.reference-*' \
            --exclude 'node_modules' --exclude 'dist' --exclude '.venv' \
            --exclude 'data' --exclude 'var' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"

      - name: Build and start the stack
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          COMPOSE_DIR: ${{ inputs.compose-dir }}
          COMPOSE_PROJECT: ${{ inputs.compose-project }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' COMPOSE_DIR='${COMPOSE_DIR}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' bash -s" <<'SSH'
            set -euo pipefail
            cd "${DEPLOY_PATH}/${COMPOSE_DIR}"
            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "::error::Docker Compose is not installed on this host."
              exit 1
            fi
            # Two things that must never be left to a default. The env file: compose
            # reads `.env` from the directory of its own file, which in this monorepo
            # is two levels below the deploy root where the environment's `.env`
            # lives. The project name: compose otherwise derives it from the directory
            # name, so moving a project in the repository would silently orphan a
            # running stack and build a second one beside it.
            #
            # `build --pull` first: without it the host builds on whatever copy of
            # each base image (the nginx, Node and Python bases) it cached the first
            # time, and the security fixes Docker Hub rebuilds under the same tag
            # never reach a deployed image (REB-462). If a registry does not answer,
            # `set -e` stops here and the running containers are left as they are.
            # `up -d` then recreates only the services whose image changed.
            $COMPOSE -p "${COMPOSE_PROJECT}" --env-file "${DEPLOY_PATH}/.env" build --pull
            $COMPOSE -p "${COMPOSE_PROJECT}" --env-file "${DEPLOY_PATH}/.env" up -d
          SSH

      - name: Check the deployed code answers
        # A deploy that reports success without asking the server anything reports
        # success when the container failed to start. `docker compose ps` alone is not
        # enough either: it says the stack is up, not that every service in it is
        # running, so a crashed container that no health URL happens to reach still
        # reported success (REB-246). This step curls health-url, and extra-health-url
        # too when a caller sets it, then asserts every service compose knows about is
        # `running`, whatever either URL says.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          HEALTH_URL: ${{ inputs.health-url }}
          EXTRA_HEALTH_URL: ${{ inputs.extra-health-url }}
          COMPOSE_PROJECT: ${{ inputs.compose-project }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "HEALTH_URL='${HEALTH_URL}' EXTRA_HEALTH_URL='${EXTRA_HEALTH_URL}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' bash -s" <<'SSH'
            set -uo pipefail
            for attempt in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "${HEALTH_URL}" || true)
              extra_code=200
              if [ -n "${EXTRA_HEALTH_URL}" ]; then
                extra_code=$(curl -s -o /dev/null -w '%{http_code}' "${EXTRA_HEALTH_URL}" || true)
              fi
              if [ "$code" = 200 ] && [ "$extra_code" = 200 ]; then
                echo "${HEALTH_URL} -> 200"
                [ -n "${EXTRA_HEALTH_URL}" ] && echo "${EXTRA_HEALTH_URL} -> 200"
                docker compose -p "${COMPOSE_PROJECT}" ps -a --format 'table {{.Name}}\t{{.Status}}'
                # `-a`, or an exited container (started, died, stayed dead) is absent from
                # the list entirely rather than reported as not running (REB-246 review).
                # The oneoff filter excludes a `docker compose run` leftover, which `-a`
                # also surfaces and which is not part of the stack's own service set.
                # A Go template and a shell loop, not `jq`: the host has docker and
                # nothing else, and the first version of this step failed the
                # pigrocrm-v0.17.0 deploy after a successful rollout for that reason
                # (REB-264).
                states=$(docker compose -p "${COMPOSE_PROJECT}" ps -a --format '{{.Service}}\t{{.State}}\t{{.Labels}}') || {
                  echo "::error::Could not read container states for ${COMPOSE_PROJECT}."
                  exit 1
                }
                if [ -z "${states}" ]; then
                  echo "::error::Compose knows no containers for ${COMPOSE_PROJECT}: the stack is not running under that project name."
                  exit 1
                fi
                not_running=""
                not_running_services=""
                while IFS="$(printf '\t')" read -r service state labels; do
                  [ -z "${service}" ] && continue
                  case "${labels}" in *com.docker.compose.oneoff=True*) continue ;; esac
                  if [ "${state}" != "running" ]; then
                    not_running="${not_running}${not_running:+, }${service}: ${state}"
                    not_running_services="${not_running_services} ${service}"
                  fi
                done < <(printf '%s\n' "${states}")
                if [ -n "$not_running" ]; then
                  echo "::error::Service(s) not running for ${COMPOSE_PROJECT}: ${not_running}"
                  # Only the services that failed, never `documenso`: its lines can
                  # carry a `/sign/<token>` path, and this log is a public Actions log.
                  for service in ${not_running_services}; do
                    if [ "${service}" = documenso ]; then
                      echo "documenso's own logs are not dumped here; read them on the host with: docker compose -p ${COMPOSE_PROJECT} logs documenso"
                    else
                      docker compose -p "${COMPOSE_PROJECT}" logs --tail 50 "${service}"
                    fi
                  done
                  exit 1
                fi
                exit 0
              fi
              sleep 5
            done
            if [ -n "${EXTRA_HEALTH_URL}" ]; then
              echo "::error::${HEALTH_URL} (${code}) or ${EXTRA_HEALTH_URL} (${extra_code}) did not answer 200 within 150 seconds."
            else
              echo "::error::${HEALTH_URL} did not answer 200 within 150 seconds (last: ${code})."
            fi
            docker compose -p "${COMPOSE_PROJECT}" ps -a --format 'table {{.Name}}\t{{.Status}}' || true
            states=$(docker compose -p "${COMPOSE_PROJECT}" ps -a --format '{{.Service}}\t{{.State}}\t{{.Labels}}') || true
            all_services=""
            while IFS="$(printf '\t')" read -r service state labels; do
              [ -z "${service}" ] && continue
              case "${labels}" in *com.docker.compose.oneoff=True*) continue ;; esac
              all_services="${all_services} ${service}"
            done < <(printf '%s\n' "${states}")
            # Every service, running or not: the health URL itself is what failed here, so
            # a container that reports running can still be the one to blame. Never
            # `documenso`: its lines can carry a `/sign/<token>` path, and this log is a
            # public Actions log.
            for service in ${all_services}; do
              if [ "${service}" = documenso ]; then
                echo "documenso's own logs are not dumped here; read them on the host with: docker compose -p ${COMPOSE_PROJECT} logs documenso"
              else
                docker compose -p "${COMPOSE_PROJECT}" logs --tail 50 "${service}" || true
              fi
            done
            exit 1
          SSH

      - name: Record what is running
        # `docker compose ps` says a stack is up; it does not say which commit it is.
        # This file is what you read at 2am, and it is outside the rsync tree so a
        # `--delete` cannot take it away.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RECORD: |
            ref=${{ github.ref_name }}
            sha=${{ inputs.ref || github.sha }}
            run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            actor=${{ github.actor }}
            environment=${{ inputs.environment }}
        run: |
          printf '%s' "$RECORD" | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cat > '${DEPLOY_PATH}.deployed' && date -u '+deployed_at=%Y-%m-%dT%H:%M:%SZ' >> '${DEPLOY_PATH}.deployed' && cat '${DEPLOY_PATH}.deployed'"
