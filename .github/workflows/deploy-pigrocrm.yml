# Deploy, for PigroCRM only. One caller per project, named after it: projects in this
# monorepo ship on their own schedules and must never be able to deploy each other.
# The mechanism itself is in `_deploy-compose.yml`; this file is only the two rules
# that say when, and the four values that say where.
#
# **Preview when CI goes green on main, production on a version tag.** A tag is the
# only thing in this repository that means "this is a release": a push to main means
# the trunk moved, which is worth seeing on a real server and is not worth putting in
# front of the person who uses the CRM every day.
#
# The preview used to trigger on the push itself and then sit on a billed runner
# waiting for CI to finish, because it refuses to deploy an unverified commit.
# Measured on 2026-09-09: 458 of 514 billed seconds were that wait, against 51 seconds
# of deploying. Triggering on CI's completion buys the same guarantee for nothing, and
# `_deploy-compose.yml` still asks the API rather than trusting the trigger.
#
# Tags are project-scoped, `pigrocrm-v<semver>`, because a bare `v1.2.0` in a monorepo
# does not say which project it releases:
#
#     git tag pigrocrm-v0.4.0 && git push origin pigrocrm-v0.4.0
#
# The tag deploys the commit it points at, and `_deploy-compose.yml` refuses to deploy
# any commit whose `ci.yml` run is not green, so tagging a commit that main never built
# green fails the deploy rather than shipping it.
name: Deploy PigroCRM

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['pigrocrm-v*']

permissions:
  contents: read
  actions: read

jobs:
  # A push to main that touched only another project, or only the root README, must not
  # rebuild this stack: a rebuild on the target host is minutes of a single shared core.
  # The decision is not made here any more. `ci.yml`'s `changes` job already computed it
  # from the same paths that select the image build, and published it as an artifact;
  # this reads it. Before 2026-09-09 each deploy workflow carried its own hand-written
  # copy of those paths as a grep, and PigroCRM's had already lost `shared/brand`.
  scope:
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
    steps:
      # Fail open: a missing or unreadable verdict deploys. A preview that ran once too
      # often is cheap, and a preview silently stuck on an old commit is not.
      - uses: actions/download-artifact@v8
        id: verdict
        continue-on-error: true
        with:
          name: changed-paths
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - id: decide
        env:
          PROJECT: pigrocrm
        run: |
          set -euo pipefail
          if [ ! -f changed-paths.json ]; then
            echo "no verdict from CI run ${{ github.event.workflow_run.id }}; deploying rather than skipping"
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cat changed-paths.json
          all=$(jq -r '.all // ""' changed-paths.json)
          mine=$(jq -r --arg p "$PROJECT" '.[$p] // ""' changed-paths.json)
          if [ "$all" = true ] || [ "$mine" = true ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  preview:
    needs: scope
    if: |
      needs.scope.outputs.changed == 'true' &&
      vars.PIGROCRM_PREVIEW_ENABLED == 'true'
    # Preview supersedes itself: a newer commit on main makes an older, still queued
    # preview pointless. It has its own group, never shared with production, so a
    # preview can never cancel a release that is mid-flight.
    concurrency:
      group: deploy-pigrocrm-preview
      cancel-in-progress: true
    uses: ./.github/workflows/_deploy-compose.yml
    with:
      environment: pigrocrm-preview
      compose-dir: projects/pigrocrm
      compose-project: pigrocrm-preview
      # The commit CI verified, not the branch tip: on a workflow_run event those are
      # the same thing only until the next push lands.
      ref: ${{ github.event.workflow_run.head_sha }}
      # Deliberately not /api/tenants/root: that one answers from settings alone and
      # would report a healthy deploy with the database on the floor. This one reads
      # the registry, so it fails when Postgres does.
      health-url: http://127.0.0.1:8081/api/tenants/zzz-healthcheck/disponibile
      url: https://preview.pigro.letsrebase.com
    secrets: inherit

  production:
    if: |
      startsWith(github.ref, 'refs/tags/pigrocrm-v') &&
      vars.PIGROCRM_DEPLOY_ENABLED == 'true'
    # Releases queue, they never cancel each other, and they never share a group with
    # preview: GitHub keeps only the newest pending run per group, so a chatty preview
    # sharing this group would discard a queued release.
    concurrency:
      group: deploy-pigrocrm-production
      cancel-in-progress: false
    uses: ./.github/workflows/_deploy-compose.yml
    with:
      environment: pigrocrm-production
      compose-dir: projects/pigrocrm
      compose-project: pigrocrm
      health-url: http://127.0.0.1:8080/api/tenants/zzz-healthcheck/disponibile
      url: https://pigro.letsrebase.com
    secrets: inherit
