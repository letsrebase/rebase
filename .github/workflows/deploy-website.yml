# Deploy, for the website only. Same shape as `deploy-pigrocrm.yml` and deliberately
# a separate file: two projects in this monorepo must never be able to deploy each
# other, and a shared deploy workflow is how that happens by accident. The mechanism
# is `_deploy-compose.yml`; this file is the two rules that say when and the four
# values that say where.
#
# Preview when CI goes green on main, production on a version tag:
#
#     git tag website-v0.1.0 && git push origin website-v0.1.0
#
# The tag deploys the commit it points at, and `_deploy-compose.yml` refuses any
# commit whose `ci.yml` run is not green.
name: Deploy website

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['website-v*']

permissions:
  contents: read
  actions: read

jobs:
  # A push that touched only PigroCRM must not rebuild this stack. `ci.yml`'s `changes`
  # job decided that already, from the same paths that select the website image build,
  # and published it; this reads the answer instead of recomputing it from a second
  # copy of the list.
  scope:
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
    steps:
      # Fail open: a missing verdict deploys rather than skips.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: changed-paths
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - id: decide
        env:
          PROJECT: website
        run: |
          set -euo pipefail
          if [ ! -f changed-paths.json ]; then
            echo "no verdict from CI run ${{ github.event.workflow_run.id }}; deploying rather than skipping"
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cat changed-paths.json
          all=$(jq -r '.all // ""' changed-paths.json)
          mine=$(jq -r --arg p "$PROJECT" '.[$p] // ""' changed-paths.json)
          if [ "$all" = true ] || [ "$mine" = true ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  preview:
    needs: scope
    if: |
      needs.scope.outputs.changed == 'true' &&
      vars.WEBSITE_PREVIEW_ENABLED == 'true'
    concurrency:
      group: deploy-website-preview
      cancel-in-progress: true
    uses: ./.github/workflows/_deploy-compose.yml
    with:
      environment: website-preview
      compose-dir: projects/website
      compose-project: website-preview
      ref: ${{ github.event.workflow_run.head_sha }}
      # The community page itself, not a static file nobody looks at: this is the one
      # request that proves the container started, nginx parsed its config and the
      # build produced the page map the config expects.
      health-url: http://127.0.0.1:8083/
      url: https://preview.letsrebase.com
    secrets: inherit

  production:
    if: |
      startsWith(github.ref, 'refs/tags/website-v') &&
      vars.WEBSITE_DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy-website-production
      cancel-in-progress: false
    uses: ./.github/workflows/_deploy-compose.yml
    with:
      environment: website-production
      compose-dir: projects/website
      compose-project: website
      health-url: http://127.0.0.1:8082/
      url: https://letsrebase.com
    secrets: inherit
