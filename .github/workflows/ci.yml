# Three tiers, and the reason for each one.
#
#   1. Local, before the PR exists: `.github/preflight.json`. Everything expensive --
#      the full Python suite, the Playwright run, the images. Free and parallel, and
#      the answer arrives before the push rather than minutes after it.
#   2. `pull_request`: one cheap gate per project, scoped to what the diff can break.
#   3. `push` to main: the heavy tier -- the corpus, the images -- but scoped to the
#      same filters. Scoping started 2026-09-09 because the repository was private and
#      every minute here was billed (1,564 of a 2,000/month allowance in eight days,
#      and a job that hits that limit dies in two seconds with no log, which reads as
#      a broken workflow rather than as an empty wallet). The repository went public
#      2026-09-10 and hosted minutes are free now, but the scoping stays: a
#      fifteen-minute trunk run on a docs commit is still a cost, just in waiting
#      rather than in money (`docs/design/DECISIONS.md`, 2026-09-10). A push that
#      cannot reach a project does not pay for that project's suite, and each
#      deploy's own `scope` job already decides the same way from the same paths.
#      When the base commit of a push is unreachable -- a force push, a new branch --
#      the filters are not consulted and everything runs. A release tag
#      (`<project>-v<semver>`) is a push too, with no base to diff against; its
#      prefix names the project, and the run is every job of that project plus the
#      shared packages it uses, nothing else (REB-563). A production deploy is gated
#      on the run of the tag itself, because the trunk's run for the same commit may
#      have skipped every job of the project being released and still concluded
#      success (ORB-28); the tag's run cannot, since it never skips that project. A
#      nightly `schedule` run on `main` earns the full run, for a different reason:
#      it buys back "the trunk proves the whole tree" without putting it on the
#      critical path of a
#      merge. It needs no new code to get there -- a `schedule` event carries no
#      `before` at all, so it falls into the same "no usable base commit" branch a
#      force push already takes below, rather than a fourth branch written for it.
#
# A check that stops running on a PR must appear in preflight.json. Verification did
# not get cheaper here, it moved; a heavy check in neither tier is a hole.
#
# Adding a project means adding one filter to `changes` and one or two jobs below
# that call the shared gates. It must not mean another workflow file.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Every project's release tag. `_deploy-compose.yml` gates a production deploy on
    # the CI run of the tag itself; this is what gives the tag one. `deploy-*.yml`'s
    # `workflow_run` triggers filter on `branches: [main]`, and a tag run's head branch
    # is the tag, so this run never starts a preview.
    tags: ['*-v*']
  # Nightly, at a quarter past three UTC rather than on the hour, when every other
  # scheduled workflow on the platform also wakes up and queues behind the runner
  # fleet. `schedule` only ever runs the workflow version committed to the default
  # branch, so this always builds `main`, and it always gets `all=true` below (a
  # `schedule` event carries no `before` at all). It cannot start a deploy: that
  # guard lives in `deploy-*.yml`, not here, since their `scope` job requires
  # `github.event.workflow_run.event == 'push'`, which a scheduled run's own
  # `github.event_name` of `schedule` never satisfies.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# Cancelling is right on a PR and wrong on the trunk, and the difference is not
# taste. Every push to `main` is a candidate for deployment: `deploy-*.yml` refuses a
# commit whose CI did not pass, and a cancelled run is not a pass. Observed on
# 2026-09-09 (runs 34340411493, 34340433286, 34340694267): three pushes landed inside
# four minutes, the account's concurrent-job ceiling put the first one's jobs in a
# queue, and when it finally started six minutes later it cancelled the two newer
# runs -- including the tip. The tip then had no verdict and could not deploy, which
# is the same shape as a red trunk and harder to read. Grouping by commit on push
# gives every trunk commit its own run and its own answer; a PR still keeps one.
#
# The ref is in the group as well as the commit, because a release tag is a push at a
# commit the trunk has usually already built. A pending run is cancelled when another
# run joins its group, so with the commit alone two tags pushed at one commit (two
# projects released together) would cancel each other's run, and each deploy gates on
# its own tag's run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Runs on both events, and answers differently on each. On a pull_request
  # dorny/paths-filter reads the diff from the API, so no checkout is needed and the
  # job costs seconds. On a push there is no such API view, so the repository is
  # checked out with its history and the base is the commit the push moved off.
  #
  # `all` is the escape hatch, and it fails open. A force push, a freshly created
  # branch, a base commit garbage-collected out of the remote, or a `schedule` run
  # (not a push at all, so there is no `before` to speak of) all leave nothing to
  # diff against, and the honest answer to "what changed" is then "assume everything".
  #
  # The `permissions` block is repeated rather than widened at the top because a
  # job-level block REPLACES the workflow-level one instead of merging: without
  # `contents: read` restated, every pull_request run fails with "Resource not
  # accessible by integration" and `ci` goes red with no test failure in it.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ steps.base.outputs.all }}
      pigrocrm_py: ${{ steps.tag.outputs.pigrocrm_py || steps.filter.outputs.pigrocrm_py }}
      pigrocrm_py_corpus: ${{ steps.tag.outputs.pigrocrm_py_corpus || steps.filter.outputs.pigrocrm_py_corpus }}
      pigrocrm_web: ${{ steps.tag.outputs.pigrocrm_web || steps.filter.outputs.pigrocrm_web }}
      pigrocrm_image: ${{ steps.tag.outputs.pigrocrm_image || steps.filter.outputs.pigrocrm_image }}
      website: ${{ steps.tag.outputs.website || steps.filter.outputs.website }}
      website_image: ${{ steps.tag.outputs.website_image || steps.filter.outputs.website_image }}
      hub_py: ${{ steps.tag.outputs.hub_py || steps.filter.outputs.hub_py }}
      hub_web: ${{ steps.tag.outputs.hub_web || steps.filter.outputs.hub_web }}
      shared_analytics: ${{ steps.tag.outputs.shared_analytics || steps.filter.outputs.shared_analytics }}
      shared_ui: ${{ steps.tag.outputs.shared_ui || steps.filter.outputs.shared_ui }}
      hub_image: ${{ steps.tag.outputs.hub_image || steps.filter.outputs.hub_image }}
      pigrocrm_deploy: ${{ steps.tag.outputs.pigrocrm_deploy || steps.filter.outputs.pigrocrm_deploy }}
      website_deploy: ${{ steps.tag.outputs.website_deploy || steps.filter.outputs.website_deploy }}
      hub_deploy: ${{ steps.tag.outputs.hub_deploy || steps.filter.outputs.hub_deploy }}
      tooling: ${{ steps.tag.outputs.tooling || steps.filter.outputs.tooling }}
      # The `slow` files, for the corpus job's matrix below: read from the tree, so a
      # third file carrying the marker gets its own job the day it is committed
      # rather than running in preflight's lane alone (REB-565). A pull_request run
      # has no checkout here and never runs the corpus, so it answers an empty list.
      slow_files: ${{ steps.slow.outputs.files }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
        with:
          # The filter diffs locally on a push, and a shallow clone would make every
          # base commit unreachable and every run a full one.
          fetch-depth: 0

      - name: Is there a base commit to diff against
        id: base
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            echo 'all=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Unset on `schedule` too, same as on a force push or a freshly created
          # branch: none of the three is a push with a real "before" commit, so all
          # three fall into the `elif` below rather than needing a branch of their own.
          before='${{ github.event.before }}'
          if [[ "$REF" == refs/tags/* ]]; then
            # A new tag has no base anyway, so the filters have nothing to diff; the
            # prefix says which project is released and the `tag` step below turns
            # that into the same outputs the filters would have written.
            case "${REF#refs/tags/}" in
              website-v*)  project=website ;;
              hub-v*)      project=hub ;;
              pigrocrm-v*) project=pigrocrm ;;
              *)           project='' ;;
            esac
            if [ -n "$project" ]; then
              echo "A release tag of ${project}; running its jobs and the shared packages it uses."
              echo 'all=false' >> "$GITHUB_OUTPUT"
              echo "project=${project}" >> "$GITHUB_OUTPUT"
            else
              echo 'A tag that names no project; running every job.'
              echo 'all=true' >> "$GITHUB_OUTPUT"
            fi
          elif [ -z "$before" ] || [ "$before" = '0000000000000000000000000000000000000000' ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo 'No usable base commit; running every job.'
            echo 'all=true' >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi

      # A release tag names its project, and the run proves that project whole and
      # nothing else (REB-563). Before this, a tag earned `all=true`: `website-v0.21.0`
      # (run 36457557147) ran the CRM's suite for 355s in front of a website release
      # whose own jobs took 32s and 21s, and its production deploy waited 6′36″ for
      # that. The 2026-09-09 rule holds: `_deploy-compose.yml` still gates on the run
      # of the tag itself, and that run still runs every job of the released project,
      # plus the shared packages it depends on, whose own suites the project's gate
      # never runs (REB-253, REB-299). A tag whose prefix names no project keeps the
      # full run, fail-open like a missing base commit. Every key is written, `true`
      # or `false`, so the outputs above never fall through to a filter that did not
      # run; `'false'` is a non-empty string and wins the `||`.
      - name: Select the released project's jobs
        id: tag
        if: steps.base.outputs.project != ''
        env:
          PROJECT: ${{ steps.base.outputs.project }}
        run: |
          set -euo pipefail
          case "$PROJECT" in
            website)  on='website website_image website_deploy shared_analytics' ;;
            hub)      on='hub_py hub_web hub_image hub_deploy shared_ui shared_analytics' ;;
            pigrocrm) on='pigrocrm_py pigrocrm_py_corpus pigrocrm_web pigrocrm_image pigrocrm_deploy shared_ui shared_analytics' ;;
            *) echo "::error::no job list for project '${PROJECT}'"; exit 1 ;;
          esac
          for key in pigrocrm_py pigrocrm_py_corpus pigrocrm_web pigrocrm_image website website_image hub_py hub_web shared_analytics shared_ui hub_image pigrocrm_deploy website_deploy hub_deploy tooling; do
            case " $on " in *" $key "*) value=true ;; *) value=false ;; esac
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done
          echo "release of ${PROJECT}: ${on}"

      # Underscores, never dashes: `needs.changes.outputs.pigrocrm-web` is invalid
      # expression syntax and the run dies in seconds with no job started, which
      # reads as a broken workflow rather than as a typo.
      - uses: dorny/paths-filter@v4
        id: filter
        if: steps.base.outputs.all != 'true' && steps.base.outputs.project == ''
        with:
          # Empty on a pull_request, where the action asks the API instead.
          base: ${{ github.event_name == 'pull_request' && '' || github.event.before }}
          filters: |
            pigrocrm_py:
              - 'projects/pigrocrm/apps/api/**'
              - 'projects/pigrocrm/apps/mcp/**'
              - 'projects/pigrocrm/packages/**'
              - 'projects/pigrocrm/conftest.py'
              - 'projects/pigrocrm/ruff.toml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'ruff.toml'
              - '.python-version'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_python-gate.yml'
            # The `slow` files import `pigrocrm.core` and the local `corpus` helper
            # beside them and nothing else, so the corpus job below asks a narrower
            # question than the gate above it: an edit under apps/api or apps/mcp
            # cannot change which plan PostgreSQL picks over core's schema, and it
            # used to buy twelve minutes on the trunk, in front of every preview
            # deploy (ORB-141).
            pigrocrm_py_corpus:
              - 'projects/pigrocrm/packages/**'
              - 'projects/pigrocrm/conftest.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_python-gate.yml'
            pigrocrm_web:
              - 'projects/pigrocrm/apps/web/**'
              # The vhost `projects/pigrocrm/apps/web/src/test/robots.test.ts` reads
              # (REB-107): not under `apps/web/**` itself, so a change to just this
              # file would otherwise skip the test that guards it.
              - 'projects/pigrocrm/deploy/nginx/pigro.letsrebase.conf'
              - 'shared/brand/**'
              - 'shared/analytics/**'
              - 'shared/ui/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_node-gate.yml'
            website:
              - 'projects/website/**'
              - 'shared/brand/**'
              - 'shared/analytics/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_node-gate.yml'
            hub_py:
              - 'projects/hub/apps/api/**'
              - 'projects/hub/apps/mcp/**'
              - 'projects/hub/packages/**'
              - 'projects/hub/apps/web/src/lib/amount_cases.json'
              - 'projects/hub/conftest.py'
              - 'projects/hub/ruff.toml'
              # The guide PDF's own inputs (REB-310): `test_guide_pdf.py` under
              # `packages/core/tests` asserts the hash of every source recorded in
              # `tools/guide-pdf.lock.json`, and none of the lock's five sources nor
              # the lock file itself sit under the paths above unless listed here.
              # PR #197 changed `shared/brand/palette.css`, did not trigger this job,
              # and the stale lock reached main (fixed ad hoc in PR #199). `hub_web`
              # below already treats `shared/brand/**` this way for the web side.
              - 'projects/hub/content/**'
              - 'projects/hub/tools/**'
              - 'shared/brand/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'ruff.toml'
              - '.python-version'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_python-gate.yml'
            hub_web:
              - 'projects/hub/apps/web/**'
              - 'shared/brand/**'
              - 'shared/analytics/**'
              - 'shared/ui/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_node-gate.yml'
            # shared/analytics's own suite: no `_node-gate.yml` caller above installs
            # it as anything but a dependency of the SPA that imports it, which never
            # runs the dependency's own `lint`/`test`/`tsc` (REB-253).
            shared_analytics:
              - 'shared/analytics/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_node-gate.yml'
            # shared/ui's own suite, for the same reason as shared/analytics above: the
            # SPAs install it as a dependency and never run the dependency's own
            # lint/test/tsc, so the token contract would go unchecked on a change that
            # touches nothing else (REB-299).
            shared_ui:
              - 'shared/ui/**'
              - 'shared/brand/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_node-gate.yml'
            # Everything the two images copy in, which after the website split is
            # the whole of this project plus the root manifests the build context
            # carries. `projects/website/**` used to be here and is not a mistake
            # that was corrected: until 2026-09-09 the CRM's web image did build the
            # site, and now `website_image` below owns that.
            pigrocrm_image: &pigrocrm_image
              - 'projects/pigrocrm/**'
              - 'shared/brand/**'
              - 'shared/analytics/**'
              - 'shared/ui/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            website_image: &website_image
              - 'projects/website/**'
              - 'shared/brand/**'
              - 'shared/analytics/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            hub_image: &hub_image
              - 'projects/hub/**'
              - 'shared/brand/**'
              - 'shared/analytics/**'
              - 'shared/ui/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            # What a deploy rebuilds, which is what its image copies in plus the two
            # files that decide the deploy itself. The anchors are dorny/paths-filter's
            # own documented reuse mechanism, and they exist so that the deploy-side
            # list cannot drift from the image-side one: before 2026-09-09 each deploy
            # workflow carried its own hand-written copy of these paths as a grep, and
            # PigroCRM's had already lost `shared/brand`.
            pigrocrm_deploy:
              - *pigrocrm_image
              - '.github/workflows/deploy-pigrocrm.yml'
              - '.github/workflows/_deploy-compose.yml'
            website_deploy:
              - *website_image
              - '.github/workflows/deploy-website.yml'
              - '.github/workflows/_deploy-compose.yml'
            hub_deploy:
              - *hub_image
              - '.github/workflows/deploy-hub.yml'
              - '.github/workflows/_deploy-compose.yml'
            # The scaffolding script's own regression test (REB-422) and the weekly
            # Snyk report's (REB-525): both dependency-free on purpose, so they run with
            # node --test rather than through a project's own gate. The Snyk tests read
            # JSON fixtures, hence the whole directory.
            tooling:
              - 'tooling/client-repo-starter/*.mjs'
              - 'tooling/snyk-weekly/**'
              - '.github/workflows/ci.yml'

      # The deploy workflows used to answer "did this push touch my project?" for
      # themselves, each with its own copy of the paths above, and each by waiting on
      # a billed runner until this run finished. They are triggered by this run's
      # completion now, and they read the verdict from here. One computation, one
      # list, and a deploy that starts already knowing CI was green.
      - name: List the files behind the `slow` marker
        id: slow
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            echo 'files=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both of pytest's default module patterns, at any depth under the root, as
          # paths relative to it; `|| true` because a tree with no `slow` file is an
          # empty list for the corpus job to skip on, not a red `changes` that skips
          # every job of every project.
          files=$(find projects/pigrocrm/packages/core/tests -type f \
              \( -name 'test_*.py' -o -name '*_test.py' \) \
              -exec grep -lE 'pytest\.mark\.slow' {} + 2>/dev/null \
            | sed 's#^projects/pigrocrm/packages/core/tests/##' | LC_ALL=C sort \
            | jq -R . | jq -sc . || true)
          files=${files:-[]}
          echo "slow files: ${files}"
          echo "files=${files}" >> "$GITHUB_OUTPUT"

      - name: Publish the verdict for the deploy workflows
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          cat > changed-paths.json <<JSON
          {
            "all": "${{ steps.base.outputs.all }}",
            "pigrocrm": "${{ steps.tag.outputs.pigrocrm_deploy || steps.filter.outputs.pigrocrm_deploy }}",
            "website": "${{ steps.tag.outputs.website_deploy || steps.filter.outputs.website_deploy }}",
            "hub": "${{ steps.tag.outputs.hub_deploy || steps.filter.outputs.hub_deploy }}"
          }
          JSON
          cat changed-paths.json

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: changed-paths
          path: changed-paths.json
          # Read minutes after the run by the deploys and by nothing else.
          retention-days: 1

  # Two guards, and neither is decoration.
  #
  # `!cancelled() &&`: a job that `needs` a skipped or failed job is skipped too,
  # whatever its own `if` says, unless that `if` contains a status-check function.
  # `changes` runs on both events now, but if it ever fails this keeps the suite
  # running instead of reporting GREEN off a wholly skipped run, which is how this
  # shape fails silently and in the safe-looking direction.
  #
  # `outputs.all == 'true' ||`: the push had no base commit to diff against, so the
  # filters were never consulted and every job runs.
  #
  # Three shards, not one job (REB-561). Measured 2026-09-28 on run 36457557147: this
  # job took 355s, 315s of them the tests, and it was the critical path of that run
  # and of every run that selects it, a CRM pull request, a trunk push and every
  # release tag alike (p90 of the last thirty PR runs 354s; every run over 300s was
  # one with this job in it). The suite was already under `-n auto` on the runner's
  # four cores, so the next unit of parallelism is another runner: hosted larger
  # runners are billed even on a public repository and the self-hosted pool is closed
  # to this repository (`docs/ci-runner-pool.md`), while two more free jobs cost
  # nothing but their slots. Each shard is every third file of the sorted list
  # (`_python-gate.yml`'s `shard` input) with its own `-n auto` inside; lint and mypy
  # run once, in `pigrocrm-py-lint` below (REB-572). `ci` reads one aggregate result
  # for the matrix, so
  # the required check does not change, and `preflight.json`'s `pigrocrm-py-test`
  # lane still runs the whole suite in one lane. `fail-fast: false`, so a red shard
  # does not cancel its siblings and hide a second failure behind the first.
  pigrocrm-py:
    name: pigrocrm · python ${{ matrix.shard }}
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.pigrocrm_py == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    uses: ./.github/workflows/_python-gate.yml
    with:
      shard: ${{ matrix.shard }}
      # Tests only: ruff and mypy are `pigrocrm-py-lint` below (REB-572). With them on
      # the first shard it finished 25 to 45s after its siblings on every run.
      job-name: test
      lint: false
      typecheck: false
      lint-path: projects/pigrocrm
      sources: >-
        projects/pigrocrm/packages/core/src
        projects/pigrocrm/apps/api/src
        projects/pigrocrm/apps/mcp/src
      tests: >-
        projects/pigrocrm/packages/core/tests
        projects/pigrocrm/apps/api/tests
        projects/pigrocrm/apps/mcp/tests
      # `slow` builds a fifty-thousand-row corpus, so a PR does not pay for it and the
      # trunk does. `planner` is a different thing, deselected on this job's own filter
      # below: it asserts which plan Postgres picks, the winning plan sits within a few
      # percent of the loser at this row count, and a hosted runner picks the other one.
      # `test_trgm_escape.py`'s case (ORB-9) failed on the trunk run of the merge commit
      # for exactly that reason, on code that had passed the same assertion on the devbox
      # minutes earlier; its fix stopped costing the plan on whatever bloat the rest of
      # the suite happened to leave behind, so it no longer carries the marker.
      # `test_sort_plan.py` (REB-90) no longer carries the marker either, and no test in
      # the repository currently does; `planner` stays registered and deselected here for
      # whichever assertion needs it next. Worth being exact about what changed: the job
      # below (`pigrocrm-py-corpus`) selects on `slow` alone, with no `and not planner`,
      # so `test_sort_plan.py` -- `slow` and, until REB-90, also `planner` -- ran there on
      # the hosted runner throughout, which is how 34294151175 was able to fail on one at
      # all. Dropping the marker changed no CI selection; it retired the preflight lane
      # (`pigrocrm-py-planner`) that duplicated the corpus job's own coverage of this file
      # on a single known machine, once nothing was left for that lane to select.
      #
      # `slow` is not skipped on the trunk, it moved: the job below runs it in
      # parallel with this one. Measured 2026-09-09, the two are 10m and 12m of a
      # 17m serial suite locally, because the fifty-thousand-row corpus is built,
      # vacuumed, deleted and vacuumed again around two files. Running them side by
      # side makes the critical path the longer of the two instead of the sum.
      #
      # `-n auto --dist loadfile`: this suite waits on PostgreSQL far more than it
      # computes (measured locally: 10m00 wall for 7m57 of CPU), so workers overlap
      # almost perfectly. 10m00 -> 4m32 on the devbox, and each worker gets its own
      # container from the session fixture, so they share no database. `loadfile`
      # keeps a file's tests on one worker, which is what the module-scoped fixtures
      # in this suite assume.
      # `--durations=25`: every Test log ends with the slowest tests of that shard, so
      # the next question about this suite starts from a number rather than a total.
      pytest-args: '-n auto --dist loadfile --durations=25 -m "not slow and not planner"'
      # Without Pandoc and Typst the document renderer shells out to nothing and
      # about thirty tests fail on "strumento di composizione non installato". They
      # had been failing on every run of the previous workflow, which is also why
      # `e2e` and `deploy` had never once executed: both sat behind this job.
      renderer: true

  # ruff and mypy, once, in a job of their own (REB-572): about 30s including the
  # setup, beside the three shards rather than in front of the first one's tests.
  pigrocrm-py-lint:
    name: pigrocrm · python lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.pigrocrm_py == 'true') }}
    uses: ./.github/workflows/_python-gate.yml
    with:
      job-name: ruff · mypy
      test: false
      renderer: false
      lint-path: projects/pigrocrm
      sources: >-
        projects/pigrocrm/packages/core/src
        projects/pigrocrm/apps/api/src
        projects/pigrocrm/apps/mcp/src
      tests: ''

  # Tier 3, and the reason the job above got faster. The two files behind the `slow`
  # marker spend almost all of their time inside PostgreSQL building and vacuuming a
  # fifty-thousand-row corpus, so this job is nearly free in CPU and pointless to merge
  # with anything. Deliberately serial inside: every assertion in those files is about
  # which plan the planner picks, and two heavy corpora built at once on a two-core
  # runner is exactly the load that changes the answer.
  #
  # One job per file, on two runners (REB-565). Each file builds its own corpus from a
  # module-scoped fixture and never shares it with the other, so running them in one
  # job was two corpora in a row on one machine, 319s on run 36457557147, and the
  # longest job on any trunk push under `packages/**` once the gate above was cut to
  # three shards (REB-561). Two runners cost nothing on a public repository, and each
  # job stays as serial inside as before: one corpus, one file, no neighbour's load
  # under the planner. The matrix is the list of `slow` files as `changes` read it
  # from the tree, so a third such file is a third job with nothing to edit here, and
  # `preflight.json`'s `pigrocrm-py-corpus` lane still runs them all by marker. One
  # corpus is fifty thousand rows (`test_search_plan.py`), the other twenty thousand
  # per table (`test_sort_plan.py`).
  pigrocrm-py-corpus:
    name: pigrocrm · python corpus
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.changes.outputs.slow_files != '[]' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.pigrocrm_py_corpus == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.changes.outputs.slow_files) }}
    uses: ./.github/workflows/_python-gate.yml
    with:
      job-name: ${{ matrix.file }}
      # Lint and mypy already ran in the job above, on the same tree.
      lint: false
      typecheck: false
      lint-path: projects/pigrocrm
      sources: ''
      tests: projects/pigrocrm/packages/core/tests/${{ matrix.file }}
      pytest-args: '-m "slow"'
      # These two files render nothing: no pandoc, no typst, no poppler.
      renderer: false

  pigrocrm-web:
    name: pigrocrm · web
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.pigrocrm_web == 'true') }}
    uses: ./.github/workflows/_node-gate.yml
    with:
      filter: web

  # The committed `apps/web/src/lib/api-types.ts` is generated from the running API's
  # own OpenAPI document, never written by hand (apps/web/package.json's
  # `generate:api`). Nothing before REB-101 ever reran that generator and compared,
  # so a route removed or a field dropped from a response schema left the committed
  # file describing an API that no longer existed (REB-98). Neither shared gate
  # boots the other stack -- `_node-gate.yml` never touches Python and
  # `_python-gate.yml`'s `pytest -n auto` gives every worker its own disposable
  # Postgres through testcontainers, never one long-lived process a second tool can
  # address by URL -- so this needs its own job rather than a step bolted onto
  # either file, the same way `pigrocrm-images` already has its own job for the one
  # thing neither gate does. Cheap and path-scoped on purpose (regenerate one file
  # and diff it, seconds once the stack answers) rather than deferred to
  # `preflight.json`: this repository's own rule for a check that fits in the PR's
  # critical path without becoming the twelve-minute suite (`docs/design/
  # DECISIONS.md`, 2026-09-09 row on trunk-tier scoping) is that its cost decides
  # where it runs, not whether the check needs a database. It runs whenever either
  # side of the contract could have moved: the API's routers and schemas, or the
  # generated file and the script that makes it.
  pigrocrm-api-types:
    name: pigrocrm · api types
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.pigrocrm_py == 'true' || needs.changes.outputs.pigrocrm_web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.24'
          enable-cache: true

      - run: uv sync --frozen

      - run: pnpm install --frozen-lockfile --filter web...

      # apps/web/scripts/e2e-setup.sh is the one place this stack already gets
      # booted from a cold start for a tool outside pytest: a disposable Postgres
      # on :55434, migrated to head, seeded, with uvicorn answering on :8000. The
      # seed data (an admin, the pipeline defaults, ...) is unused here -- the
      # OpenAPI document comes from the routes and Pydantic models, not from any
      # row -- but forking a thinner variant of a script this exact would be the
      # second copy of a boot sequence this repository already has one of.
      - name: Bring the API up
        run: bash projects/pigrocrm/apps/web/scripts/e2e-setup.sh

      - name: Regenerate api-types.ts against the running API
        run: pnpm --filter web generate:api

      - name: Fail if the committed file drifted from the API
        run: git diff --exit-code -- projects/pigrocrm/apps/web/src/lib/api-types.ts

      - name: Tear the API down
        if: always()
        run: bash projects/pigrocrm/apps/web/scripts/e2e-teardown.sh

  # letsrebase.com, the website. Its own project, so its own job: static pages with
  # no framework, which is why this one costs seconds where the application's gate
  # costs minutes. It shares `shared/brand` with the application, so a change there
  # runs both.
  website:
    name: website · web
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.website == 'true') }}
    uses: ./.github/workflows/_node-gate.yml
    with:
      filter: website

  # The rebase hub (projects/hub): its own Python gate.
  hub-py:
    name: hub · python
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.hub_py == 'true') }}
    uses: ./.github/workflows/_python-gate.yml
    with:
      lint-path: projects/hub
      sources: >-
        projects/hub/packages/core/src
        projects/hub/apps/api/src
        projects/hub/apps/mcp/src
      tests: >-
        projects/hub/packages/core/tests
        projects/hub/apps/api/tests
        projects/hub/apps/mcp/tests
      # The same shape as the CRM's gate and for the same reason (REB-564): the suite
      # waits on PostgreSQL far more than it computes, each xdist worker gets its own
      # container from the session fixture and brings it to head with the hub's own
      # migrations, and `loadfile` keeps a file's tests on one worker. Serial, this was
      # 123s of Test on run 36457557147 and the longest job of every hub run.
      pytest-args: '-n auto --dist loadfile'
      # The contracts are typeset at request time since REB-387 (rebase_core.contracts),
      # and test_contract_render.py runs the real pandoc and Typst over both texts.
      renderer: true

  # The hub's SPA (projects/hub/apps/web, pnpm package `hub`): the same node gate as the
  # CRM's web and the website.
  hub-web:
    name: hub · web
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.hub_web == 'true') }}
    uses: ./.github/workflows/_node-gate.yml
    with:
      filter: hub

  # shared/analytics's own suite: two vitest files (posthog.test.ts and
  # browser.test.ts) and a tsconfig, run by no hosted tier before this -- a
  # `_node-gate.yml` caller with `filter: web`/`website`/`hub` installs the
  # dependency closure but never runs a dependency's own scripts (REB-253).
  # `build: false` because the package ships as source, with no build script.
  shared-analytics:
    name: shared/analytics · web
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.shared_analytics == 'true') }}
    uses: ./.github/workflows/_node-gate.yml
    with:
      filter: '@rebase/analytics'
      build: false

  # shared/ui's own suite: the token contract test and the three primitive suites that
  # came with the components in REB-300, run by no other tier for the same reason as
  # shared/analytics above.
  shared-ui:
    name: shared/ui · web
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.shared_ui == 'true') }}
    uses: ./.github/workflows/_node-gate.yml
    with:
      filter: '@rebase/ui'
      # The package ships source, which each application bundles itself, so there was
      # nothing to build until REB-300. Its build is the gallery, and building it is
      # what proves the eighteen primitives still compile against Tailwind and the
      # tokens outside an application.
      build: true

  # Tier 3, and scoped like everything else: an image nobody can have changed is an
  # image not worth two minutes of a metered runner.
  pigrocrm-images:
    name: pigrocrm · images build
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.pigrocrm_image == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build both images from the repository root context
        working-directory: projects/pigrocrm
        # The compose file's own build definitions, so this proves the same context
        # and the same Dockerfiles a deploy will use, rather than a parallel
        # invocation that can drift from them. POSTGRES_PASSWORD, PIGROCRM_JWT_SECRET
        # and (since REB-258) PIGROCRM_DATA_DIR are all `:?` there; a build reads none
        # of them, but compose interpolates the whole file before building, so all
        # three need a throwaway value, and the data directory has to stay
        # path-shaped or compose reads the word as a named volume and refuses the
        # project.
        env:
          POSTGRES_PASSWORD: build-only-never-used
          PIGROCRM_JWT_SECRET: build-only-never-used-and-long-enough-for-the-validator
          PIGROCRM_DATA_DIR: ./build-only-never-mounted
        run: docker compose build

  website-image:
    name: website · image build
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.website_image == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the image from the repository root context
        working-directory: projects/website
        # Through compose rather than `docker build`, so this proves the same context
        # and the same file the deploy uses. Nothing here needs a secret: the site has
        # no state and the one variable is a host port.
        run: docker compose build

  hub-images:
    name: hub · images build
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.hub_image == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build both images from the repository root context
        working-directory: projects/hub
        # Through compose, so this proves the same context and the same files the
        # deploy uses. `-p rebase` changes only what the throwaway images are called
        # (the names the deploy's project gives them, which is what preflight's twin
        # builds too). The two variables exist because compose interpolates the whole
        # file before a build and both are `:?` there; a build reads neither, and the
        # data directory has to stay path-shaped or compose reads the word as a named
        # volume and refuses the project.
        env:
          POSTGRES_PASSWORD: build-only-never-used
          REBASE_DATA_DIR: ./build-only-never-mounted
        run: docker compose -p rebase build
      - name: Typeset both contracts inside the image
        # REB-387: the API renders contracts at request time, so an image that builds
        # but lacks pandoc, Typst, fontTools or the brand files is a broken deploy.
        run: docker run --rm rebase-api uv run --no-sync rebase contracts-check

  # REB-422: dependency-free on purpose, same as the scripts it tests, so this runs
  # node --test directly rather than through _node-gate.yml (which installs a pnpm
  # workspace these scripts deliberately sit outside of). REB-525 added the weekly
  # Snyk report's tests to the same run rather than a second job for seconds of work.
  tooling-starter:
    name: tooling · node scripts
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.tooling == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tooling/client-repo-starter/*.test.mjs tooling/snyk-weekly/*.test.mjs

  ci:
    name: ci
    # `always()`, or a skipped dependency makes this job skip too and the check never
    # arrives. This is the only status check the repository should ever be asked to
    # require: every job name above can change forever without touching a ruleset.
    if: always()
    needs: [changes, pigrocrm-py, pigrocrm-py-lint, pigrocrm-py-corpus, pigrocrm-web, pigrocrm-api-types, website, hub-py, hub-web, shared-analytics, shared-ui, pigrocrm-images, website-image, hub-images, tooling-starter]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A needed job failed or was cancelled
        run: |
          printf '%s\n' '${{ toJSON(needs) }}'
          printf '%s' '${{ toJSON(needs) }}' | jq -e '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | length == 0'
