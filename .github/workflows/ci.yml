# Three tiers, and the reason for each one.
#
#   1. Local, before the PR exists: `.github/preflight.json`. Everything expensive --
#      the full Python suite, the Playwright run, the images. Free and parallel, and
#      the answer arrives before the push rather than minutes after it.
#   2. `pull_request`: one cheap gate per project, scoped to what the diff can break.
#   3. `push` to main: the heavy tier -- the images and the website's Playwright
#      suite -- but scoped to the
#      same filters. Scoping started 2026-09-09 because the repository was private and
#      every minute here was billed (1,564 of a 2,000/month allowance in eight days,
#      and a job that hits that limit dies in two seconds with no log, which reads as
#      a broken workflow rather than as an empty wallet). The repository went public
#      2026-09-10 and hosted minutes are free now, but the scoping stays: a
#      fifteen-minute trunk run on a docs commit is still a cost, just in waiting
#      rather than in money (`docs/design/DECISIONS.md`, 2026-09-10). A push that
#      cannot reach a project does not pay for that project's suite, and each
#      deploy's own `scope` job already decides the same way from the same paths.
#      When the base commit of a push is unreachable -- a force push, a new branch --
#      the filters are not consulted and everything runs. A release tag
#      (`<project>-v<semver>`) is a push too, with no base to diff against; its
#      prefix names the project, and the run is every job of that project plus the
#      shared packages it uses, nothing else (REB-563). A production deploy is gated
#      on the run of the tag itself, because the trunk's run for the same commit may
#      have skipped every job of the project being released and still concluded
#      success (ORB-28); the tag's run cannot, since it never skips that project. A
#      nightly `schedule` run on `main` earns the full run, for a different reason:
#      it buys back "the trunk proves the whole tree" without putting it on the
#      critical path of a
#      merge. It needs no new code to get there -- a `schedule` event carries no
#      `before` at all, so it falls into the same "no usable base commit" branch a
#      force push already takes below, rather than a fourth branch written for it.
#
#      The nightly run, and a manual `workflow_dispatch`, also run the `nightly-*` jobs:
#      the Playwright suites of the CRM and of `shared/ui`, the hub's compose shapes,
#      the wordmark and the vhosts' robots answers. Each is too slow or too host-bound
#      for a PR and had lived only in `preflight.json`, so no server proved it. `infra`
#      (Terraform, nginx) and `secrets-scan` (gitleaks) are path-scoped and unscoped
#      respectively, like every other job.
#
# A check that stops running on a PR must appear in preflight.json. Verification did
# not get cheaper here, it moved; a heavy check in neither tier is a hole.
#
# Adding a project means adding one filter to `changes` and one or two jobs below
# that call the shared gates. It must not mean another workflow file.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Every project's release tag. `_deploy-compose.yml` gates a production deploy on
    # the CI run of the tag itself; this is what gives the tag one. `deploy-*.yml`'s
    # `workflow_run` triggers filter on `branches: [main]`, and a tag run's head branch
    # is the tag, so this run never starts a preview.
    tags: ['*-v*']
  # Nightly, at a quarter past three UTC rather than on the hour, when every other
  # scheduled workflow on the platform also wakes up and queues behind the runner
  # fleet. `schedule` only ever runs the workflow version committed to the default
  # branch, so this always builds `main`, and it always gets `all=true` below (a
  # `schedule` event carries no `before` at all). It cannot start a deploy: that
  # guard lives in `deploy-*.yml`, not here, since their `scope` job requires
  # `github.event.workflow_run.event == 'push'`, which a scheduled run's own
  # `github.event_name` of `schedule` never satisfies.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# Cancelling is right on a PR and wrong on the trunk, and the difference is not
# taste. Every push to `main` is a candidate for deployment: `deploy-*.yml` refuses a
# commit whose CI did not pass, and a cancelled run is not a pass. Observed on
# 2026-09-09 (runs 34340411493, 34340433286, 34340694267): three pushes landed inside
# four minutes, the account's concurrent-job ceiling put the first one's jobs in a
# queue, and when it finally started six minutes later it cancelled the two newer
# runs -- including the tip. The tip then had no verdict and could not deploy, which
# is the same shape as a red trunk and harder to read. Grouping by commit on push
# gives every trunk commit its own run and its own answer; a PR still keeps one.
#
# The ref is in the group as well as the commit, because a release tag is a push at a
# commit the trunk has usually already built. A pending run is cancelled when another
# run joins its group, so with the commit alone two tags pushed at one commit (two
# projects released together) would cancel each other's run, and each deploy gates on
# its own tag's run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Runs on both events, and answers differently on each. On a pull_request
  # dorny/paths-filter reads the diff from the API, so no checkout is needed and the
  # job costs seconds. On a push there is no such API view, so the repository is
  # checked out with its history and the base is the commit the push moved off.
  #
  # `all` is the escape hatch, and it fails open. A force push, a freshly created
  # branch, a base commit garbage-collected out of the remote, or a `schedule` run
  # (not a push at all, so there is no `before` to speak of) all leave nothing to
  # diff against, and the honest answer to "what changed" is then "assume everything".
  #
  # The `permissions` block is repeated rather than widened at the top because a
  # job-level block REPLACES the workflow-level one instead of merging: without
  # `contents: read` restated, every pull_request run fails with "Resource not
  # accessible by integration" and `ci` goes red with no test failure in it.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ steps.base.outputs.all }}
      pigrocrm_py: ${{ steps.tag.outputs.pigrocrm_py || steps.filter.outputs.pigrocrm_py }}
      pigrocrm_web: ${{ steps.tag.outputs.pigrocrm_web || steps.filter.outputs.pigrocrm_web }}
      pigrocrm_image: ${{ steps.tag.outputs.pigrocrm_image || steps.filter.outputs.pigrocrm_image }}
      website: ${{ steps.tag.outputs.website || steps.filter.outputs.website }}
      website_image: ${{ steps.tag.outputs.website_image || steps.filter.outputs.website_image }}
      hub_py: ${{ steps.tag.outputs.hub_py || steps.filter.outputs.hub_py }}
      hub_web: ${{ steps.tag.outputs.hub_web || steps.filter.outputs.hub_web }}
      shared_analytics: ${{ steps.tag.outputs.shared_analytics || steps.filter.outputs.shared_analytics }}
      shared_ui: ${{ steps.tag.outputs.shared_ui || steps.filter.outputs.shared_ui }}
      hub_image: ${{ steps.tag.outputs.hub_image || steps.filter.outputs.hub_image }}
      pigrocrm_deploy: ${{ steps.tag.outputs.pigrocrm_deploy || steps.filter.outputs.pigrocrm_deploy }}
      website_deploy: ${{ steps.tag.outputs.website_deploy || steps.filter.outputs.website_deploy }}
      hub_deploy: ${{ steps.tag.outputs.hub_deploy || steps.filter.outputs.hub_deploy }}
      tooling: ${{ steps.tag.outputs.tooling || steps.filter.outputs.tooling }}
      vaultwarden: ${{ steps.tag.outputs.vaultwarden || steps.filter.outputs.vaultwarden }}
      hub_db_backup: ${{ steps.tag.outputs.hub_db_backup || steps.filter.outputs.hub_db_backup }}
      hub_api_types: ${{ steps.tag.outputs.hub_api_types || steps.filter.outputs.hub_api_types }}
      infra: ${{ steps.tag.outputs.infra || steps.filter.outputs.infra }}
      english_lint: ${{ steps.tag.outputs.english_lint || steps.filter.outputs.english_lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name != 'pull_request'
        with:
          # The filter diffs locally on a push, and a shallow clone would make every
          # base commit unreachable and every run a full one.
          fetch-depth: 0
          persist-credentials: false

      - name: Is there a base commit to diff against
        id: base
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            echo 'all=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Unset on `schedule` too, same as on a force push or a freshly created
          # branch: none of the three is a push with a real "before" commit, so all
          # three fall into the `elif` below rather than needing a branch of their own.
          before='${{ github.event.before }}'
          if [[ "$REF" == refs/tags/* ]]; then
            # A new tag has no base anyway, so the filters have nothing to diff; the
            # prefix says which project is released and the `tag` step below turns
            # that into the same outputs the filters would have written.
            case "${REF#refs/tags/}" in
              website-v*)  project=website ;;
              hub-v*)      project=hub ;;
              pigrocrm-v*) project=pigrocrm ;;
              vaultwarden-v*) project=vaultwarden ;;
              *)           project='' ;;
            esac
            if [ -n "$project" ]; then
              echo "A release tag of ${project}; running its jobs and the shared packages it uses."
              echo 'all=false' >> "$GITHUB_OUTPUT"
              echo "project=${project}" >> "$GITHUB_OUTPUT"
            else
              echo 'A tag that names no project; running every job.'
              echo 'all=true' >> "$GITHUB_OUTPUT"
            fi
          elif [ -z "$before" ] || [ "$before" = '0000000000000000000000000000000000000000' ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo 'No usable base commit; running every job.'
            echo 'all=true' >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi

      # A release tag names its project, and the run proves that project whole and
      # nothing else (REB-563). Before this, a tag earned `all=true`: `website-v0.21.0`
      # (run 36457557147) ran the CRM's suite for 355s in front of a website release
      # whose own jobs took 32s and 21s, and its production deploy waited 6′36″ for
      # that. The 2026-09-09 rule holds: `_deploy-compose.yml` still gates on the run
      # of the tag itself, and that run still runs every job of the released project,
      # plus the shared packages it depends on, whose own suites the project's gate
      # never runs (REB-253, REB-299). A tag whose prefix names no project keeps the
      # full run, fail-open like a missing base commit. Every key is written, `true`
      # or `false`, so the outputs above never fall through to a filter that did not
      # run; `'false'` is a non-empty string and wins the `||`.
      - name: Select the released project's jobs
        id: tag
        if: steps.base.outputs.project != ''
        env:
          PROJECT: ${{ steps.base.outputs.project }}
        run: |
          set -euo pipefail
          case "$PROJECT" in
            website)  on='website website_image website_deploy shared_analytics' ;;
            hub)      on='hub_py hub_web hub_image hub_deploy hub_db_backup hub_api_types shared_ui shared_analytics' ;;
            pigrocrm) on='pigrocrm_py pigrocrm_web pigrocrm_image pigrocrm_deploy hub_db_backup shared_ui shared_analytics' ;;
            vaultwarden) on='vaultwarden' ;;
            *) echo "::error::no job list for project '${PROJECT}'"; exit 1 ;;
          esac
          for key in pigrocrm_py pigrocrm_web pigrocrm_image website website_image hub_py hub_web shared_analytics shared_ui hub_image pigrocrm_deploy website_deploy hub_deploy tooling vaultwarden hub_db_backup infra hub_api_types english_lint; do
            case " $on " in *" $key "*) value=true ;; *) value=false ;; esac
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done
          echo "release of ${PROJECT}: ${on}"

      # Underscores, never dashes: `needs.changes.outputs.pigrocrm-web` is invalid
      # expression syntax and the run dies in seconds with no job started, which
      # reads as a broken workflow rather than as a typo.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: steps.base.outputs.all != 'true' && steps.base.outputs.project == ''
        with:
          # Empty on a pull_request, where the action asks the API instead.
          base: ${{ github.event_name == 'pull_request' && '' || github.event.before }}
          filters: |
            pigrocrm_py:
              - 'projects/pigrocrm/apps/api/**'
              - 'projects/pigrocrm/apps/mcp/**'
              - 'projects/pigrocrm/packages/**'
              - 'projects/pigrocrm/conftest.py'
              - 'conftest.py'
              - 'projects/pigrocrm/ruff.toml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'ruff.toml'
              - '.python-version'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_python-gate.yml'
            pigrocrm_web:
              - 'projects/pigrocrm/apps/web/**'
              # The vhost `projects/pigrocrm/apps/web/src/test/robots.test.ts` reads
              # (REB-107): not under `apps/web/**` itself, so a change to just this
              # file would otherwise skip the test that guards it.
              - 'projects/pigrocrm/deploy/nginx/pigro.letsrebase.conf'
              - 'shared/brand/**'
              - 'shared/analytics/**'
              - 'shared/ui/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_node-gate.yml'
            website:
              - 'projects/website/**'
              - 'shared/brand/**'
              - 'shared/analytics/**'
              # The website's style test reads shared/ui's loader record (tokens.css,
              # loader.tsx) to hold its own CSS redraw of the Loader to it (REB-680).
              - 'shared/ui/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_node-gate.yml'
            hub_py:
              - 'projects/hub/apps/api/**'
              - 'projects/hub/apps/mcp/**'
              - 'projects/hub/packages/**'
              - 'projects/hub/apps/web/src/lib/amount_cases.json'
              - 'projects/hub/conftest.py'
              - 'conftest.py'
              - 'projects/hub/ruff.toml'
              # The hub's two compose files, the backups' Dockerfile and the hub's deploy
              # workflow (REB-715, REB-717): `test_documenso_compose.py` reads all four, and
              # they sat under none of the paths above. Dependabot's #587 moved the image
              # pin, no job of the hub's Python suite ran on the PR or on the trunk, and the
              # stale pin test failed only on the `hub-v0.62.0` tag run.
              - 'projects/hub/docker-compose.yml'
              - 'projects/hub/docker-compose.documenso.yml'
              - 'projects/hub/db-backup/Dockerfile'
              - '.github/workflows/deploy-hub.yml'
              # The guide PDF's own inputs (REB-310): `test_guide_pdf.py` under
              # `packages/core/tests` asserts the hash of every source recorded in
              # `tools/guide-pdf.lock.json`, and none of the lock's five sources nor
              # the lock file itself sit under the paths above unless listed here.
              # PR #197 changed `shared/brand/palette.css`, did not trigger this job,
              # and the stale lock reached main (fixed ad hoc in PR #199). `hub_web`
              # below already treats `shared/brand/**` this way for the web side.
              - 'projects/hub/content/**'
              - 'projects/hub/tools/**'
              - 'shared/brand/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'ruff.toml'
              - '.python-version'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_python-gate.yml'
            hub_web:
              - 'projects/hub/apps/web/**'
              - 'shared/brand/**'
              - 'shared/analytics/**'
              - 'shared/ui/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_node-gate.yml'
            # shared/analytics's own suite: no `_node-gate.yml` caller above installs
            # it as anything but a dependency of the SPA that imports it, which never
            # runs the dependency's own `lint`/`test`/`tsc` (REB-253).
            shared_analytics:
              - 'shared/analytics/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_node-gate.yml'
            # shared/ui's own suite, for the same reason as shared/analytics above: the
            # SPAs install it as a dependency and never run the dependency's own
            # lint/test/tsc, so the token contract would go unchecked on a change that
            # touches nothing else (REB-299).
            shared_ui:
              - 'shared/ui/**'
              - 'shared/brand/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_node-gate.yml'
            # Everything the two images copy in, which after the website split is
            # the whole of this project plus the root manifests the build context
            # carries. `projects/website/**` used to be here and is not a mistake
            # that was corrected: until 2026-09-09 the CRM's web image did build the
            # site, and now `website_image` below owns that.
            pigrocrm_image: &pigrocrm_image
              - 'projects/pigrocrm/**'
              - 'shared/brand/**'
              - 'shared/analytics/**'
              - 'shared/ui/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            website_image: &website_image
              - 'projects/website/**'
              - 'shared/brand/**'
              - 'shared/analytics/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            hub_image: &hub_image
              - 'projects/hub/**'
              - 'shared/brand/**'
              - 'shared/analytics/**'
              - 'shared/ui/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            # What a deploy rebuilds, which is what its image copies in plus the two
            # files that decide the deploy itself. The anchors are dorny/paths-filter's
            # own documented reuse mechanism, and they exist so that the deploy-side
            # list cannot drift from the image-side one: before 2026-09-09 each deploy
            # workflow carried its own hand-written copy of these paths as a grep, and
            # PigroCRM's had already lost `shared/brand`.
            pigrocrm_deploy:
              - *pigrocrm_image
              - '.github/workflows/deploy-pigrocrm.yml'
              - '.github/workflows/_deploy-compose.yml'
            website_deploy:
              - *website_image
              - '.github/workflows/deploy-website.yml'
              - '.github/workflows/_deploy-compose.yml'
            hub_deploy:
              - *hub_image
              - '.github/workflows/deploy-hub.yml'
              - '.github/workflows/_deploy-compose.yml'
            # The scaffolding script's own regression test (REB-422), the weekly
            # Snyk report's (REB-525) and the workflow kit's (REB-814): all
            # dependency-free on purpose, so they run with node --test and python's
            # unittest rather than through a project's own gate. The Snyk tests read
            # JSON fixtures, hence the whole directory.
            tooling:
              - 'tooling/client-repo-starter/*.mjs'
              - 'tooling/snyk-weekly/**'
              - 'tooling/workflow-kit/**'
              - '.github/workflows/ci.yml'
            # Vaultwarden ships no image of its own and has no preview, so there is no
            # `_image` or `_deploy` filter and `changed-paths.json` carries no key for
            # it: its deploy runs on a tag alone (`deploy-vaultwarden.yml`). What a
            # change can break is its compose file, its vhost, its scripts and the
            # drill that runs them.
            vaultwarden:
              - 'projects/vaultwarden/**'
              - 'shared/brand/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-vaultwarden.yml'
              - '.github/workflows/_deploy-compose.yml'
            # The hub's generated `api-types.ts` and what generates it.
            hub_api_types:
              - 'projects/hub/apps/api/**'
              - 'projects/hub/packages/core/**'
              - 'projects/hub/apps/web/src/lib/api-types.ts'
              - 'projects/hub/apps/web/scripts/**'
              - '.github/workflows/ci.yml'
            # The database backups' drill (REB-715, REB-717): the services' image and
            # scripts, the drill that runs them and the compose files that wire them. It
            # builds the Postgres image tag of Documenso's database and of the hub's `db`,
            # so a bump of either pin is checked here too.
            hub_db_backup:
              - 'projects/hub/db-backup/**'
              - 'projects/hub/docker-compose.documenso.yml'
              - 'projects/hub/docker-compose.yml'
              # The CRM's own backup service reuses the hub's image and scripts, so its
              # compose file is what wires them.
              - 'projects/pigrocrm/docker-compose.yml'
              - 'projects/pigrocrm/docker-compose.backup.yml'
              - '.github/workflows/ci.yml'
            # Terraform, every nginx file the repository carries and the scripts that
            # check them (CI-A-08). Release tags do not touch it: `infra` is `false` on
            # a tag run, which has nothing to say about the origin host.
            infra:
              - 'infra/**'
              - 'projects/*/deploy/**'
              - 'scripts/**'
              - 'tooling/english-lint/**'
              - '.github/workflows/ci.yml'
            # The English lint (REB-904) reads the name of every tracked file and the
            # identifiers and comments of every source file, so any project's code
            # reaches it; the docs and the lockfiles do not. Release tags do not run it,
            # like `infra`: a release proves a project, the lint proves the tree.
            english_lint:
              - 'projects/**'
              - 'shared/**'
              - 'tooling/**'
              - 'scripts/**'
              - 'infra/**'
              - 'conftest.py'
              - 'pnpm-lock.yaml'
              - '.github/**'

      # The deploy workflows used to answer "did this push touch my project?" for
      # themselves, each with its own copy of the paths above, and each by waiting on
      # a billed runner until this run finished. They are triggered by this run's
      # completion now, and they read the verdict from here. One computation, one
      # list, and a deploy that starts already knowing CI was green.
      - name: Publish the verdict for the deploy workflows
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          cat > changed-paths.json <<JSON
          {
            "all": "${{ steps.base.outputs.all }}",
            "pigrocrm": "${{ steps.tag.outputs.pigrocrm_deploy || steps.filter.outputs.pigrocrm_deploy }}",
            "website": "${{ steps.tag.outputs.website_deploy || steps.filter.outputs.website_deploy }}",
            "hub": "${{ steps.tag.outputs.hub_deploy || steps.filter.outputs.hub_deploy }}"
          }
          JSON
          cat changed-paths.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'push'
        with:
          name: changed-paths
          path: changed-paths.json
          # Read minutes after the run by the deploys and by nothing else.
          retention-days: 1

  # Two guards, and neither is decoration.
  #
  # `!cancelled() &&`: a job that `needs` a skipped or failed job is skipped too,
  # whatever its own `if` says, unless that `if` contains a status-check function.
  # `changes` runs on both events now, but if it ever fails this keeps the suite
  # running instead of reporting GREEN off a wholly skipped run, which is how this
  # shape fails silently and in the safe-looking direction.
  #
  # `outputs.all == 'true' ||`: the push had no base commit to diff against, so the
  # filters were never consulted and every job runs.
  #
  # Three shards, not one job (REB-561). Measured 2026-09-28 on run 36457557147: this
  # job took 355s, 315s of them the tests, and it was the critical path of that run
  # and of every run that selects it, a CRM pull request, a trunk push and every
  # release tag alike (p90 of the last thirty PR runs 354s; every run over 300s was
  # one with this job in it). The suite was already under `-n auto` on the runner's
  # four cores, so the next unit of parallelism is another runner: hosted larger
  # runners are billed even on a public repository and the self-hosted pool is closed
  # to this repository (`docs/ci-runner-pool.md`), while two more free jobs cost
  # nothing but their slots. Four shards since REB-589, three before: at three they
  # ran 112 to 160s apiece, about 1,900 tests each, and were the CRM's critical path
  # with the web. Each shard is every fourth file of the sorted list
  # (`_python-gate.yml`'s `shard` input) with its own `-n auto` inside; lint and mypy
  # run once, in `pigrocrm-py-lint` below (REB-572). `ci` reads one aggregate result
  # for the matrix, so
  # the required check does not change, and `preflight.json`'s `pigrocrm-py-test`
  # lane still runs the whole suite in one lane. `fail-fast: false`, so a red shard
  # does not cancel its siblings and hide a second failure behind the first.
  pigrocrm-py:
    name: pigrocrm · python ${{ matrix.shard }}
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.pigrocrm_py == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    uses: ./.github/workflows/_python-gate.yml
    with:
      shard: ${{ matrix.shard }}
      # Tests only: ruff and mypy are `pigrocrm-py-lint` below (REB-572). With them on
      # the first shard it finished 25 to 45s after its siblings on every run.
      job-name: test
      lint: false
      typecheck: false
      lint-path: projects/pigrocrm
      sources: >-
        projects/pigrocrm/packages/core/src
        projects/pigrocrm/apps/api/src
        projects/pigrocrm/apps/mcp/src
      tests: >-
        projects/pigrocrm/packages/core/tests
        projects/pigrocrm/apps/api/tests
        projects/pigrocrm/apps/mcp/tests
      # `not slow and not planner`: both markers stay registered in pyproject.toml and
      # deselected here, and since REB-580 no test carries either. `slow` was the
      # planner corpus (fifty thousand rows per table, minutes of PostgreSQL around two
      # files, its own job on the trunk from 2026-09-09 to 2026-09-28), gone because a
      # space's tables never reach the size where the plan it asserted matters.
      # `planner` was for an assertion whose answer depends on the machine (ORB-9), and
      # is kept for whichever assertion needs it next. A test that earns either marker
      # again also earns a place to run: preflight, the nightly or a job of its own.
      #
      # `-n auto --dist loadfile`: this suite waits on PostgreSQL far more than it
      # computes (measured locally: 10m00 wall for 7m57 of CPU), so workers overlap
      # almost perfectly. 10m00 -> 4m32 on a development machine, and each worker gets its own
      # container from the session fixture, so they share no database. `loadfile`
      # keeps a file's tests on one worker, which is what the module-scoped fixtures
      # in this suite assume.
      # `--durations=25`: every Test log ends with the slowest tests of that shard, so
      # the next question about this suite starts from a number rather than a total.
      pytest-args: '-n auto --dist loadfile --durations=25 -m "not slow and not planner"'
      # Without Pandoc and Typst the document renderer shells out to nothing and
      # about thirty tests fail on "strumento di composizione non installato". They
      # had been failing on every run of the previous workflow, which is also why
      # `e2e` and `deploy` had never once executed: both sat behind this job.
      renderer: true

  # ruff and mypy, once, in a job of their own (REB-572): about 30s including the
  # setup, beside the shards rather than in front of the first one's tests.
  pigrocrm-py-lint:
    name: pigrocrm · python lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.pigrocrm_py == 'true') }}
    uses: ./.github/workflows/_python-gate.yml
    with:
      job-name: ruff · mypy
      test: false
      renderer: false
      lint-path: projects/pigrocrm
      sources: >-
        projects/pigrocrm/packages/core/src
        projects/pigrocrm/apps/api/src
        projects/pigrocrm/apps/mcp/src
      tests: ''

  # Two shards, not one job (REB-571): with the Python gate cut to three shards this
  # was the longest job of a CRM pull request, 186s on run 36471954567, 121s of them
  # 120 vitest files under jsdom on four cores, and the load of that full run is what
  # REB-405, REB-416 and REB-559 keep chasing as timeouts. Each shard is vitest's own
  # `--shard=k/2` over the files ordered by a hash of their path; lint, build and tsc
  # ran once on the first shard until REB-588 moved them to `pigrocrm-web-lint` below.
  # `fail-fast: false` so a red
  # shard does not cancel its sibling and hide a second failure. `preflight.json`'s
  # `pigrocrm-web-unit` lane still runs the whole suite in one lane.
  pigrocrm-web:
    name: pigrocrm · web ${{ matrix.shard }}
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.pigrocrm_web == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    uses: ./.github/workflows/_node-gate.yml
    with:
      filter: web
      shard: ${{ matrix.shard }}
      # Tests only: lint, build and tsc are `pigrocrm-web-lint` below (REB-588). On the
      # first shard they made it 127s against 59s for the second (run 36540443668), the
      # web's critical path on every CRM run.
      job-name: unit
      lint: false
      build: false
      typecheck: false

  # Lint and build once, in a job of their own beside the shards (REB-588), the shape
  # the Python gate has had since REB-572. The app's own `build` script runs `vite build`
  # and then `tsc --noEmit`, in that order because on a clean checkout tsc needs the
  # route tree only a vite run writes; so the gate's separate Type check step would be
  # the same tsc a second time (14s, run 36540443668) and is off here.
  pigrocrm-web-lint:
    name: pigrocrm · web lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.pigrocrm_web == 'true') }}
    uses: ./.github/workflows/_node-gate.yml
    with:
      filter: web
      job-name: lint · build
      test: false
      typecheck: false

  # The committed `apps/web/src/lib/api-types.ts` is generated from the running API's
  # own OpenAPI document, never written by hand (apps/web/package.json's
  # `generate:api`). Nothing before REB-101 ever reran that generator and compared,
  # so a route removed or a field dropped from a response schema left the committed
  # file describing an API that no longer existed (REB-98). Neither shared gate
  # boots the other stack -- `_node-gate.yml` never touches Python and
  # `_python-gate.yml`'s `pytest -n auto` gives every worker its own disposable
  # Postgres through testcontainers, never one long-lived process a second tool can
  # address by URL -- so this needs its own job rather than a step bolted onto
  # either file, the same way `pigrocrm-images` already has its own job for the one
  # thing neither gate does. Cheap and path-scoped on purpose (regenerate one file
  # and diff it, seconds once the stack answers) rather than deferred to
  # `preflight.json`: this repository's own rule for a check that fits in the PR's
  # critical path without becoming the twelve-minute suite (`docs/design/
  # DECISIONS.md`, 2026-09-09 row on trunk-tier scoping) is that its cost decides
  # where it runs, not whether the check needs a database. It runs whenever either
  # side of the contract could have moved: the API's routers and schemas, or the
  # generated file and the script that makes it.
  pigrocrm-api-types:
    name: pigrocrm · api types
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.pigrocrm_py == 'true' || needs.changes.outputs.pigrocrm_web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.24'
          enable-cache: true

      - run: uv sync --locked

      - run: pnpm install --frozen-lockfile --filter web...

      # apps/web/scripts/e2e-setup.sh is the one place this stack already gets
      # booted from a cold start for a tool outside pytest: a disposable Postgres
      # on :55434, migrated to head, seeded, with uvicorn answering on :8000. The
      # seed data (an admin, the pipeline defaults, ...) is unused here -- the
      # OpenAPI document comes from the routes and Pydantic models, not from any
      # row -- but forking a thinner variant of a script this exact would be the
      # second copy of a boot sequence this repository already has one of.
      - name: Bring the API up
        run: bash projects/pigrocrm/apps/web/scripts/e2e-setup.sh

      - name: Regenerate api-types.ts against the running API
        run: pnpm --filter web generate:api

      - name: Fail if the committed file drifted from the API
        run: git diff --exit-code -- projects/pigrocrm/apps/web/src/lib/api-types.ts

      - name: Tear the API down
        if: always()
        run: bash projects/pigrocrm/apps/web/scripts/e2e-teardown.sh

  # letsrebase.com, the website. Its own project, so its own job: static pages with
  # no framework, which is why this one costs seconds where the application's gate
  # costs minutes. It shares `shared/brand` with the application, so a change there
  # runs both.
  website:
    name: website · web
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.website == 'true') }}
    uses: ./.github/workflows/_node-gate.yml
    with:
      filter: website

  # The rebase hub (projects/hub): its own Python gate.
  hub-py:
    name: hub · python
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.hub_py == 'true') }}
    uses: ./.github/workflows/_python-gate.yml
    with:
      lint-path: projects/hub
      sources: >-
        projects/hub/packages/core/src
        projects/hub/apps/api/src
        projects/hub/apps/mcp/src
      tests: >-
        projects/hub/packages/core/tests
        projects/hub/apps/api/tests
        projects/hub/apps/mcp/tests
      # The same shape as the CRM's gate and for the same reason (REB-564): the suite
      # waits on PostgreSQL far more than it computes, each xdist worker gets its own
      # container from the session fixture and brings it to head with the hub's own
      # migrations, and `loadfile` keeps a file's tests on one worker. Serial, this was
      # 123s of Test on run 36457557147 and the longest job of every hub run.
      pytest-args: '-n auto --dist loadfile'
      # The anonymous CV is typeset at request time (REB-862) and test_anonymous_cv_pdf.py runs
      # the real Typst over it.
      renderer: true

  # The hub's SPA (projects/hub/apps/web, pnpm package `hub`): the same node gate as the
  # CRM's web and the website.
  # Two shards of tests and a lint job, as the CRM's web (REB-588): one job was 130s,
  # 78s of them the unit tests (run 36538611109), with lint, build and tsc in front of
  # nothing. The hub's `build` runs tsc too, so the gate's Type check step is off on
  # its lint job as on the CRM's.
  hub-web:
    name: hub · web ${{ matrix.shard }}
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.hub_web == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    uses: ./.github/workflows/_node-gate.yml
    with:
      filter: hub
      shard: ${{ matrix.shard }}
      job-name: unit
      lint: false
      build: false
      typecheck: false

  hub-web-lint:
    name: hub · web lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.hub_web == 'true') }}
    uses: ./.github/workflows/_node-gate.yml
    with:
      filter: hub
      job-name: lint · build
      test: false
      typecheck: false

  # shared/analytics's own suite: two vitest files (posthog.test.ts and
  # browser.test.ts) and a tsconfig, run by no hosted tier before this -- a
  # `_node-gate.yml` caller with `filter: web`/`website`/`hub` installs the
  # dependency closure but never runs a dependency's own scripts (REB-253).
  # `build: false` because the package ships as source, with no build script.
  shared-analytics:
    name: shared/analytics · web
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.shared_analytics == 'true') }}
    uses: ./.github/workflows/_node-gate.yml
    with:
      filter: '@rebase/analytics'
      build: false

  # shared/ui's own suite: the token contract test and the three primitive suites that
  # came with the components in REB-300, run by no other tier for the same reason as
  # shared/analytics above.
  shared-ui:
    name: shared/ui · web
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.shared_ui == 'true') }}
    uses: ./.github/workflows/_node-gate.yml
    with:
      filter: '@rebase/ui'
      # The package ships source, which each application bundles itself, so there was
      # nothing to build until REB-300. Its build is the gallery, and building it is
      # what proves the eighteen primitives still compile against Tailwind and the
      # tokens outside an application.
      build: true

  # Tier 3, and scoped like everything else: an image nobody can have changed is an
  # image not worth two minutes of a metered runner.
  pigrocrm-images:
    name: pigrocrm · images build
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.pigrocrm_image == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      - name: Build every image from the repository root context
        working-directory: projects/pigrocrm
        # The compose file's own build definitions, so this proves the same context
        # and the same Dockerfiles a deploy will use, rather than a parallel
        # invocation that can drift from them. Compose interpolates the whole file
        # before building, so every `:?` variable needs a throwaway value (a build
        # reads none of them), and the data directory has to stay path-shaped or
        # compose reads the word as a named volume and refuses the project. The layer
        # cache is the GitHub Actions one (see `hub-images`).
        env:
          POSTGRES_PASSWORD: build-only-never-used
          PIGROCRM_APP_PASSWORD: build-only-never-used
          PIGROCRM_JWT_SECRET: build-only-never-used-and-long-enough-for-the-validator
          PIGROCRM_DATA_DIR: ./build-only-never-mounted
          COMPOSE_BAKE: 'true'
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/ci-build-cache-override.sh" pigrocrm > "$RUNNER_TEMP/cache.yml"
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/cache.yml" build

  website-image:
    name: website · image build
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.website_image == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      - name: Build the image from the repository root context
        working-directory: projects/website
        # Through compose rather than `docker build`, so this proves the same context
        # and the same file the deploy uses. Nothing here needs a secret: the site has
        # no state and the one variable is a host port. The layer cache is the GitHub
        # Actions one (see `hub-images`).
        env:
          COMPOSE_BAKE: 'true'
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/ci-build-cache-override.sh" website > "$RUNNER_TEMP/cache.yml"
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/cache.yml" build

  # Tier 3 for the one suite that drives the built site in a real browser (REB-663):
  # cookie notice, UTM carry-through, the typewriter, and the order of the landing's
  # window globals in the built bundle, none of which the `website` job's unit tests
  # can see. Not on a pull_request, by the rule at the top of this file: Chromium and a
  # build are the expensive half, and `preflight.json`'s `website-e2e` check runs the
  # same `pnpm --filter website test:e2e` before the PR exists. `website` is also what
  # a release tag (`website-v<semver>`) and the nightly select, so a release is proven
  # by this suite too. `playwright.config.ts` builds and serves `dist` itself
  # (`pnpm build && pnpm preview` on 4173), so no build step here.
  website-e2e:
    name: website · e2e
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.website == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --filter website...

      # The browser version is whatever the locked @playwright/test wants, so the lock
      # is the cache key; on a hit only the system libraries `--with-deps` adds are
      # installed again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm --filter website exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter website test:e2e

  hub-images:
    name: hub · images build
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.changes.outputs.all == 'true' || needs.changes.outputs.hub_image == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      - name: Build both images from the repository root context
        working-directory: projects/hub
        # Through compose, so this proves the same context and the same files the
        # deploy uses. `-p rebase` changes only what the throwaway images are called
        # (the names the deploy's project gives them, which is what preflight's twin
        # builds too). The two variables exist because compose interpolates the whole
        # file before a build and both are `:?` there; a build reads neither, and the
        # data directory has to stay path-shaped or compose reads the word as a named
        # volume and refuses the project. The layer cache is the GitHub Actions one,
        # wired by an override that `scripts/ci-build-cache-override.sh` writes from
        # the compose file itself (CI-A-10).
        env:
          POSTGRES_PASSWORD: build-only-never-used
          REBASE_DATA_DIR: ./build-only-never-mounted
          COMPOSE_BAKE: 'true'
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/ci-build-cache-override.sh" hub -p rebase > "$RUNNER_TEMP/cache.yml"
          docker compose -p rebase -f docker-compose.yml -f "$RUNNER_TEMP/cache.yml" build
      - name: Check the anonymous CV's toolchain inside the image
        # REB-862: the API prints the anonymous CV at request time, so an image that builds
        # but lacks Typst, fontTools or the brand files is a broken deploy.
        run: >-
          docker run --rm rebase-api sh -c 'typst --version && uv run --no-sync python -c
          "from rebase_core.contracts import brand; brand.fonts_dir(); assert brand.ECHO.is_file()"'

  # REB-422: dependency-free on purpose, same as the scripts it tests, so this runs
  # node --test directly rather than through _node-gate.yml (which installs a pnpm
  # workspace these scripts deliberately sit outside of). REB-525 added the weekly
  # Snyk report's tests to the same run rather than a second job for seconds of work.
  tooling-starter:
    name: tooling · node and python scripts
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.tooling == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: node --test tooling/client-repo-starter/*.test.mjs tooling/snyk-weekly/*.test.mjs
      - name: Workflow kit
        run: python3 -m unittest discover -s tooling/workflow-kit/tests

  # REB-814, REB-816: the workflow kit's copy here matches its manifest (a skill edited
  # in .claude/skills instead of .agents/skills, a kit file changed without a sync, a
  # template that no longer follows .github/workflow.json), and on a pull request the
  # title and body follow .github/workflow.json. No paths filter: every PR has a title.
  # pr_lint reads the PR from the API, not from the event, so after `gh pr edit` a
  # re-run of the failed jobs checks the new text without a push. Seconds, no setup:
  # python3 is on the runner and both scripts use the standard library only.
  kit:
    name: kit · check and PR lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job-level block replaces the workflow-level one, so `contents: read` is restated.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: The kit's copy is intact
        run: python3 .github/kit/bin/kit.py check
      - name: The PR's title and body follow .github/workflow.json
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/kit/bin/pr_lint.py --github

  # REB-648: Vaultwarden's config and its backup and restore drill. Needs Docker, node and
  # shellcheck, all on the hosted runner. The drill starts the real compose file on
  # throwaway servers, so it also covers the pinned image still existing and answering.
  vaultwarden:
    name: vaultwarden · config and drill
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.vaultwarden == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Scripts
        run: shellcheck projects/vaultwarden/scripts/*.sh projects/vaultwarden/tests/*.sh
      - name: Compose resolves, and publishes on the loopback only
        working-directory: projects/vaultwarden
        env:
          VAULTWARDEN_DATA_DIR: ./config-only-never-mounted
          VAULTWARDEN_SMTP_PASSWORD: x
          VAULTWARDEN_ORG_CREATORS: owner@example.test
          VAULTWARDEN_BACKUP_CERT_B64: x
          VAULTWARDEN_BACKUP_R2_ACCOUNT_ID: x
          VAULTWARDEN_BACKUP_ACCESS_KEY_ID: x
          VAULTWARDEN_BACKUP_SECRET_ACCESS_KEY: x
          VAULTWARDEN_BACKUP_PING_URL: https://hc-ping.example.test/x
        run: |
          set -euo pipefail
          services=$(docker compose -p vaultwarden config --services | sort | tr '\n' ' ')
          test "$services" = 'backup vaultwarden '
          rendered=$(docker compose -p vaultwarden config)
          grep -q 'host_ip: 127.0.0.1' <<< "$rendered"
          if grep -q 'host_ip: 0.0.0.0' <<< "$rendered"; then exit 1; fi
      - name: The host vhost is valid nginx
        run: |
          docker run --rm -v "$PWD/projects/vaultwarden/deploy/vault.letsrebase.conf:/etc/nginx/conf.d/vault.conf:ro" \
            nginx:1.31-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606 nginx -t
      - name: The look is the brand's and readable
        run: node --experimental-strip-types --no-warnings projects/vaultwarden/tests/branding.mjs
      - name: Backup and restore drill
        run: projects/vaultwarden/tests/backup-restore.sh

  # The hub's committed `api-types.ts` is generated from the API's OpenAPI document
  # (`pnpm --filter hub generate:api` dumps `app.openapi()`, so no API is booted); a
  # route or schema change without a regeneration fails here.
  hub-api-types:
    name: hub · api types
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.hub_api_types == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.24'
          enable-cache: true
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile --filter hub...
      - name: Regenerate api-types.ts
        run: pnpm --filter hub generate:api
      - name: Fail if the committed file drifted from the API
        run: git diff --exit-code -- projects/hub/apps/web/src/lib/api-types.ts

  # REB-715, REB-717: the backup and restore drill of Documenso's database and of the
  # hub's. Needs Docker, openssl and shellcheck, all on the hosted runner. It builds the
  # backup services' image and starts the real compose files' databases and the real
  # scripts against throwaway servers (an S3 gateway for R2, a listener for
  # healthchecks.io); Documenso's own image and the hub's are not pulled or built. A hub
  # tag runs it with the rest of the hub, which is what releases the services.
  hub-db-backup:
    name: hub · database backups drill
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.hub_db_backup == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scripts
        run: shellcheck projects/hub/db-backup/scripts/*.sh projects/hub/db-backup/tests/*.sh
      - name: Backup and restore drill
        run: projects/hub/db-backup/tests/backup-restore.sh

  # The checks that are too slow, too host-bound or too network-bound for a pull
  # request and used to live only in `.github/preflight.json`, so that no server ever
  # ran them. They run on the nightly `schedule` and on a manual `workflow_dispatch`,
  # nothing else: the trunk and the PRs keep their latency (CI-A-07).
  nightly-pigrocrm-e2e:
    name: nightly · pigrocrm e2e
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.24'
          enable-cache: true
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile --filter web...
      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      # Boots its own Postgres, migrates, seeds, serves the SPA and drives it.
      - name: End-to-end suite against a real API and Postgres
        run: bash projects/pigrocrm/apps/web/scripts/e2e.sh

  nightly-ui-e2e:
    name: nightly · ui e2e
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter @rebase/ui...
      - name: Install Chromium
        run: pnpm --filter @rebase/ui exec playwright install --with-deps chromium
      - name: Gallery in a real browser
        run: pnpm --filter @rebase/ui test:e2e

  # The three checks below run the very command `preflight.json` names, read from it,
  # so the local lane and this one cannot drift apart.
  nightly-checks:
    name: nightly · compose, wordmark, vhosts
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.24'
          enable-cache: true
      - name: The hub's two compose shapes resolve
        run: jq -r '.checks[] | select(.id == "hub-documenso-compose") | .run' .github/preflight.json | bash -euo pipefail
      - name: The CRM's production shape (backup overlay) resolves
        if: ${{ !cancelled() }}
        working-directory: projects/pigrocrm
        env:
          POSTGRES_PASSWORD: x
          PIGROCRM_APP_PASSWORD: x
          PIGROCRM_JWT_SECRET: config-only-never-used-and-long-enough-for-the-validator
          PIGROCRM_DATA_DIR: ./config-only-never-mounted
          PIGROCRM_BACKUP_CERT_B64: x
          PIGROCRM_BACKUP_R2_ACCOUNT_ID: x
          PIGROCRM_BACKUP_BUCKET: x
          PIGROCRM_BACKUP_ACCESS_KEY_ID: x
          PIGROCRM_BACKUP_SECRET_ACCESS_KEY: x
          PIGROCRM_BACKUP_PING_URL: https://hc-ping.example.test/x
        run: |
          set -euo pipefail
          services=$(docker compose -f docker-compose.yml -f docker-compose.backup.yml config --services | sort | tr '\n' ' ')
          test "$services" = 'api db db-backup mcp migrate web '
      - name: The brand's generated SVGs match their source
        if: ${{ !cancelled() }}
        run: jq -r '.checks[] | select(.id == "wordmark") | .run' .github/preflight.json | bash -euo pipefail
      - name: The live vhosts tell crawlers what the repository says
        if: ${{ !cancelled() }}
        run: jq -r '.checks[] | select(.id == "check-unindexable") | .run' .github/preflight.json | bash -euo pipefail

  # Terraform and every nginx file the repository carries (CI-A-08). `infra/cloudflare`
  # had no check at all; the resource-count rule is the one its README asks a person to
  # run by hand, and the one that failed unnoticed for eight days (REB-195).
  infra:
    name: infra · terraform and nginx
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.infra == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TERRAFORM_IMAGE: hashicorp/terraform:1.13@sha256:6bbb82d575aa7bd4f0a2c6e3a0838ab9590426c08a71d7a2783643f01004d356
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Terraform formatting, init and validate
        working-directory: infra/cloudflare
        run: |
          set -euo pipefail
          tf() { docker run --rm -v "$PWD":/w -w /w "$TERRAFORM_IMAGE" "$@"; }
          tf fmt -check -diff
          tf init -backend=false -input=false
          tf validate
      - name: Every DNS record has an import block
        working-directory: infra/cloudflare
        run: |
          set -euo pipefail
          resources=$(grep -c '^resource "cloudflare_dns_record"' rebase.tf)
          imports=$(grep -c '^  to ' rebase-imports.tf)
          echo "resources=${resources} imports=${imports}"
          test "$resources" = "$imports"
      # REB-914: host names are English, proper nouns allowed (docs/design/DECISIONS.md).
      # The words are the English lint's Italian vocabulary, so this is stdlib Python.
      - name: No DNS record name is Italian
        run: |
          python3 -m unittest discover -s tooling/english-lint -p 'test_check_dns_names.py'
          python3 tooling/english-lint/check_dns_names.py
      - name: The scripts
        run: shellcheck scripts/*.sh
      - name: Every nginx file is valid
        run: bash scripts/check-nginx.sh

  # REB-904: no Italian in an identifier, a file name or a comment. Python is read with
  # tokenize and ast, TypeScript with the `typescript` package the workspace already
  # locks, so the install is that one package and the whole job is seconds. The unit
  # tests plant an Italian name and expect the lint to fail on it. The allowlist and the
  # rules are `tooling/english-lint`; the vocabulary is `docs/glossary.md`'s.
  english-lint:
    name: english · identifiers and comments
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.english_lint == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --filter @rebase/english-lint
      - name: The lint catches a planted Italian name
        run: python3 -m unittest discover -s tooling/english-lint
      - name: The tree is English
        run: python3 tooling/english-lint/english_lint.py

  # A committed secret is in a public repository's history for good, so this runs on
  # every event, with the whole history on a push and a PR (INFRA-A-19). The rules and
  # the few allowed fixtures are `.github/gitleaks.toml`.
  secrets-scan:
    name: secrets · gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the history
        # `safe.directory`: the container's root user does not own the runner's checkout.
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git --no-banner --redact -c .github/gitleaks.toml .

  ci:
    name: ci
    # `always()`, or a skipped dependency makes this job skip too and the check never
    # arrives. This is the only status check the repository should ever be asked to
    # require: every job name above can change forever without touching a ruleset.
    if: always()
    needs: [changes, pigrocrm-py, pigrocrm-py-lint, pigrocrm-web, pigrocrm-web-lint, pigrocrm-api-types, website, website-e2e, hub-py, hub-web, hub-web-lint, hub-api-types, shared-analytics, shared-ui, pigrocrm-images, website-image, hub-images, tooling-starter, kit, vaultwarden, hub-db-backup, infra, english-lint, secrets-scan, nightly-pigrocrm-e2e, nightly-ui-e2e, nightly-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS"
          printf '%s' "$NEEDS" | jq -e '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | length == 0'
