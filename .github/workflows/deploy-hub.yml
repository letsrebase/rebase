# Deploy, for the rebase hub only. Same shape as `deploy-website.yml` and, like it,
# deliberately its own file: two projects in this monorepo must never be able to deploy
# each other. The mechanism is `_deploy-compose.yml`; this file is the two rules that
# say when and the four values that say where.
#
# Preview when CI goes green on main, production on a version tag:
#
#     git tag hub-v0.1.0 && git push origin hub-v0.1.0
#
# The tag deploys the commit it points at. The tag is also a push `ci.yml` listens to,
# so it gets a full CI run of its own, and `_deploy-compose.yml` refuses to deploy until
# that run, the run of the tag itself and not the trunk's for the same commit, is green.
# Both environments stay off until their arming variable exists:
# `vars.HUB_PREVIEW_ENABLED` and `vars.HUB_DEPLOY_ENABLED`.
#
# The production compose project is `rebase`, not `hub`: the stack went up by hand on
# 2026-09-09 (ORB-17) as `orbiters`, and a different name here starts a second stack
# beside the running one rather than moving it. So the host moves first and the tag
# second: stop the old project, move `/srv/orbiters-data` to `/srv/rebase-data`, rename
# the database and the role with `ALTER`, rewrite the `.env` keys to `REBASE_*`, then
# deploy. Both environments were migrated that way on 2026-09-15, preview first.
name: Deploy hub

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['hub-v*']

permissions:
  contents: read
  actions: read

jobs:
  # A push that touched only another project must not rebuild this stack. `ci.yml`'s
  # `changes` job decided that already, from the same paths that select the hub image
  # build, and published it; this reads the answer.
  scope:
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
    steps:
      # Fail open: a missing verdict deploys rather than skips.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: changed-paths
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - id: decide
        env:
          PROJECT: hub
        run: |
          set -euo pipefail
          if [ ! -f changed-paths.json ]; then
            echo "no verdict from CI run ${{ github.event.workflow_run.id }}; deploying rather than skipping"
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cat changed-paths.json
          all=$(jq -r '.all // ""' changed-paths.json)
          mine=$(jq -r --arg p "$PROJECT" '.[$p] // ""' changed-paths.json)
          if [ "$all" = true ] || [ "$mine" = true ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  preview:
    needs: scope
    if: |
      needs.scope.outputs.changed == 'true' &&
      vars.HUB_PREVIEW_ENABLED == 'true'
    concurrency:
      group: deploy-hub-preview
      cancel-in-progress: true
    uses: ./.github/workflows/_deploy-compose.yml
    with:
      environment: hub-preview
      compose-dir: projects/hub
      compose-project: rebase-preview
      ref: ${{ github.event.workflow_run.head_sha }}
      # The API's probe touches the database (SELECT 1), so a green deploy means
      # Postgres is up and migrated, not only that uvicorn answered. The `url` is the
      # preview name, open rather than behind a credential (docs/adding-a-project.md
      # §7): `X-Robots-Tag: noindex, nofollow, noarchive` keeps it out of search, and
      # its vhost proxies preview containers only, so a click here cannot walk out
      # into production data. It has served this stack's `/hub/` since 2026-09-10,
      # the way letsrebase.com serves production's. Ports: the same section.
      health-url: http://127.0.0.1:8086/health
      # The mcp service (REB-213) has a /health of its own on REBASE_MCP_PORT
      # (projects/hub/AGENTS.md), curled here so a crashed mcp container fails the
      # deploy too (REB-246), rather than only showing up when an agent's client
      # gets a 502 from /api/hub/mcp.
      extra-health-url: http://127.0.0.1:8089/health
      url: https://preview.letsrebase.com/hub/
    secrets: inherit

  production:
    if: |
      startsWith(github.ref, 'refs/tags/hub-v') &&
      vars.HUB_DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy-hub-production
      cancel-in-progress: false
    uses: ./.github/workflows/_deploy-compose.yml
    with:
      environment: hub-production
      compose-dir: projects/hub
      compose-project: rebase
      health-url: http://127.0.0.1:8084/health
      extra-health-url: http://127.0.0.1:8088/health
      url: https://letsrebase.com/hub/
    secrets: inherit
