packages:
  # A project is a directory of deployables (`apps/*`) and libraries (`packages/*`), or a
  # single package at its own root (`projects/website`). A directory without a package.json
  # is not a package and pnpm skips it, so `projects/*` does not accidentally make
  # `projects/pigrocrm` one.
  - 'projects/*'
  - 'projects/*/apps/*'
  - 'projects/*/packages/*'
  # Cross-project libraries: anything two projects must agree on rather than each keep a copy
  # of (`shared/brand`: one palette, one typeface, one mark, read by applications built with
  # Tailwind and by a site that deliberately has none). `tooling/*` matches nothing today,
  # which is not an error.
  - 'shared/*'
  - 'tooling/*'

# The single source of truth for build- and test-toolchain versions across every Node
# project in the monorepo. A package writes `"typescript": "catalog:"` and the version
# lives here once, so two projects cannot quietly drift onto two TypeScript majors and
# two ESLint configurations that disagree.
#
# The rule, stated once: everything a project needs in order to be *built, linted and
# tested* belongs in this catalog. What a project ships to its users -- its runtime
# dependencies -- stays in that project's own package.json, because that is a product
# choice and not a monorepo policy.
catalog:
  '@axe-core/playwright': ^4.14.0
  '@eslint/js': ^10.0.1
  '@playwright/test': 1.64.1
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.8
  '@types/node': ^24.19.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  eslint: ^10.14.0
  eslint-plugin-react-hooks: ^7.0.1
  eslint-plugin-react-refresh: ^0.5.7
  globals: ^17.14.0
  jsdom: ^30.1.3
  openapi-typescript: 7.13.0
  typescript: '6.0'
  typescript-eslint: ^8.72.1
  vite: ^8.3.5
  vitest: ^5.0.5

# esbuild compiles a native binary in its install script. Without this it is skipped,
# and pnpm 11 makes that a hard error (ERR_PNPM_IGNORED_BUILDS) rather than a warning,
# so `pnpm install --frozen-lockfile` fails on a clean machine for a reason that reads
# like a broken lockfile.
allowBuilds:
  esbuild: true
  # core-js's install script only prints a funding banner; posthog-js pulls the package
  # in, and pnpm 11 wants an explicit answer rather than a silent skip.
  core-js: false
