packages:
  # A project is usually a directory of deployables (`apps/*`) and libraries
  # (`packages/*`), which is what PigroCRM is. A project small enough to be a single
  # artifact is allowed to be one package at its own root instead of growing an
  # `apps/` directory with exactly one entry in it: `projects/landing` is four HTML
  # pages and three scripts. A directory without a package.json is not a package and
  # pnpm skips it, so `projects/*` does not accidentally make `projects/pigrocrm` one.
  - 'projects/*'
  - 'projects/*/apps/*'
  - 'projects/*/packages/*'
  # Cross-project libraries: anything two projects must agree on rather than each
  # keep a copy of. `shared/brand` is the first, and it exists because the CRM and
  # the community landing are the same brand: one palette, one typeface, one mark,
  # read by an application built with Tailwind and by a landing that deliberately has
  # no Tailwind at all. `tooling/*` is for shared build and lint configuration and is
  # still empty; a glob matching nothing is not an error.
  - 'shared/*'
  - 'tooling/*'

# The single source of truth for build- and test-toolchain versions across every Node
# project in the monorepo. A package writes `"typescript": "catalog:"` and the version
# lives here once, so two projects cannot quietly drift onto two TypeScript majors and
# two ESLint configurations that disagree.
#
# The rule, stated once: everything a project needs in order to be *built, linted and
# tested* belongs in this catalog. What a project ships to its users -- its runtime
# dependencies -- stays in that project's own package.json, because that is a product
# choice and not a monorepo policy.
catalog:
  '@axe-core/playwright': ^4.13.0
  '@eslint/js': ^9.39.1
  '@playwright/test': 1.63.0
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.7
  '@types/node': ^24.13.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.1
  eslint: ^9.39.1
  eslint-plugin-react-hooks: ^7.0.1
  eslint-plugin-react-refresh: ^0.4.24
  globals: ^17.12.0
  jsdom: ^30.0.1
  openapi-typescript: 7.13.0
  typescript: '6.0'
  typescript-eslint: ^8.70.0
  vite: ^8.3.0
  vitest: ^4.1.10

# esbuild compiles a native binary in its install script. Without this it is skipped,
# and pnpm 11 makes that a hard error (ERR_PNPM_IGNORED_BUILDS) rather than a warning,
# so `pnpm install --frozen-lockfile` fails on a clean machine for a reason that reads
# like a broken lockfile.
allowBuilds:
  esbuild: true
  # core-js's install script only prints a funding banner; posthog-js pulls the package
  # in, and pnpm 11 wants an explicit answer rather than a silent skip.
  core-js: false
