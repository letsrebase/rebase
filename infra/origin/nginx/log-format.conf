# The origin's access log (REB-714), installed as /etc/nginx/conf.d/log-format.conf.
#
# It is nginx's `combined` with the requested host appended as a last quoted field, so
# a tool that reads `combined` still parses every line, and one vhost's traffic can be
# told from another's. Before it the log had no host at all, and REB-670 could only infer
# the retired CRM host from its 308 status.
#
# The `access_log` line lives here rather than in nginx.conf because a format has to be
# declared before the line that names it, and nginx.conf reads conf.d after its own
# `access_log`. On the origin, nginx.conf's own line is commented out with a pointer to
# this file; two `access_log` lines at the http level would write every request twice.

# The request line is logged without its query string, and a Documenso signing link
# (`/sign/<token>`) without its token (INFRA-A-02): a magic link, an unsubscribe link and a
# team answer carry their credential as `?t=`, and a log that keeps it is a list of live
# credentials. One rule here covers every vhost, so no location needs its own `access_log
# off` to stay out of the log (the CRM's still have them, and they cost nothing).
map $request $loggable_request {
    ~^(?<lr_method>\S+)\s+/sign/[^?\s]*\S*\s+(?<lr_proto>\S+)$  "$lr_method /sign/[redacted] $lr_proto";
    ~^(?<lr_method>\S+)\s+(?<lr_path>[^?\s]+)\S*\s+(?<lr_proto>\S+)$  "$lr_method $lr_path $lr_proto";
    default                                               $request;
}

log_format rebase_combined_host '$remote_addr - $remote_user [$time_local] '
                                '"$loggable_request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" "$host"';

access_log /var/log/nginx/access.log rebase_combined_host;
