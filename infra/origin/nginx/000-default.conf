# The origin's catch-all (REB-714), installed as
# /etc/nginx/sites-available/000-default.conf and linked from sites-enabled.
#
# Without it, a request whose name no vhost carries (the bare IP, a made-up Host, a
# retired name a proxy still sends here) is served by whichever vhost nginx reads first,
# and on 443 that was firma.letsrebase.conf: Documenso's sign-in answered on any name.
# Here such a request gets nothing: plain HTTP is closed without a response (444) and
# TLS is refused at the handshake, so no certificate of ours is shown either.
#
# Every named vhost still answers its own names on the addresses it listens on, since
# nginx picks a server by its server_name among those before it falls back to the default
# one. On IPv6 only firma and vault listen on [::]; the other names are IPv4 only (no AAAA
# record exists), so a v6 client for them reaches this block, as it reached firma's
# before. Certbot's HTTP-01 challenge carries the real name, so renewals never reach this
# block. The deploy health checks curl container ports on 127.0.0.1 and never go through
# nginx.
#
# No `ipv6only` here: firma.letsrebase.conf already sets it on [::]:443, and nginx accepts
# a socket option on one listen of a socket only.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
