# Per-address request limits for the origin (INFRA-A-14), installed as
# /etc/nginx/conf.d/rate-limits.conf. The applications' own limiters are per process and per
# worker, so this is the real cap in front of them; the vhosts name a zone with `limit_req`
# on the endpoints that are worth abusing. Zones are declared once here, at the `http`
# level, because a vhost file declaring them again (production and preview both exist) would
# fail `nginx -t` with a duplicate zone. `$binary_remote_addr` is the visitor's own address:
# nothing sits in front of this nginx.
#
# A key that is empty is never limited, which is how `pigro_signup` counts only the POSTs.

# PigroCRM: space creation (`POST /api/tenants/`, `/api/tenants/member`), the login family,
# the slug typeahead and the MCP endpoint.
map $request_method $pigro_signup_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $pigro_signup_key        zone=pigro_signup:10m    rate=6r/m;
limit_req_zone $binary_remote_addr      zone=pigro_typeahead:10m rate=60r/m;
limit_req_zone $binary_remote_addr      zone=pigro_auth:10m      rate=30r/m;
limit_req_zone $binary_remote_addr      zone=pigro_mcp:10m       rate=300r/m;
limit_req_status 429;
