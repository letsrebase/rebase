# Per-address request limits for the origin (INFRA-A-14), installed as
# /etc/nginx/conf.d/rate-limits.conf. The applications' own limiters are per process and per
# worker, so this is the real cap in front of them; the vhosts name a zone with `limit_req`
# on the endpoints that are worth abusing. Zones are declared once here, at the `http`
# level, because a vhost file declaring them again (production and preview both exist) would
# fail `nginx -t` with a duplicate zone. `$binary_remote_addr` is the visitor's own address:
# nothing sits in front of this nginx.
#
# The hub keys on the visitor's network, not the raw address: an IPv6 client is limited by its
# /64 (one subscriber owns billions of addresses), an IPv4-mapped one by its IPv4.
#
# A key that is empty is never limited, which is how the zones below count only the POSTs.
# `limit_req_status 429` is set in each location that limits, not here: an http-level status
# would change the over-limit answer of every vhost on the host.

# PigroCRM: space creation (`POST /api/tenants/`, `/api/tenants/member`), the endpoints that
# issue a credential (`POST` login, link, verify, invite and the identity's enter and invite;
# never `me`, `refresh`, `logout` or the space list, which the SPA calls all day), the slug
# typeahead and the MCP endpoint.
map $request_method $pigro_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $pigro_post_key          zone=pigro_signup:10m    rate=6r/m;
limit_req_zone $binary_remote_addr      zone=pigro_typeahead:10m rate=60r/m;
limit_req_zone $pigro_post_key          zone=pigro_auth:10m      rate=30r/m;
limit_req_zone $binary_remote_addr      zone=pigro_mcp:10m       rate=300r/m;

# The rebase hub: the wizard's signup (`POST /api/hub/freelancers`, `/api/community/signups`),
# the magic-link family, the member lookup and the admin MCP. The app's own limiter is the
# floor (5 a minute per client); this is the cap in front of it. The webhooks (Resend,
# Documenso) are not limited: they come from a few sender addresses in bursts, and a 429 there
# only makes the sender retry.
map $remote_addr $rebase_client {
    ~^(?<rc_v4>\d+\.\d+\.\d+\.\d+)$                              $rc_v4;
    ~^::ffff:(?<rc_mapped>\d+\.\d+\.\d+\.\d+)$                    $rc_mapped;
    ~^(?<rc_net6>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):          $rc_net6;
    default                                                       $remote_addr;
}
map $request_method $rebase_write_key {
    POST    $rebase_client;
    default "";
}
limit_req_zone $rebase_write_key zone=rebase_write:10m rate=6r/m;
limit_req_zone $rebase_write_key zone=rebase_auth:10m  rate=10r/m;
limit_req_zone $rebase_client zone=rebase_door:10m  rate=60r/m;
limit_req_zone $rebase_client zone=rebase_mcp:10m   rate=120r/m;
